name: Build note summer 107 cards

on:
  push:
    branches: [main]
    paths:
      - data/note-summer-magazine-107-urls.txt
      - scripts/build-note-summer-cards.mjs
      - .github/workflows/build-note-summer-cards.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-summer-107-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image and Japanese font support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --ignore-scripts=false sharp@0.34.3
      - name: Generate and verify 107 cards
        run: node scripts/build-note-summer-cards.mjs
      - name: Commit prepared cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/note-summer-107
          git diff --cached --quiet && exit 0
          git commit -m "Prepare 107 summer magazine cards"
          git push
