name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v13-maintenance-20260930
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Enforce one-feature-per-update boundary
        run: node scripts/check-feature-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 6
      - name: Check current userscript syntax
        run: |
          node --check public/note-insight-notification-dock-watch-v312.js
          node --check public/note-insight-notification-reader-v322.js
          node --check public/note-insight-notification-loader-v318.js
          node --check public/note-insight-dashboard-integrated-v318.js
          node --check public/note-insight-social-compare-v1.js
          node --check public/note-insight-notification-v3.user.js
          node --check public/note-insight-notification-network-v3300.js
          node --check public/note-insight-notification-reader-v4.js
          node --check public/note-insight-notification-controls-v1.js
          node --check public/note-insight-notification-filter-v4.js
          node --check public/note-insight-notification-feature-bridge-v1.js
          node --check public/note-insight-notification-status-bridge-v1.js
          node --check public/note-insight-notification-sync.user.js
          node --check public/note-insight-dm.user.js
          node --check public/note-insight-dm-network-v2.js
          node --check public/note-insight-dm-reader-v1.js
          node --check public/dashboard-setup.js
          node --check public/note-insight-dashboard-sync.user.js
          node --check public/note-insight-dashboard-feature-bridge-v1.js
          node --check public/note-insight-dashboard-sync-core-v1.1.0.js
          node --check public/note-pon-editor-v6.user.js
      - name: Card tool 18.9.x safety and bundle verification
        run: |
          node scripts/build-card-userscript.mjs --check
          node --check public/note-card-batch-bridge-v610.user.js
          node --test tests/card-live-v18918.test.mjs
          node --check public/note-card-isolated-retest-v1.user.js
          node --test tests/card-isolated-retest-v1.test.mjs
          node --check public/note-profile-card-paster-v1.user.js
          node --test tests/profile-card-paster-v1.test.mjs
      - run: npm run build
      # Emergency maintenance deploy: full regressions resume before maintenance is lifted.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

