name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v14-maintenance-filter-urgent-20261001
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Enforce one-feature-per-update boundary
        run: node scripts/check-feature-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 6
      - name: Check current userscript syntax
        run: |
          node --check public/note-insight-notification-dock-watch-v312.js
          node --check public/note-insight-notification-reader-v322.js
          node --check public/note-insight-notification-loader-v318.js
          node --check public/note-insight-dashboard-integrated-v318.js
          node --check public/note-insight-social-compare-v1.js
          node --check public/note-insight-notification-v3.user.js
          node --check public/note-insight-notification-network-v3300.js
          node --check public/note-insight-notification-reader-v4.js
          node --check public/note-insight-notification-controls-v1.js
          node --check public/note-insight-notification-filter-v4.js
          node --check public/note-insight-notification-feature-bridge-v1.js
          node --check public/note-insight-notification-status-bridge-v1.js
          node --check public/note-insight-notification-sync.user.js
          node --check public/note-insight-dm.user.js
          node --check public/note-insight-dm-network-v2.js
          node --check public/note-insight-dm-reader-v1.js
          node --check public/public-analysis-motion.js
          node --check public/dashboard-setup.js
          node --check public/note-insight-dashboard-sync.user.js
          node --check public/note-insight-dashboard-feature-bridge-v1.js
          node --check public/note-insight-dashboard-sync-core-v1.1.0.js
          node --check public/note-insight-dashboard-save-queue-v1.js
          node --check public/note-pon-editor-v6.user.js
      - name: Check profile thumbnails, unique creators and final extra entry
        run: node --test tests/profile-card-paster-v230.test.mjs tests/profile-export-session.test.mjs tests/editor-isolation.test.mjs
      # Emergency maintenance/filter deploy: card-tool regressions are unrelated and temporarily skipped.
      - run: npm run build
      - name: Check startup under full storage and legacy browser APIs
        run: node --experimental-vm-modules --test tests/boot-resilience.test.mjs tests/browser-storage-quota.test.mjs tests/storage-archive.test.mjs tests/service-worker-asset-reuse.test.mjs
      - name: Check entry motion and retained notification behavior
        run: node --test tests/pc-display-mode.test.mjs tests/insight-entry-motion-v20.test.mjs tests/notification-connection-v21.test.mjs tests/notification-connection-navigation.test.mjs tests/auth-storage-recovery-v2.test.mjs tests/manual-login-navigation.test.mjs tests/recovery-other-device.test.mjs tests/notification-auth-v363.test.mjs tests/notification-feature-v366.test.mjs tests/notification-filter-pagination-v423.test.mjs tests/notification-filter-pagination-v425.test.mjs
      - name: Check applicant approval and owner notification scope
        run: node --test tests/application-approval.test.mjs
      - name: Check stable DM status and row-scoped filters
        run: node --experimental-vm-modules --test tests/dm-status-v1410.test.mjs tests/dm-view-v1410.test.mjs tests/dm-composer-v143.test.mjs tests/dm-resume-v140.test.mjs tests/reader-analysis-v362.test.mjs tests/notification-filter-return.test.mjs tests/tools-release-v22.test.mjs
      - name: Check notification feed saved order
        run: node --experimental-vm-modules --test tests/notification-save-order.test.mjs tests/notification-board-storage.test.mjs
      - name: Check magazine search and creator presentation
        run: node --test tests/magazine-search-v23.test.mjs tests/creator-scene-v23.test.mjs
      - name: Check analysis navigation, settings and retained data presentation
        run: node --experimental-vm-modules --test tests/analysis-menu-v26.test.mjs tests/dashboard-setup.test.mjs tests/public-analysis-counts.test.mjs tests/notification-presentation-v360.test.mjs tests/like-completion-current.test.mjs tests/notification-context-v28.test.mjs tests/notification-handling-v29.test.mjs tests/handling-immediate-v30.test.mjs
      - name: Check retained notification differences and saving after stop
        run: node --experimental-vm-modules --test tests/notification-v2968.test.mjs tests/notification-window-v360.test.mjs
      - name: Check fresh startup, resume, and cancelled requests
        run: node --experimental-vm-modules --test tests/startup-freshness.test.mjs tests/comments-startup-freshness.test.mjs tests/secondary-view-freshness.test.mjs tests/analysis-view-freshness.test.mjs
      - name: Check startup traffic, session reuse and account logout
        run: node --experimental-vm-modules --test tests/account-logout-ownership.test.mjs tests/app-session-refresh.test.mjs tests/session-request-single-flight.test.mjs tests/app-startup-session-gate.test.mjs tests/app-route-loading-budget.test.mjs tests/screen-loader-recovery.test.mjs tests/insight-scene-loading-budget.test.mjs tests/unified-startup-requests.test.mjs tests/notification-startup-request-budget.test.mjs tests/notification-selected-page-budget.test.mjs tests/notification-category-recovery.test.mjs tests/insight-shell-request-budget.test.mjs tests/insight-shell-refresh-signals.test.mjs
      - name: Check comment collection, independent public sync, and direct-room DM saving
        run: node --experimental-vm-modules --test tests/comment-refresh-recovery.test.mjs tests/public-sync-isolation.test.mjs tests/dm-direct-room-ingest.test.mjs
      - name: Check DM save recovery, fresh history, and reader startup
        run: node --experimental-vm-modules --test tests/dm-summary-saved-time.test.mjs tests/dm-feed-egress.test.mjs tests/dm-ui-freshness-recovery.test.mjs tests/dm-network-lifecycle.test.mjs tests/dm-network-recovery.test.mjs tests/dm-room-capacity.test.mjs tests/dm-reader-identity-lifecycle.test.mjs
      - name: Check read RPC results and permissions
        run: node --test tests/insight-rpc-read-performance.test.mjs tests/notification-feed-page-rpc.test.mjs tests/notification-store-started.test.mjs
      - name: Check retained social views and differences
        run: node --experimental-vm-modules --test tests/social-mutual-v1.test.mjs tests/social-history-v1.test.mjs tests/social-comparison-review-v1.test.mjs tests/social-view-cache.test.mjs
      - name: Check manual dashboard panel and durable save queue
        run: node --experimental-vm-modules --test tests/dashboard-feature-toggle.test.mjs tests/dashboard-panels-v148.test.mjs tests/dashboard-save-confirmation.test.mjs tests/dashboard-save-queue.test.mjs tests/dashboard-daily-v146.test.mjs tests/dashboard-read-egress.test.mjs
      - name: Check retained views, reply bodies and notification pagination
        run: node --experimental-vm-modules --test tests/view-retention-lifecycle.test.mjs tests/notification-pagination-lifecycle.test.mjs tests/notification-view-reuse.test.mjs tests/notification-legacy-body-v17.test.mjs tests/notification-comment-retention-ingest.test.mjs tests/notification-comment-locator.test.mjs tests/unified-view-retention.test.mjs tests/dm-view-retention.test.mjs tests/magazine-view-retention.test.mjs
      - name: Check saved pages, account boundaries and bounded history loading
        run: node --experimental-vm-modules --test tests/saved-view-scope.test.mjs tests/likes-saved-view.test.mjs tests/notification-saved-view.test.mjs tests/dm-saved-page.test.mjs tests/social-saved-display.test.mjs tests/favorites-saved-display.test.mjs tests/magazine-saved-view.test.mjs tests/ranking-saved-pages.test.mjs tests/ranking-cold-start.test.mjs tests/unified-late-storage.test.mjs tests/member-history-errors.test.mjs
      - name: Check owner DM retention and independent device sessions
        run: node --test --test-concurrency=1 tests/owner-dm-retention.test.mjs
      - name: Check DM request ordering and person switching
        run: node --experimental-vm-modules --test --test-name-pattern='DM本文の遅い取得' tests/analysis-repair-v147.test.mjs
      # Emergency maintenance deploy: full regressions resume before maintenance is lifted.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
