name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v5-card-18918-20260925
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Enforce one-feature-per-update boundary
        run: node scripts/check-feature-boundaries.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 6
      - name: Check current userscript syntax
        run: |
          node --check public/note-insight-notification-dock-watch-v312.js
          node --check public/note-insight-notification-reader-v322.js
          node --check public/note-insight-notification-loader-v318.js
          node --check public/note-insight-dashboard-integrated-v318.js
          node --check public/note-insight-social-compare-v1.js
          node --check public/note-insight-notification-v3.user.js
          node --check public/note-insight-notification-network-v3300.js
          node --check public/note-insight-notification-reader-v4.js
          node --check public/note-insight-notification-controls-v1.js
          node --check public/note-insight-notification-feature-bridge-v1.js
          node --check public/note-insight-notification-status-bridge-v1.js
          node --check public/note-insight-notification-sync.user.js
          node --check public/note-insight-dm.user.js
          node --check public/note-insight-dm-network-v2.js
          node --check public/note-insight-dm-reader-v1.js
          node --check public/dashboard-setup.js
          node --check public/note-insight-dashboard-sync.user.js
          node --check public/note-pon-editor-v6.user.js
      - name: Card tool 18.9.x safety and bundle verification
        run: |
          node scripts/build-card-userscript.mjs --check
          node --check public/note-card-batch-bridge-v610.user.js
          node --test tests/card-live-v18918.test.mjs
      - run: npm run build
      - name: Unified INSIGHT regression tests
        run: node --test tests/insight-core-v2919.test.mjs tests/auth-storage-recovery-v2.test.mjs tests/favorite-reader-current.test.mjs tests/notification-v2919.test.mjs tests/notification-dock-scope.test.mjs tests/notification-v3-return.test.mjs tests/polish-regression.test.mjs tests/notification-v2968.test.mjs tests/notification-dom.test.mjs
      - name: Notification continuation, display, DM and chart behavior
        run: node --experimental-vm-modules --test tests/notification-window-v360.test.mjs tests/notification-presentation-v360.test.mjs tests/dm-resume-v140.test.mjs tests/social-history-v1.test.mjs tests/social-mutual-v1.test.mjs tests/social-comparison-review-v1.test.mjs tests/reader-controls-v361.test.mjs tests/reader-analysis-v362.test.mjs tests/dashboard-setup.test.mjs tests/dm-composer-v143.test.mjs tests/dm-history-v144.test.mjs tests/dm-room-v145.test.mjs tests/insight-navigation-v145.test.mjs tests/dashboard-daily-v146.test.mjs tests/notification-formats-v364.test.mjs tests/notification-split-v340.test.mjs tests/analysis-repair-v147.test.mjs tests/top-panel-stability-v1.test.mjs tests/dashboard-panels-v148.test.mjs tests/top-update-actions-v1.test.mjs tests/notification-feature-v366.test.mjs tests/notification-token-purpose.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

