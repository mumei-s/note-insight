name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 6
      - name: Check notification userscript syntax
        run: |
          node --check public/note-insight-notification-sync.user.js
          node --check public/note-insight-notification-runtime-v2915-patch.js
          node --check public/note-insight-notification-runtime-v2917-patch.js
      - run: npm run build
      - name: Unified INSIGHT regression tests
        run: node --test tests/insight-current.test.mjs tests/favorite-reader-current.test.mjs tests/notification-sync.test.mjs tests/polish-regression.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4