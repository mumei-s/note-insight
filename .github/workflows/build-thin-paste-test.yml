name: Build thin paste test asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-thin-paste-test.yml'
      - 'public/note-paste-test/rebuild.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare fonts and real thumbnail
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          python - <<'PY'
          import requests, pathlib
          url='https://assets.st-note.com/production/uploads/images/304306897/rectangle_large_type_2_78560e8d4aac7e4a80edf19e8682fb7b.jpeg?fit=bounds&quality=95&width=1280'
          p=pathlib.Path('/tmp/thumb.jpg')
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          r.raise_for_status(); p.write_bytes(r.content)
          print('thumb',len(r.content))
          PY
      - name: Render 1160x192 HD thin card with Chrome
        run: |
          cat >/tmp/card.html <<'HTML'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html,body{margin:0;width:1160px;height:192px;overflow:hidden;background:white}
          body{font-family:"Noto Sans CJK JP","Noto Color Emoji",sans-serif}
          .card{width:1160px;height:192px;border:2px solid #ddd;border-radius:22px;background:#fff;display:flex;align-items:stretch;overflow:hidden}
          .left{width:702px;padding:16px 18px 14px 22px;display:flex;flex-direction:column;justify-content:space-between}
          .title{font-size:28px;line-height:1.3;font-weight:800;color:#151a21;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .creator{font-size:22px;line-height:1.2;color:#555d69;white-space:nowrap}
          .thumbWrap{width:458px;height:192px;padding:18px 18px 18px 0;display:flex;align-items:center;justify-content:center}
          .thumb{width:440px;height:156px;border-radius:12px;object-fit:contain;background:#fff;display:block}
          </style></head><body>
          <div class="card">
            <div class="left"><div class="title">【言葉と行動、その間にあるもの】 第2回スキ動画コンテスト『夏の陣』🏖</div><div class="creator">無名S note</div></div>
            <div class="thumbWrap"><img class="thumb" src="file:///tmp/thumb.jpg"></div>
          </div>
          </body></html>
          HTML
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1160,192 --screenshot=public/note-paste-test/thin-card.png file:///tmp/card.html
          file public/note-paste-test/thin-card.png
      - name: Commit generated PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/note-paste-test/thin-card.png
          git diff --cached --quiet && exit 0
          git commit -m 'Generate 1160x192 HD thin paste card'
          git push
