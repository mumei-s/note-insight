name: Build thin paste test asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-thin-paste-test.yml'
      - 'public/note-paste-test/rebuild.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install pillow requests
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Build compact ultra-thin PNG from real note thumbnail
        run: |
          python - <<'PY'
          import io, os, requests
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          THUMB='https://assets.st-note.com/production/uploads/images/304306897/rectangle_large_type_2_78560e8d4aac7e4a80edf19e8682fb7b.jpeg?fit=bounds&quality=90&width=1280'
          TITLE='【言葉と行動、その間にあるもの】 第2回スキ動画コンテスト『夏の陣』🏖'
          NAME='無名 S note'
          out='public/note-paste-test/thin-card.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)

          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          r=s.get(THUMB,timeout=30); r.raise_for_status()
          thumb=Image.open(io.BytesIO(r.content)).convert('RGB')

          W,H=900,140
          img=Image.new('RGB',(W,H),(255,255,255))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle((1,1,W-2,H-2),radius=15,fill=(255,255,255),outline=(225,225,225),width=2)
          font_path='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          reg_path='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'

          tw,th=320,112
          thumb_fit=ImageOps.contain(thumb,(tw,th),Image.Resampling.LANCZOS)
          tx=W-14-tw; ty=(H-th)//2
          bg=Image.new('RGB',(tw,th),'white')
          bg.paste(thumb_fit,((tw-thumb_fit.width)//2,(th-thumb_fit.height)//2))
          mask=Image.new('L',(tw,th),0)
          ImageDraw.Draw(mask).rounded_rectangle((0,0,tw-1,th-1),radius=8,fill=255)
          img.paste(bg,(tx,ty),mask)

          maxw=tx-32
          chosen=None
          for size in range(28,17,-1):
              tf=ImageFont.truetype(font_path,size)
              lines=[]; cur=''
              for ch in TITLE:
                  cand=cur+ch
                  if d.textbbox((0,0),cand,font=tf)[2] <= maxw-22:
                      cur=cand
                  else:
                      if cur: lines.append(cur)
                      cur=ch
              if cur: lines.append(cur)
              if len(lines)<=2:
                  chosen=(tf,lines); break
          if chosen is None:
              tf=ImageFont.truetype(font_path,18); lines=[TITLE[:31],TITLE[31:62]]
          else:
              tf,lines=chosen
          y=14
          for line in lines[:2]:
              d.text((18,y),line,font=tf,fill=(20,26,34))
              y=d.textbbox((18,y),line,font=tf)[3]

          nf=ImageFont.truetype(reg_path,18)
          d.text((20,H-29),NAME,font=nf,fill=(72,79,91))
          img.save(out,'PNG',optimize=True)
          print('saved',out,img.size)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/note-paste-test/thin-card.png
          git diff --cached --quiet && exit 0
          git commit -m 'Generate compact thin paste test card'
          git push
