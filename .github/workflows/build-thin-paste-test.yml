name: Build thin paste test asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-thin-paste-test.yml'
      - 'public/note-paste-test/rebuild.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Build thin PNG from real note assets
        run: |
          python - <<'PY'
          import io, os, requests
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          THUMB='https://assets.st-note.com/production/uploads/images/304306897/rectangle_large_type_2_78560e8d4aac7e4a80edf19e8682fb7b.jpeg?fit=bounds&quality=85&width=1280'
          ICON='https://assets.st-note.com/production/uploads/images/280421627/profile_54172438db482342de0ca9ef8c6395ec.jpg?fit=bounds&format=jpeg&quality=85&width=330'
          TITLE='【言葉と行動、その間にあるもの】 第2回スキ動画コンテスト『夏の陣』🏖'
          NAME='無名 S note'
          out='public/note-paste-test/thin-card.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)

          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          thumb=Image.open(io.BytesIO(s.get(THUMB,timeout=30).content)).convert('RGB')
          icon=Image.open(io.BytesIO(s.get(ICON,timeout=30).content)).convert('RGB')

          W,H=1500,240
          img=Image.new('RGB',(W,H),(255,255,255))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle((2,2,W-3,H-3),radius=22,fill=(255,255,255),outline=(225,225,225),width=2)
          font_path='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          reg_path='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'

          # right thumbnail: preserve entire real thumbnail, no cropping
          tw,th=520,198
          thumb_fit=ImageOps.contain(thumb,(tw,th),Image.Resampling.LANCZOS)
          tx=W-24-tw; ty=(H-th)//2
          bg=Image.new('RGB',(tw,th),'white')
          bg.paste(thumb_fit,((tw-thumb_fit.width)//2,(th-thumb_fit.height)//2))
          mask=Image.new('L',(tw,th),0); ImageDraw.Draw(mask).rounded_rectangle((0,0,tw-1,th-1),radius=12,fill=255)
          img.paste(bg,(tx,ty),mask)

          # title, max two lines
          maxw=tx-64
          size=44
          while size>=24:
              f=ImageFont.truetype(font_path,size)
              lines=[]; cur=''
              for ch in TITLE:
                  cand=cur+ch
                  if d.textbbox((0,0),cand,font=f)[2] <= maxw:
                      cur=cand
                  else:
                      lines.append(cur); cur=ch
              if cur: lines.append(cur)
              if len(lines)<=2: break
              size-=2
          y=32
          for line in lines[:2]:
              d.text((34,y),line,font=f,fill=(20,26,34))
              y=d.textbbox((34,y),line,font=f)[3]+4

          # avatar + creator
          avs=52
          av=ImageOps.fit(icon,(avs,avs),Image.Resampling.LANCZOS)
          am=Image.new('L',(avs,avs),0); ImageDraw.Draw(am).ellipse((0,0,avs-1,avs-1),fill=255)
          ay=H-24-avs
          img.paste(av,(36,ay),am)
          nf=ImageFont.truetype(reg_path,27)
          d.text((36+avs+15,ay+8),NAME,font=nf,fill=(72,79,91))
          img.save(out,optimize=True)
          print(out)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/note-paste-test/thin-card.png
          git diff --cached --quiet && exit 0
          git commit -m 'Generate thin paste test card [skip ci]'
          git push
