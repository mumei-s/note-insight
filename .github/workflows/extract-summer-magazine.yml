name: Extract summer magazine URLs

on:
  push:
    branches:
      - extract-summer-magazine-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install selenium requests
      - name: Verify live count and extract URLs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          TARGET = 'https://note.com/ai_naoyuki/m/m7ffeddfdfb3c'
          META = 'https://note.com/api/v1/magazines/m7ffeddfdfb3c'

          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/138 Safari/537.36','Accept-Language':'ja-JP,ja;q=0.9'})
          r = s.get(META, timeout=30)
          print('META_STATUS=', r.status_code)
          try:
              j = r.json()
              d = j.get('data', j) if isinstance(j, dict) else {}
              print('API_NOTE_COUNT=', d.get('note_count'))
              print('API_NAME=', d.get('name'))
              print('API_KEY=', d.get('key'))
          except Exception as e:
              print('META_JSON_ERROR=', repr(e))
              print(r.text[:1000])

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,5000')
          opts.add_argument('--lang=ja-JP')
          opts.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138 Safari/537.36')
          driver = webdriver.Chrome(options=opts)
          try:
              driver.get(TARGET)
              time.sleep(8)
              body = driver.find_element(By.TAG_NAME, 'body').text
              print('BODY_COUNT_CANDIDATES=', re.findall(r'(?m)^\s*(\d+)本\s*$', body)[:10])
              print('BODY_HEAD=', repr(body[:1200]))

              # Trigger any lazy content without following links.
              for i in range(8):
                  old_h = driver.execute_script('return document.body.scrollHeight')
                  driver.execute_script('window.scrollTo(0, document.body.scrollHeight)')
                  time.sleep(1.5)
                  new_h = driver.execute_script('return document.body.scrollHeight')
                  if new_h == old_h:
                      break

              urls=[]; seen=set()
              for a in driver.find_elements(By.CSS_SELECTOR, 'a[href]'):
                  href=a.get_attribute('href') or ''
                  m=re.match(r'^https://note\.com/([^/?#]+)/n/(n[0-9a-z]+)(?:[?#].*)?$', href, re.I)
                  if m:
                      clean=f'https://note.com/{m.group(1)}/n/{m.group(2)}'
                      if clean not in seen:
                          seen.add(clean); urls.append(clean)

              # Article-heading links only, for comparison.
              hurls=[]; hseen=set()
              for h in driver.find_elements(By.CSS_SELECTOR, 'h2,h3,h4'):
                  try:
                      a = h.find_element(By.XPATH, './ancestor-or-self::a[1]')
                  except Exception:
                      try:
                          a = h.find_element(By.CSS_SELECTOR, 'a[href]')
                      except Exception:
                          continue
                  href=a.get_attribute('href') or ''
                  m=re.match(r'^https://note\.com/([^/?#]+)/n/(n[0-9a-z]+)(?:[?#].*)?$', href, re.I)
                  if m:
                      clean=f'https://note.com/{m.group(1)}/n/{m.group(2)}'
                      if clean not in hseen:
                          hseen.add(clean); hurls.append((clean,h.text.strip()))

              print('ALL_UNIQUE_COUNT=', len(urls))
              print('HEADING_UNIQUE_COUNT=', len(hurls))
              print('===ALL_URLS_START===')
              for u in urls: print(u)
              print('===ALL_URLS_END===')
              print('===HEADING_URLS_START===')
              for u,t in hurls: print(u+'\t'+t.replace('\n',' '))
              print('===HEADING_URLS_END===')
          finally:
              driver.quit()
          PY
