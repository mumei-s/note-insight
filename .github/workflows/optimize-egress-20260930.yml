name: INSIGHT egress validation 20260930
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-egress-20260930.yml
      - tests/egress-runtime-20260930.test.mjs
      - supabase/functions/_shared/egress-20260930.ts
      - supabase/functions/insight-like-backfill/index.ts
      - supabase/functions/insight-comment-refresh/index.ts
      - supabase/functions/insight-avatar-refresh/index.ts
      - supabase/functions/insight-relations/index.ts
      - supabase/functions/insight-notifications/index.ts
permissions:
  contents: read
concurrency:
  group: insight-egress-validation-20260930
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Maintenance, authorization and quota regressions (mocked network)
        run: node tests/egress-runtime-20260930.test.mjs
      - name: Type-check modified Edge functions
        run: |
          deno check --node-modules-dir=auto --no-lock supabase/functions/insight-like-backfill/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/insight-comment-refresh/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/insight-avatar-refresh/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/insight-relations/index.ts
          deno check --node-modules-dir=auto --no-lock supabase/functions/insight-notifications/index.ts
      - name: Build unchanged frontend
        run: npm ci --prefer-offline --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: insight-egress-tested-sources
          path: |
            supabase/functions/_shared/egress-20260930.ts
            supabase/functions/insight-like-backfill/index.ts
            supabase/functions/insight-comment-refresh/index.ts
            supabase/functions/insight-avatar-refresh/index.ts
            supabase/functions/insight-relations/index.ts
            supabase/functions/insight-notifications/index.ts
          retention-days: 7
