      #insight-static-boot p{margin:0;font:12px/1.7 system-ui}
      #insight-static-boot button{padding:12px 16px;border:1px solid #70dff6;border-radius:10px;background:#174f62;color:#e7faff;font:700 12px system-ui}

    <title>無名S note｜INSIGHT</title>
  </head>
  <body>
    <div id="root">
      <main id="insight-static-boot" role="status" aria-live="polite">
        <p id="insight-static-message">INSIGHTを読み込んでいます…</p>
        <button type="button" id="insight-display-repair" hidden>表示キャッシュを更新して再読込</button>
      </main>
    </div>
    <script>
      (function () {
        const BOOT_ID = "insight-static-boot";
        const MESSAGE_ID = "insight-static-message";
        const ROOT_ID = "root";
        let startupFailure = "";

        function hasLiveApp() {
          const root = document.getElementById(ROOT_ID);
          return Boolean(root && Array.from(root.children).some((child) => child.id !== BOOT_ID));
        }

        function clearStaleFallback() {
          if (!hasLiveApp()) return;
          document.querySelectorAll("#" + BOOT_ID).forEach((boot) => boot.remove());
        }

        // React can briefly empty its container before committing a route. An
        // early optional error must not leave a second, body-mounted screen over it.
        const root = document.getElementById(ROOT_ID);
        if (root) new MutationObserver(clearStaleFallback).observe(root, { childList: true });

        function failureMessage(error) {
          const name = String(error && error.name || "Error");
          if (/QuotaExceeded/.test(name)) return "ブラウザ内の保存枠への書き込みが拒否されました（QuotaExceededError）。ログイン情報は消していません。";
          if (/SecurityError/.test(name)) return "ブラウザの保存領域へアクセスできません（SecurityError）。";
          return "起動処理で停止しました（" + (/^[A-Za-z]+Error$/.test(name) ? name : "E_BOOT") + "）。";
        }

        function showFallback(message) {
          const root = document.getElementById(ROOT_ID);
          if (!root) return;
          if (hasLiveApp()) { clearStaleFallback(); return; }
          const current = document.getElementById(BOOT_ID);
          // Once React owns the root, failures belong to its error boundary.
          // Never recreate an independent screen in the body or behind a route.
          if (!current) return;
          const target = document.getElementById(MESSAGE_ID);
          if (target) target.textContent = message;
          const retry = document.getElementById("insight-display-repair");
          if (retry) retry.hidden = false;
        }

        async function repairDisplay() {
          const button = document.getElementById("insight-display-repair");
          if (button) { button.disabled = true; button.textContent = "表示キャッシュを更新中…"; }
          const message = document.getElementById(MESSAGE_ID);
          if (message) message.textContent = "保存データは残したまま、古い表示キャッシュだけ削除しています。";
          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.filter((registration) => String(registration.scope || "").includes("/note-insight/")).map((registration) => registration.unregister()));
            }
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter((key) => key.startsWith("mumei-note-insight-")).map((key) => caches.delete(key)));
            }
          } catch {}
          const url = new URL(window.location.href);
          url.searchParams.delete("nav");
          url.searchParams.set("displayRepair", String(Date.now()));
          window.location.replace(url.toString());
        }

        document.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target.closest("#insight-display-repair") : null;
          if (!target) return;
          event.preventDefault();
          void repairDisplay();
        });

        window.addEventListener("error", (event) => {
          if (event.target === window) {
            startupFailure = failureMessage(event.error);
            showFallback(startupFailure);
          } else if (event.target instanceof HTMLScriptElement) {
            startupFailure = "表示ファイルを読み込めませんでした（E_SCRIPT_LOAD）。";
            showFallback(startupFailure);
          }
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
          startupFailure = failureMessage(event.reason);
          showFallback(startupFailure);
        });

        window.setTimeout(() => {
          if (hasLiveApp()) { clearStaleFallback(); return; }
          const boot = document.getElementById(BOOT_ID);
          if (boot) showFallback(startupFailure || "読み込みに時間がかかっています。再読込できます。");
        }, 6500);

        try {
          const url = new URL(window.location.href);
          const requestedNav = String(url.searchParams.get("nav") || "");
          if (requestedNav === "insight" && !url.hash.includes("dashboard")) url.hash = "dashboard";
          if (requestedNav === "manage" && !url.hash.includes("manage")) url.hash = "manage";
          if (requestedNav === "top") url.hash = "";
          if (requestedNav) {
            url.searchParams.delete("nav");
            history.replaceState(history.state, "", url.pathname + (url.search ? "?" + url.searchParams.toString() : "") + url.hash);
          }

          const mode = String(url.searchParams.get("insightMode") || "");
          const notificationAccount = String(url.searchParams.get("notificationAccount") || "").trim().replace(/^@/, "").toLowerCase();
          if (mode === "notifications") {
            sessionStorage.setItem("mumei-insight-entry-mode", "notifications");
            sessionStorage.setItem("mumei-insight-entry-at", String(Date.now()));
            if (/^[a-z0-9_-]+$/.test(notificationAccount)) sessionStorage.setItem("mumei-insight-notification-account", notificationAccount);
            if (!url.hash.includes("dashboard")) {
              url.hash = "dashboard";
              history.replaceState(history.state, "", url.pathname + (url.search ? "?" + url.searchParams.toString() : "") + url.hash);
            }
          }

          const result = url.searchParams.get("notificationSync");
          const resultKey = "mumei-insight-notification-sync-result-v1";
          if (result === "done" || result === "error") {
            sessionStorage.setItem(resultKey, JSON.stringify({
              state: result,
              error: url.searchParams.get("notificationSyncError") || "",
              at: Number(url.searchParams.get("notificationSyncedAt") || Date.now()),
              noteAccount: url.searchParams.get("notificationNoteAccount") || ""
            }));
            for (const key of ["notificationSync","notificationSyncedAt","notificationSyncId","notificationSyncError","notificationNoteAccount"]) url.searchParams.delete(key);
            history.replaceState(history.state, "", url.pathname + (url.search ? "?" + url.searchParams.toString() : "") + url.hash);
          }
        } catch {
          showFallback("起動前の画面処理で停止しました。表示修復を実行してください。");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
