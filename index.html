    <style>
      .evidence-fab,#insight-dashboard-evidence-link{display:none!important}
      div[style*="position: fixed"][style*="right: 14px"][style*="bottom: 14px"][style*="z-index: 80"]{display:none!important}
      #insight-tool-row{display:none;background:#080d13;border-bottom:1px solid #243044;padding:9px 12px}
      body:has(.app-shell) #insight-tool-row{display:block}
      #insight-tool-row>div{width:min(1280px,100%);margin:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      #insight-tool-row strong{margin-right:auto;color:#dce7f4}
      #insight-tool-row a{border:1px solid #33465d;border-radius:999px;padding:8px 12px;color:#dce7f4;text-decoration:none;font-weight:850}
      #insight-tool-row a:first-of-type{color:#cfff64;border-color:#718b2f}
      #insight-tool-row a:last-of-type{color:#75e6ff;border-color:#2b7890}
      #app-exit-to-note{display:none;position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:9997;width:min(360px,calc(100% - 28px));min-height:42px;align-items:center;justify-content:center;border:1px solid #416276;border-radius:12px;background:rgba(11,27,39,.97);color:#b8efff;text-decoration:none;font:900 12px/1.2 system-ui;box-shadow:0 10px 28px rgba(0,0,0,.3)}
      #app-exit-to-note.show{display:flex}
      @media(min-width:760px){#app-exit-to-note{bottom:96px;width:300px}}
    </style>
    <title>無名S note｜INSIGHT</title>
  </head>
  <body>
    <div id="insight-tool-row"><div><strong>INSIGHTツール</strong><a href="./notification-setup.html?from=insight&role=owner" target="_blank" rel="noopener">本人通知を設定</a><a href="#evidence">ダッシュボード資料庫</a></div></div>
    <div id="root"></div>
    <a id="app-exit-to-note" href="https://note.com/">アプリを終了してnoteへ ↗</a>
    <script>
      document.addEventListener("click", function (event) {
        const target = event.target instanceof Element ? event.target.closest('a[href*="notification-setup.html"]') : null;
        if (!target || target.target === "_blank") return;
        event.preventDefault();
        window.open(target.href, "_blank", "noopener");
      }, true);
      (function(){
        const exit=document.getElementById('app-exit-to-note');
        function home(){const h=location.hash.replace(/^#\/?/,'');return !h||h==='home'}
        function refresh(){exit.classList.toggle('show',home())}
        exit.addEventListener('click',function(event){
          if(!/Android/i.test(navigator.userAgent)||!(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true))return;
          event.preventDefault();
          const fallback=encodeURIComponent('https://note.com/');
          location.href=`intent://note.com/#Intent;scheme=https;package=com.microsoft.emmx;S.browser_fallback_url=${fallback};end`;
        });
        addEventListener('hashchange',refresh);addEventListener('popstate',refresh);addEventListener('mumei-route',refresh);refresh();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
