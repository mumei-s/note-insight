<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(620px,calc(100% - 16px));margin:auto;padding:8px 0 20px}.card{border:1px solid #36516a;border-radius:14px;background:#0d1620;padding:10px}.card h1{margin:2px 0 6px;font-size:26px}.card p,.tiny{color:#9eb0c2;line-height:1.4;margin:6px 0}.tiny{font-size:11px}.status{margin-top:6px;padding:8px 9px;min-height:38px;border:1px solid #405e74;border-radius:9px;background:#0a1722;color:#bfe9f7;font-size:11px;display:flex;align-items:center}.ok{border-color:#47734f;background:#0e1d13;color:#b8ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:6px;border-radius:9px;background:#122131;color:#dbeeff;border:1px solid #405c74;text-decoration:none;font-weight:900;width:100%;padding:7px}.lime{background:#b6ff38;border-color:#b6ff38;color:#0b1600}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.back{display:inline-flex;min-height:36px;align-items:center;color:#8feaff;text-decoration:none;font-weight:900}</style></head><body><main class="wrap"><a id="backLink" class="back" href="./notification-entry.html">← INSIGHTへ</a><section class="card"><small>NOTIFICATION SETTINGS</small><h1>本人通知・設定</h1><p>本人通知だけを追加取得します。公開記事・フォロー・フォロワー等の通常更新とは別です。</p><div id="version" class="status">本人通知版を確認中…</div><a id="update" class="btn lime">本人通知ツールをインストール／更新</a><div id="pairState" class="status">本人連携を確認中…</div><button id="pair" class="btn green">本人連携を確認／やり直す</button><a class="btn" href="./notification-filter.html">通知フィルター設定</a><a class="btn" href="https://note.com/">noteを開いて🔔通知へ</a><p class="tiny">最新版 v2.9.59。note側の読み取りは前回保存位置から上方向へ続き読みし、停止した場合も停止地点まで保存します。日付指定はINSIGHTの【通知】履歴側で行います。DM・メッセージ・スキのリアクション・投稿・プロフィールでは非表示です。</p></section></main><script>
const VERSION='2.9.59',TOKEN='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',q=new URLSearchParams(location.search),role=q.get('role')==='owner'?'owner':'member',version=document.getElementById('version'),pairState=document.getElementById('pairState'),pair=document.getElementById('pair'),update=document.getElementById('update'),backLink=document.getElementById('backLink');let noteId='';
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./notification-entry.html',location.href).href}catch{return new URL('./notification-entry.html',location.href).href}}const back=safeReturn(q.get('return'));backLink.href=back;
const checked=q.get('notificationInstalled')||'',installed=checked||localStorage.getItem('mumei-notification-tool-version')||'';if(checked)localStorage.setItem('mumei-notification-tool-version',checked);version.className='status '+(installed===VERSION?'ok':'warn');version.textContent=installed===VERSION?`✅ 本人通知 v${VERSION}｜最新版`:`本人通知 ${installed||'未確認'} → 最新 v${VERSION}`;
const up=new URL('./notification-update.html',location.href);up.searchParams.set('role',role);up.searchParams.set('return',back);update.href=up.href;
async function call(action){const h={'Content-Type':'application/json'};h[role==='owner'?'X-Owner-Token':'X-Insight-Token']=localStorage.getItem(role==='owner'?OWNER:MEMBER)||'';const r=await fetch(TOKEN,{method:'POST',headers:h,body:JSON.stringify({action,role}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'処理できませんでした');return p}
function show(p){noteId=String(p.noteId||'').toLowerCase();pairState.className='status '+(p.paired?'ok':'warn');pairState.textContent=`@${noteId||'—'}｜${p.paired?'本人連携済み':'未連携'}`}
(async()=>{try{show(await call('stats'))}catch(e){pairState.className='status warn';pairState.textContent=e.message||'INSIGHTログインを確認してください'}})();pair.onclick=async()=>{pair.disabled=true;try{const p=await call('pair-start');show(p);const u=new URL(p.noteUrl),ret=new URL('./notification-entry.html',location.href);if(noteId)ret.searchParams.set('account',noteId);u.searchParams.set('mumei_return',ret.href);location.href=u.href}catch(e){pairState.textContent=e.message||'本人連携を開始できませんでした';pair.disabled=false}};
if(checked===VERSION){version.textContent=`✅ 本人通知 v${VERSION}｜更新完了。INSIGHTへ戻ります…`;setTimeout(()=>location.replace(back),900)}
</script></body></html>
