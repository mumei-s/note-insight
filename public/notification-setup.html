<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:28px 0 90px}.card{border:1px solid #36516a;border-radius:18px;background:#0d1620;padding:20px}.card h1{margin:4px 0 10px;font-size:29px}.card p{color:#a9b8c8;line-height:1.65}.status{margin-top:12px;padding:11px;border:1px solid #405e74;border-radius:10px;background:#0a1722;color:#bfe9f7;font-size:12px;line-height:1.55}.ok{border-color:#47734f;background:#0e1d13;color:#b8ffca}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:14px;border-radius:12px;background:#122131;color:#dbeeff;border:1px solid #405c74;text-decoration:none;font-weight:950;width:100%}.btn.green{background:#123124;border-color:#5bc68b;color:#dcffea}.back{display:inline-block;margin-bottom:12px;color:#8feaff;text-decoration:none;font-weight:900}.tiny{font-size:11px;color:#8295a8;line-height:1.6}</style></head><body><main class="wrap"><a class="back" href="./?insightMode=notifications#dashboard">← INSIGHT【通知】へ</a><section class="card"><small>NOTIFICATION SETTINGS</small><h1>本人通知・設定</h1><p>ここは<strong>本人連携だけ</strong>の設定画面です。ツールのインストール／更新は「本人通知ツール 更新」画面に一本化しました。</p><div id="status" class="status">連携状態を確認中…</div><button id="pair" class="btn green">本人連携を確認／やり直す</button><a id="note" class="btn" href="https://note.com/">note通知を開く</a><p class="tiny">通知フィルターのON/OFF・グループ設定は、noteの🔔通知上にある「設定」から行えます。手動保存は「手動保存（続きから）」だけです。</p></section></main><script>
const TOKEN='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',q=new URLSearchParams(location.search),role=q.get('role')==='owner'?'owner':'member',status=document.getElementById('status'),pair=document.getElementById('pair'),note=document.getElementById('note');let noteId='';
async function call(action){const headers={'Content-Type':'application/json'};if(role==='owner')headers['X-Owner-Token']=localStorage.getItem(OWNER)||'';else headers['X-Insight-Token']=localStorage.getItem(MEMBER)||'';const r=await fetch(TOKEN,{method:'POST',headers,body:JSON.stringify({action,role}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'処理できませんでした');return p}
function show(p){noteId=String(p.noteId||'').toLowerCase();status.className='status '+(p.paired?'ok':'');status.textContent=`@${noteId||'—'} ｜ ${p.paired?'本人連携済み':'未連携'}`;if(noteId)note.href=`https://note.com/${encodeURIComponent(noteId)}`}
(async()=>{try{show(await call('stats'))}catch(e){status.textContent=e.message||'INSIGHTログインを確認してください';pair.disabled=true}})();
pair.onclick=async()=>{pair.disabled=true;status.textContent='本人確認コードを発行中…';try{const p=await call('pair-start');show(p);const u=new URL(p.noteUrl),back=new URL('./?insightMode=notifications#dashboard',location.href);u.searchParams.set('mumei_return',back.href);location.href=u.href}catch(e){status.textContent=e.message||'本人連携を開始できませんでした';pair.disabled=false}};
</script></body></html>
