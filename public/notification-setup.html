<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:36px 0}.card{border:1px solid #36516a;border-radius:18px;background:#0d1620;padding:20px}.card h1{margin:4px 0 10px}.card p{color:#a9b8c8;line-height:1.7}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:14px;border-radius:12px;background:#b6ff38;color:#071016;text-decoration:none;font-weight:950}.btn.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.note{margin-top:10px;padding:9px 10px;border:1px solid #405e74;border-radius:10px;background:#0a1722;color:#a9c2d2;font-size:11px;line-height:1.55}.status{margin-top:10px;font-size:11px;color:#9fb3c8}</style></head><body><main class="wrap"><section class="card"><small>NOTIFICATION SETUP</small><h1>本人通知・統計</h1><p><strong>最新版 v2.9.24</strong>。通知ツールのインストール更新と、本人連携・フィルター設定を分けています。</p><div class="note">通知画面を開いている間は自動確認・自動保存します。古い側から順に保存し、成功した地点だけ「✓ ここまで保存済み」を進めます。INSIGHT【通知】には最終更新日時を常時表示します。</div><div id="status" class="status"></div><a id="update" class="btn" href="#">本人通知ツールをインストール／更新</a><a id="settings" class="btn sub" href="#">本人連携・フィルター設定</a></section></main><script>const q=new URLSearchParams(location.search),role=q.get('role')==='owner'?'owner':'member',installed=localStorage.getItem('mumei-notification-tool-version')||q.get('notificationInstalled')||'',back=new URL('./notification-entry.html',location.href);const up=new URL('./notification-update.html',location.href);up.searchParams.set('from','insight');up.searchParams.set('role',role);up.searchParams.set('latest','2.9.24');up.searchParams.set('return',back.href);document.getElementById('update').href=up.href;const st=new URL('./notification-import.html',location.href);st.searchParams.set('from','insight');st.searchParams.set('role',role);if(installed)st.searchParams.set('notificationInstalled',installed);document.getElementById('settings').href=st.href;document.getElementById('status').textContent=installed?`この端末で確認済み：v${installed}`:'この端末の本人通知版：未確認';</script></body></html>
