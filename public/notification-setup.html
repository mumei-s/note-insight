<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:28px 0 90px}.card{border:1px solid #36516a;border-radius:18px;background:#0d1620;padding:20px}.card h1{margin:4px 0 10px;font-size:29px}.card p{color:#a9b8c8;line-height:1.65}.status,.result{margin-top:12px;padding:11px;border:1px solid #405e74;border-radius:10px;background:#0a1722;color:#bfe9f7;font-size:12px;line-height:1.55}.ok{border-color:#47734f;background:#0e1d13;color:#b8ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:14px;border-radius:12px;background:#122131;color:#dbeeff;border:1px solid #405c74;text-decoration:none;font-weight:950;width:100%;text-align:center}.btn.lime{background:#b6ff38;border-color:#b6ff38;color:#0b1600}.btn.green{background:#123124;border-color:#5bc68b;color:#dcffea}.back{display:inline-block;margin-bottom:12px;color:#8feaff;text-decoration:none;font-weight:900}.tiny{font-size:11px;color:#8295a8;line-height:1.6}</style></head><body><main class="wrap"><a class="back" href="./notification-entry.html">← INSIGHT【通知】へ</a><section class="card"><small>NOTIFICATION SETTINGS</small><h1>本人通知・設定</h1><p>本人通知ツールの<strong>更新・版確認・本人連携</strong>をここにまとめています。通知の保存自体はnoteの🔔上で手動です。</p><div id="result" class="result" hidden></div><div id="version" class="status">本人通知版を確認中…</div><a id="update" class="btn lime" href="#">本人通知ツールをインストール／更新</a><div id="pairState" class="status">本人連携を確認中…</div><button id="pair" class="btn green">本人連携を確認／やり直す</button><a id="note" class="btn" href="https://note.com/">noteを開いて🔔通知へ</a><p class="tiny">最新版は v2.9.32。更新が成功するとこの設定画面へ戻り、上に「更新完了」を表示します。note側の「設定」では、登録中クリエイター名＋@ID・個別解除・グループON/OFFを確認できます。</p></section></main><script>
const VERSION='2.9.32',TOKEN='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',q=new URLSearchParams(location.search),role=q.get('role')==='owner'?'owner':'member',version=document.getElementById('version'),result=document.getElementById('result'),pairState=document.getElementById('pairState'),pair=document.getElementById('pair'),note=document.getElementById('note'),update=document.getElementById('update');let noteId='';
const checked=q.get('notificationInstalled')||'',updateResult=q.get('notificationUpdateResult')||'';
if(checked)localStorage.setItem('mumei-notification-tool-version',checked);
const installed=checked||localStorage.getItem('mumei-notification-tool-version')||'';
if(updateResult||checked){result.hidden=false;if(installed===VERSION){result.className='result ok';result.textContent=`✅ 更新完了 v${VERSION}。本人通知・設定へ戻りました。`}else{result.className='result warn';result.textContent=`⚠ 更新確認結果：現在 v${installed||'未確認'}。最新版 v${VERSION} ではありません。`}}
if(installed===VERSION){version.className='status ok';version.textContent=`本人通知 v${VERSION} ｜ 最新版`}else if(installed){version.className='status warn';version.textContent=`本人通知 v${installed} ｜ 更新あり → v${VERSION}`}else{version.className='status warn';version.textContent=`本人通知版：未確認 ｜ 最新 v${VERSION}`}
const back=new URL(location.href);for(const k of ['notificationInstalled','notificationCheckedAt','notificationUpdateResult'])back.searchParams.delete(k);back.hash='';const up=new URL('./notification-update.html',location.href);up.searchParams.set('from','settings');up.searchParams.set('role',role);up.searchParams.set('return',back.href);update.href=up.href;
if(checked||updateResult){const clean=new URL(location.href);for(const k of ['notificationInstalled','notificationCheckedAt','notificationUpdateResult'])clean.searchParams.delete(k);history.replaceState(history.state,'',clean.href)}
async function call(action){const headers={'Content-Type':'application/json'};if(role==='owner')headers['X-Owner-Token']=localStorage.getItem(OWNER)||'';else headers['X-Insight-Token']=localStorage.getItem(MEMBER)||'';const r=await fetch(TOKEN,{method:'POST',headers,body:JSON.stringify({action,role}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'処理できませんでした');return p}
function show(p){noteId=String(p.noteId||'').toLowerCase();pairState.className='status '+(p.paired?'ok':'warn');pairState.textContent=`@${noteId||'—'} ｜ ${p.paired?'本人連携済み':'未連携'}`;if(noteId)note.href='https://note.com/'}
(async()=>{try{show(await call('stats'))}catch(e){pairState.className='status warn';pairState.textContent=e.message||'INSIGHTログインを確認してください';pair.disabled=true}})();
pair.onclick=async()=>{pair.disabled=true;pairState.textContent='本人確認コードを発行中…';try{const p=await call('pair-start');show(p);const u=new URL(p.noteUrl),backTo=new URL('./notification-entry.html',location.href);u.searchParams.set('mumei_return',backTo.href);location.href=u.href}catch(e){pairState.textContent=e.message||'本人連携を開始できませんでした';pair.disabled=false}};
</script></body></html>
