<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知設定｜INSIGHT</title><script>(()=>{const q=new URLSearchParams(location.search);if(q.get('from')!=='insight'){location.replace('./');return;}})();</script><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(720px,calc(100% - 22px));margin:auto;padding:28px 0 80px}.back{color:#8feaff;text-decoration:none;font-weight:900}.card{margin-top:50px;border:1px solid #2c3c51;border-radius:18px;background:#0d141d;padding:22px}.card small{color:#8feaff;font-weight:900;letter-spacing:.12em}.card h1{font-size:34px;margin:7px 0 12px}.card p{color:#a5b2c2;line-height:1.75}.btn{display:flex;align-items:center;justify-content:center;min-height:50px;margin-top:18px;border-radius:12px;background:#54d8ff;color:#071016;text-decoration:none;font-weight:950}.warn{margin-top:14px;border-left:3px solid #ffd76b;padding-left:12px;color:#a5b2c2;line-height:1.7}</style></head><body><main class="wrap"><a class="back" href="./#dashboard">← INSIGHTへ戻る</a><section class="card"><small>NOTIFICATION SETUP</small><h1>本人通知の自動同期</h1><p>現在INSIGHTで選択しているアカウントと、noteで実際にログインしているIDを照合して連携します。アカウントごとに通知保存先を分離します。</p><a id="open" class="btn" href="#">本人通知の自動同期設定を開く</a><div class="warn">この設定ページはINSIGHT内から明示的に開いた時だけ表示します。アプリ起動時はTOPから始まります。</div></section></main><script>const q=new URLSearchParams(location.search),role=q.get('role')==='owner'?'owner':'member';document.getElementById('open').href=`./notification-import.html?from=setup&role=${role}&v=6`;</script></body></html>
