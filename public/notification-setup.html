<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(620px,calc(100% - 22px));margin:auto;padding:36px 0}.card{border:1px solid #36516a;border-radius:18px;background:#0d1620;padding:20px}.card h1{margin:4px 0 10px}.card p{color:#a9b8c8;line-height:1.7}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:14px;border-radius:12px;background:#b6ff38;color:#071016;text-decoration:none;font-weight:950}</style></head><body><main class="wrap"><section class="card"><small>NOTIFICATION SETUP</small><h1>本人通知・統計 v2.9.19</h1><p>参加者もOWNERも同じ最新版を使います。旧v2.9.17 / v2.9.18の通知UIはv2.9.19側で競合停止します。</p><a id="open" class="btn" href="#">v2.9.19 設定へ進む</a></section></main><script>const q=new URLSearchParams(location.search),role=q.get('role')==='owner'?'owner':'member',installed=q.get('notificationInstalled')||'';if(installed==='2.9.19')localStorage.setItem('mumei-notification-tool-version','2.9.19');const u=new URL('./notification-import.html',location.href);u.searchParams.set('from','insight');u.searchParams.set('role',role);if(installed)u.searchParams.set('notificationInstalled',installed);document.getElementById('open').href=u.href;</script></body></html>
