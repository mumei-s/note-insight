<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知フィルター設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(660px,calc(100% - 16px));margin:auto;padding:10px 0 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.back{display:inline-flex;min-height:36px;align-items:center;color:#8feaff;text-decoration:none;font-weight:900}.close{min-width:76px;height:36px;border:1px solid #546b7f;border-radius:9px;background:#111d28;color:#ecf7ff;font-weight:950}.card{border:1px solid #36516a;border-radius:14px;background:#0d1620;padding:12px}.card h1{margin:3px 0 6px;font-size:25px}.card p{color:#9eb0c2;line-height:1.5;margin:6px 0}.status{margin-top:7px;padding:8px 9px;border:1px solid #405e74;border-radius:9px;background:#0a1722;color:#bfe9f7;font-size:11px}.ok{border-color:#47734f;background:#0e1d13;color:#b8ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.groups{display:grid;gap:9px;margin-top:10px}.group{border:1px solid #334a60;border-radius:11px;background:#0a121a;padding:9px;display:grid;gap:8px}.group-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.group input[type=text]{width:100%;border:1px solid #42556c;border-radius:8px;background:#080d13;color:#fff;padding:8px;font:12px/1.45 system-ui}.toggle{display:flex;align-items:center;gap:5px;color:#c7d8e8;font-size:10px;font-weight:850}.mini{border:1px solid #53687d;background:#101c28;color:#e8f3ff;border-radius:7px;padding:7px 8px;font-weight:850}.danger{border-color:#70424c!important;color:#ffd0d6!important;background:#241218!important}.members{display:grid;gap:6px}.member{display:grid;grid-template-columns:auto minmax(0,1fr) 54px;gap:7px;align-items:center;padding:7px;border:1px solid #263f52;border-radius:8px;background:#0c1b26}.member.off{opacity:.58}.member-id{min-width:0;display:grid;gap:2px}.member-id b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-id small{font-size:9px;color:#8398aa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member button{height:30px;padding:0 7px}.addrow{display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:6px}.empty{padding:9px;border:1px dashed #315065;border-radius:8px;color:#8398aa;font-size:10px}.btn{width:100%;min-height:42px;border-radius:9px;margin-top:7px;padding:7px 10px;border:1px solid #405c74;background:#122131;color:#dbeeff;font-weight:950}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.restore{background:#142b3a;border-color:#65b9d7;color:#dff8ff}.tiny{font-size:10px;color:#8394a8}.hidden{display:none!important}@media(max-width:560px){.group-head{grid-template-columns:1fr auto}.group-head .toggle{grid-column:1/-1}.member{grid-template-columns:auto minmax(0,1fr) 48px}.close{min-width:68px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="./notification-entry.html?insightMode=notifications#dashboard">← INSIGHT【通知】へ</a><button id="close" class="close" type="button">× 閉じる</button></div><section class="card"><small>NOTIFICATION FILTER</small><h1>通知フィルター設定</h1><p><strong>クリエイター1人ずつ個別にON/OFF</strong>できます。入力はnoteプロフィールURL・記事URL・@ID・IDの全部に対応します。</p><div id="account" class="status">対象アカウントを確認中…</div><button id="restore" class="btn restore">↻ 登録済みをnoteから復元</button><div id="groups" class="groups"></div><button id="add" class="btn">＋ フィルターグループを作成</button><button id="save" class="btn green">設定をnoteへ反映</button><button id="reset" class="btn danger">フィルターを全部解除</button><div id="status" class="status hidden"></div><button id="note" class="btn">noteの🔔へ戻る</button><button id="close2" class="btn">× 閉じる</button><p class="tiny">既存登録はnote側のUserscript保存領域から復元し、現在の設定へ<strong>削除せずマージ</strong>します。URLは https://note.com/xxxxx でも記事URLでもOKです。</p></section></main><script>
const TOKEN='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',memberToken=localStorage.getItem(MEMBER)||'',ownerToken=localStorage.getItem(OWNER)||'',role=memberToken?'member':ownerToken?'owner':'member',q=new URLSearchParams(location.search),account=document.getElementById('account'),groupsEl=document.getElementById('groups'),add=document.getElementById('add'),save=document.getElementById('save'),reset=document.getElementById('reset'),restore=document.getElementById('restore'),status=document.getElementById('status'),note=document.getElementById('note'),close=document.getElementById('close'),close2=document.getElementById('close2');let noteId='',groups=[];
async function call(action){const h={'Content-Type':'application/json'};h[role==='owner'?'X-Owner-Token':'X-Insight-Token']=role==='owner'?ownerToken:memberToken;const r=await fetch(TOKEN,{method:'POST',headers:h,body:JSON.stringify({action,role}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'INSIGHTログインを確認してください');return p}
function storageKey(){return`insight_notification_groups_v1:${noteId}`}
function parseId(v){try{const raw=String(v||'').trim(),u=new URL(/^https?:\/\//i.test(raw)?raw:`https://note.com/${raw.replace(/^@/,'')}`);const id=u.hostname==='note.com'?(u.pathname.split('/').filter(Boolean)[0]||'').toLowerCase():'';return/^[a-z0-9_-]+$/.test(id)?id:''}catch{return''}}
function b64(v){return btoa(unescape(encodeURIComponent(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(v){try{const raw=String(v||'').replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(String(v||'').length/4)*4,'=');return JSON.parse(decodeURIComponent(escape(atob(raw))))}catch{return null}}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function normalizeGroup(g,i=0){const raw=[];if(Array.isArray(g?.members))raw.push(...g.members.map(x=>typeof x==='string'?{id:x,enabled:true}:x));if(Array.isArray(g?.ids))raw.push(...g.ids.map(id=>({id,enabled:true})));if(typeof g?.urls==='string')raw.push(...g.urls.split(/\s+/).map(id=>({id,enabled:true})));const seen=new Set(),members=[];for(const x of raw){const id=parseId(x?.id||x?.url||x);if(!id||seen.has(id))continue;seen.add(id);members.push({id,enabled:x?.enabled!==false})}return{name:String(g?.name||`グループ ${i+1}`).trim()||`グループ ${i+1}`,enabled:g?.enabled!==false,members}}
function mergeGroups(base,incoming){const out=(Array.isArray(base)?base:[]).map(normalizeGroup);for(const [i,raw] of (Array.isArray(incoming)?incoming:[]).entries()){const g=normalizeGroup(raw,i),same=out.find(x=>x.name===g.name);if(!same){out.push(g);continue}const known=new Set(same.members.map(x=>x.id));for(const m of g.members)if(!known.has(m.id)){same.members.push(m);known.add(m.id)}if(raw?.enabled!==undefined)same.enabled=raw.enabled!==false}return out.length?out:[normalizeGroup({name:'共同マガジン整理',enabled:true,members:[]})]}
function imported(){const p=unb64(q.get('mumei_existing'));return p&&Array.isArray(p.groups)?p.groups:[]}
function saveLocal(){if(noteId)localStorage.setItem(storageKey(),JSON.stringify(groups))}
function load(){let local=[];try{const x=JSON.parse(localStorage.getItem(storageKey())||'[]');local=Array.isArray(x)?x:[]}catch{}const incoming=imported();groups=mergeGroups(local,incoming);saveLocal();render();if(incoming.length){const count=new Set(incoming.flatMap(g=>(g.ids||g.members||[]).map(x=>parseId(x?.id||x)).filter(Boolean))).size;msg(`登録済み ${count}人をnote側から復元し、現在の設定へマージしました。`,true);const u=new URL(location.href);u.searchParams.delete('mumei_existing');u.searchParams.delete('mumei_imported');history.replaceState(history.state,'',u.pathname+(u.search?'?'+u.searchParams.toString():'')+u.hash)}}
function render(){groupsEl.innerHTML='';groups.forEach((g,i)=>{const box=document.createElement('div');box.className='group';box.innerHTML=`<div class="group-head"><input class="gname" type="text" value="${esc(g.name)}" placeholder="グループ名"><button class="mini danger gdel" type="button">削除</button><label class="toggle"><input class="gon" type="checkbox" ${g.enabled!==false?'checked':''}>グループON</label></div><div class="members"></div><div class="addrow"><input class="newid" type="text" placeholder="note URL / 記事URL / @ID / ID"><button class="mini addmember" type="button">＋追加</button></div>`;const name=box.querySelector('.gname'),gon=box.querySelector('.gon'),del=box.querySelector('.gdel'),members=box.querySelector('.members'),newid=box.querySelector('.newid'),addmember=box.querySelector('.addmember');name.oninput=()=>{groups[i].name=name.value;saveLocal()};gon.onchange=()=>{groups[i].enabled=gon.checked;saveLocal();render()};del.onclick=()=>{groups.splice(i,1);if(!groups.length)groups.push(normalizeGroup({name:'共同マガジン整理',enabled:true,members:[]}));saveLocal();render()};if(!g.members.length){members.innerHTML='<div class="empty">まだ個別指定はありません。</div>'}else g.members.forEach((m,j)=>{const row=document.createElement('div');row.className='member'+(m.enabled===false?' off':'');row.innerHTML=`<label class="toggle"><input type="checkbox" ${m.enabled!==false?'checked':''}>ON</label><div class="member-id"><b>@${esc(m.id)}</b><small>https://note.com/${esc(m.id)}</small></div><button class="mini danger" type="button">削除</button>`;const ck=row.querySelector('input'),rm=row.querySelector('button');ck.onchange=()=>{groups[i].members[j].enabled=ck.checked;saveLocal();render()};rm.onclick=()=>{groups[i].members.splice(j,1);saveLocal();render()};members.append(row)});const addOne=()=>{const id=parseId(newid.value);if(!id){msg('noteのプロフィールURL・記事URL・@ID・IDを入力してください');return}if(!groups[i].members.some(x=>x.id===id))groups[i].members.push({id,enabled:true});newid.value='';saveLocal();render()};addmember.onclick=addOne;newid.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addOne()}});groupsEl.append(box)})}
function msg(v,ok=false){status.hidden=false;status.className='status '+(ok?'ok':'');status.textContent=v}
function closePage(){if(document.referrer&&document.referrer.includes('note.com')){history.back();return}if(history.length>1){history.back();return}location.href='./notification-entry.html?insightMode=notifications#dashboard'}
(async()=>{try{const p=await call('stats');noteId=String(p.noteId||'').toLowerCase();account.className='status ok';account.textContent=`@${noteId}｜${p.paired?'本人連携済み':'本人連携未確認'}`;load()}catch(e){account.className='status warn';account.textContent=e.message||'INSIGHTログインを確認してください';add.disabled=save.disabled=reset.disabled=restore.disabled=true}})();
restore.onclick=()=>{if(!noteId)return;const ret=new URL(location.href);ret.searchParams.delete('mumei_existing');ret.searchParams.delete('mumei_imported');const u=new URL('https://note.com/');u.searchParams.set('mumei_filter_export','1');u.searchParams.set('mumei_account',noteId);u.searchParams.set('mumei_return',ret.href);msg('note側に残っている登録済み設定を読み戻します…');location.href=u.href};
add.onclick=()=>{groups.push(normalizeGroup({name:`グループ ${groups.length+1}`,enabled:true,members:[]}));saveLocal();render()};
save.onclick=()=>{if(!noteId)return;saveLocal();const payload=groups.map(g=>({name:String(g.name||'グループ').trim()||'グループ',enabled:g.enabled!==false,ids:[...new Set((g.members||[]).filter(m=>m.enabled!==false).map(m=>parseId(m.id)).filter(Boolean))]})).filter(g=>g.ids.length);const active=[...new Set(payload.filter(g=>g.enabled).flatMap(g=>g.ids))];msg(`${payload.length}グループ / 個別ON ${active.length}人。note側へ反映します。`);location.href=`https://note.com/?mumei_groups_sync=${encodeURIComponent(b64(JSON.stringify(payload)))}&mumei_account=${encodeURIComponent(noteId)}`};
reset.onclick=()=>{if(!noteId)return;groups=[normalizeGroup({name:'共同マガジン整理',enabled:true,members:[]})];saveLocal();render();msg('フィルター解除をnote側へ反映します。');location.href=`https://note.com/?mumei_filter_reset=1&mumei_account=${encodeURIComponent(noteId)}`};
note.onclick=()=>{location.href='https://note.com/'};close.onclick=closePage;close2.onclick=closePage;
</script></body></html>
