<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知フィルター設定｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(660px,calc(100% - 16px));margin:auto;padding:10px 0 24px}.back{display:inline-flex;min-height:36px;align-items:center;color:#8feaff;text-decoration:none;font-weight:900}.card{border:1px solid #36516a;border-radius:14px;background:#0d1620;padding:12px}.card h1{margin:3px 0 6px;font-size:25px}.card p{color:#9eb0c2;line-height:1.5;margin:6px 0}.status{margin-top:7px;padding:8px 9px;border:1px solid #405e74;border-radius:9px;background:#0a1722;color:#bfe9f7;font-size:11px}.ok{border-color:#47734f;background:#0e1d13;color:#b8ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.groups{display:grid;gap:8px;margin-top:10px}.group{border:1px solid #334a60;border-radius:11px;background:#0a121a;padding:9px;display:grid;gap:7px}.group-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.group input[type=text],.group textarea{width:100%;border:1px solid #42556c;border-radius:8px;background:#080d13;color:#fff;padding:8px;font:12px/1.45 system-ui}.group textarea{resize:vertical;min-height:68px}.toggle{display:flex;align-items:center;gap:5px;color:#c7d8e8;font-size:10px;font-weight:850}.mini{border:1px solid #53687d;background:#101c28;color:#e8f3ff;border-radius:7px;padding:7px 8px;font-weight:850}.danger{border-color:#70424c!important;color:#ffd0d6!important;background:#241218!important}.btn{width:100%;min-height:42px;border-radius:9px;margin-top:7px;padding:7px 10px;border:1px solid #405c74;background:#122131;color:#dbeeff;font-weight:950}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.tiny{font-size:10px;color:#8394a8}.hidden{display:none!important}@media(max-width:560px){.group-head{grid-template-columns:1fr auto}.group-head .toggle{grid-column:1/-1}}</style></head><body><main class="wrap"><a class="back" href="./notification-entry.html?insightMode=notifications#dashboard">← INSIGHT【通知】へ</a><section class="card"><small>NOTIFICATION FILTER</small><h1>通知フィルター設定</h1><p>共同マガジン追加通知などを、クリエイター単位でグループ管理します。<strong>インストール設定とは別画面</strong>です。</p><div id="account" class="status">対象アカウントを確認中…</div><div id="groups" class="groups"></div><button id="add" class="btn">＋ フィルターグループを作成</button><button id="save" class="btn green">設定をnoteへ反映</button><button id="reset" class="btn danger">フィルターを全部解除</button><div id="status" class="status hidden"></div><button id="note" class="btn">noteの🔔へ戻る</button><p class="tiny">ONのグループだけがフィルター対象です。URL / ID / @ID に対応します。</p></section></main><script>
const TOKEN='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',memberToken=localStorage.getItem(MEMBER)||'',ownerToken=localStorage.getItem(OWNER)||'',role=memberToken?'member':ownerToken?'owner':'member',account=document.getElementById('account'),groupsEl=document.getElementById('groups'),add=document.getElementById('add'),save=document.getElementById('save'),reset=document.getElementById('reset'),status=document.getElementById('status'),note=document.getElementById('note');let noteId='',groups=[];
async function call(action){const h={'Content-Type':'application/json'};h[role==='owner'?'X-Owner-Token':'X-Insight-Token']=role==='owner'?ownerToken:memberToken;const r=await fetch(TOKEN,{method:'POST',headers:h,body:JSON.stringify({action,role}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'INSIGHTログインを確認してください');return p}
function storageKey(){return`insight_notification_groups_v1:${noteId}`}
function parseId(v){try{const raw=String(v||'').trim(),u=new URL(/^https?:\/\//i.test(raw)?raw:`https://note.com/${raw.replace(/^@/,'')}`);return u.hostname==='note.com'?(u.pathname.split('/').filter(Boolean)[0]||'').toLowerCase():''}catch{return''}}
function b64(v){return btoa(unescape(encodeURIComponent(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function saveLocal(){if(noteId)localStorage.setItem(storageKey(),JSON.stringify(groups))}
function load(){try{const x=JSON.parse(localStorage.getItem(storageKey())||'[]');groups=Array.isArray(x)&&x.length?x:[{name:'共同マガジン整理',enabled:true,urls:''}]}catch{groups=[{name:'共同マガジン整理',enabled:true,urls:''}]}render()}
function render(){groupsEl.innerHTML='';groups.forEach((g,i)=>{const box=document.createElement('div');box.className='group';box.innerHTML=`<div class="group-head"><input type="text" value="${esc(g.name)}" placeholder="グループ名"><button class="mini danger" type="button">削除</button><label class="toggle"><input type="checkbox" ${g.enabled!==false?'checked':''}>ON</label></div><textarea placeholder="1行に1人\nhttps://note.com/creator_id または creator_id"></textarea>`;const name=box.querySelector('input[type=text]'),ta=box.querySelector('textarea'),ck=box.querySelector('input[type=checkbox]'),del=box.querySelector('button');ta.value=g.urls||'';name.oninput=()=>{groups[i].name=name.value;saveLocal()};ta.oninput=()=>{groups[i].urls=ta.value;saveLocal()};ck.onchange=()=>{groups[i].enabled=ck.checked;saveLocal()};del.onclick=()=>{groups.splice(i,1);if(!groups.length)groups.push({name:'共同マガジン整理',enabled:true,urls:''});saveLocal();render()};groupsEl.append(box)})}
function msg(v,ok=false){status.hidden=false;status.className='status '+(ok?'ok':'');status.textContent=v}
(async()=>{try{const p=await call('stats');noteId=String(p.noteId||'').toLowerCase();account.className='status ok';account.textContent=`@${noteId}｜${p.paired?'本人連携済み':'本人連携未確認'}`;load()}catch(e){account.className='status warn';account.textContent=e.message||'INSIGHTログインを確認してください';add.disabled=save.disabled=reset.disabled=true}})();
add.onclick=()=>{groups.push({name:`グループ ${groups.length+1}`,enabled:true,urls:''});saveLocal();render()};
save.onclick=()=>{if(!noteId)return;saveLocal();const payload=groups.map(g=>({name:String(g.name||'グループ').trim()||'グループ',enabled:g.enabled!==false,ids:[...new Set(String(g.urls||'').split(/\s+/).map(parseId).filter(x=>/^[a-z0-9_-]+$/.test(x)))]})).filter(g=>g.ids.length);const active=[...new Set(payload.filter(g=>g.enabled).flatMap(g=>g.ids))];msg(`${payload.length}グループ / 対象 ${active.length}人。note側へ反映します。`);location.href=`https://note.com/?mumei_groups_sync=${encodeURIComponent(b64(JSON.stringify(payload)))}&mumei_account=${encodeURIComponent(noteId)}`};
reset.onclick=()=>{if(!noteId)return;groups=[{name:'共同マガジン整理',enabled:true,urls:''}];saveLocal();render();msg('フィルター解除をnote側へ反映します。');location.href=`https://note.com/?mumei_filter_reset=1&mumei_account=${encodeURIComponent(noteId)}`};
note.onclick=()=>{location.href='https://note.com/'};
</script></body></html>
