<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知なし詳細分析｜INSIGHT</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#eef7ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(980px,calc(100% - 16px));margin:auto;padding:10px 0 36px}.top{display:flex;gap:7px;align-items:center;margin-bottom:8px}.top a,.top button{min-height:38px;border:1px solid #385166;border-radius:10px;background:#0d1822;color:#dff7ff;padding:8px 11px;font-weight:900;text-decoration:none}.top button{margin-left:auto}.hero,.section{border:1px solid #30495d;border-radius:14px;background:#0b151f;padding:11px}.hero small{color:#86eaff;font-weight:950;letter-spacing:.1em}.hero h1{font-size:25px;margin:4px 0 6px}.hero p{margin:0;color:#a9bdcc;font-size:11px;line-height:1.55}.status{margin-top:8px;border:1px solid #38566d;border-radius:9px;background:#091923;padding:8px 9px;color:#c6f1ff;font-size:10px}.status.ok{border-color:#416d52;color:#c9ffda}.status.warn{border-color:#765d34;color:#ffe1a0}.section{margin-top:8px}.section h2{font-size:15px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.kpi,.panel{border:1px solid #294254;border-radius:10px;background:#0c1b26;padding:8px}.kpi small{display:block;color:#8fa7b9;font-size:8px}.kpi b{display:block;font-size:19px;margin-top:2px}.kpi span{display:block;color:#86b8cc;font-size:8px;margin-top:2px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.panel h3{font-size:12px;margin:0 0 5px}.rows{display:grid;gap:4px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center;padding:5px 6px;border:1px solid #263c4d;border-radius:8px}.row b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{display:block;color:#8499aa;font-size:7.5px}.row em{font-style:normal;font-weight:900;color:#aeefff;font-size:9px}.pillbox{display:flex;gap:4px;flex-wrap:wrap}.pill{border:1px solid #345063;border-radius:999px;padding:4px 6px;font-size:8px;color:#d6f3ff}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:9px}.table th,.table td{padding:6px;border-bottom:1px solid #233746;text-align:left;white-space:nowrap}.table th{color:#8da6b8}.table td.title{max-width:380px;overflow:hidden;text-overflow:ellipsis}.table a{color:#c6f3ff;text-decoration:none}.note{font-size:9px;color:#879bac;line-height:1.5}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.hero h1{font-size:21px}.table td.title{max-width:210px}}
</style></head><body><main class="wrap"><div class="top"><a href="./#dashboard">← INSIGHT</a><button id="refresh" type="button">↻ 公開データ更新</button><button id="close" type="button">×</button></div><section class="hero"><small>PUBLIC DETAIL ANALYSIS</small><h1>🔎 本人通知なし詳細分析</h1><p>INSIGHTに保存済みの公開記事・スキ・コメント・投稿日時・公開フォロー情報だけで分析します。本人通知とDashboard同期は不要です。PV・売上・流入は推測しません。</p><div id="status" class="status">保存済み公開データを読み込み中…</div></section><section id="content" class="hidden"><section class="section"><h2>現在地</h2><div id="kpis" class="grid"></div></section><section class="section"><div class="two"><div class="panel"><h3>投稿ペース</h3><div id="cadence" class="rows"></div></div><div class="panel"><h3>最近の反応変化</h3><div id="recent" class="rows"></div></div></div></section><section class="section"><div class="two"><div class="panel"><h3>曜日別</h3><div id="days" class="rows"></div></div><div class="panel"><h3>時間帯別</h3><div id="hours" class="rows"></div></div></div></section><section class="section"><div class="two"><div class="panel"><h3>反応が強い言葉</h3><div id="words" class="pillbox"></div></div><div class="panel"><h3>ストック候補</h3><div id="evergreen" class="rows"></div></div></div></section><section class="section"><h2>記事一覧</h2><div class="table"><table><thead><tr><th>記事</th><th>公開</th><th>スキ</th><th>コメント</th><th>反応</th></tr></thead><tbody id="articles"></tbody></table></div><p class="note">公開値のみを使用。因果関係ではなく、過去の反応傾向を見るための分析です。</p></section></section></main><script>
const API='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-member-api',TOKEN='mumei-insight-access-token',STORE='mumei-insight-saved-accounts-v3',ACTIVE='mumei-insight-active-account-v3',statusEl=document.getElementById('status'),content=document.getElementById('content'),refresh=document.getElementById('refresh');
const nf=new Intl.NumberFormat('ja-JP'),n=v=>Number(v||0),fmt=v=>nf.format(n(v)),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),dayMs=86400000,now=Date.now(),reaction=a=>n(a.like_count)+n(a.comment_count),dateMs=a=>Date.parse(a.publish_at||0)||0,avg=xs=>xs.length?xs.reduce((s,x)=>s+n(x),0)/xs.length:0,median=xs=>{const a=[...xs].filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return 0;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2};
function restoreToken(){let token=localStorage.getItem(TOKEN)||'';if(token)return token;try{const list=JSON.parse(localStorage.getItem(STORE)||'[]'),active=String(localStorage.getItem(ACTIVE)||'').toLowerCase(),found=(Array.isArray(list)?list:[]).find(x=>String(x?.noteId||'').toLowerCase()===active&&x?.memberToken)||(Array.isArray(list)?list:[]).find(x=>x?.memberToken&&x?.status==='active');if(found?.memberToken){localStorage.setItem(TOKEN,String(found.memberToken));if(found.noteId)localStorage.setItem(ACTIVE,String(found.noteId).toLowerCase());token=String(found.memberToken)}}catch{}return token}
async function post(action,timeout=25000){const token=restoreToken();if(!token)throw new Error('INSIGHT_LOGIN_REQUIRED');const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Insight-Token':token},body:JSON.stringify({action}),cache:'no-store',signal:c.signal}),p=await r.json().catch(()=>({}));if(!r.ok||p?.ok===false)throw new Error(p?.error||'DATA_ERROR');return p}finally{clearTimeout(t)}}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'}).format(d)}
function row(label,sub,val){return `<div class="row"><span><b>${esc(label)}</b><small>${esc(sub||'')}</small></span><em>${esc(val)}</em></div>`}function kpi(label,val,sub){return `<div class="kpi"><small>${esc(label)}</small><b>${esc(val)}</b><span>${esc(sub)}</span></div>`}
function tokenize(title){try{const stop=new Set(['note','する','した','して','です','ます','から','まで','その','この','こと','記事','今日','今回']);return [...new Intl.Segmenter('ja',{granularity:'word'}).segment(String(title||''))].filter(x=>x.isWordLike).map(x=>x.segment.trim()).filter(x=>x.length>=2&&!stop.has(x.toLowerCase())&&!/^\d+$/.test(x))}catch{return String(title||'').split(/[\s【】「」『』!?！？。、・:：()（）]+/).filter(x=>x.length>=2)}}
function render(data){const arts=(data.articles||[]).filter(a=>dateMs(a)>0).sort((a,b)=>dateMs(b)-dateMs(a)),creator=data.creator||{},stats=data.stats||{};if(!arts.length){content.classList.add('hidden');statusEl.className='status warn';statusEl.textContent='保存済み公開記事がまだありません。上の「公開データ更新」を押すと取得を試します。';return false}const likes=arts.map(a=>n(a.like_count)),comments=arts.map(a=>n(a.comment_count)),reacts=arts.map(reaction),inDays=d=>arts.filter(a=>now-dateMs(a)<=d*dayMs),a7=inDays(7),a30=inDays(30),a90=inDays(90),recent=arts.slice(0,10),prev=arts.slice(10,20),r=avg(recent.map(reaction)),p=avg(prev.map(reaction)),delta=p?(r-p)/p*100:0,published=arts.map(dateMs),gaps=published.slice(0,-1).map((x,i)=>(x-published[i+1])/dayMs).filter(x=>x>=0&&x<365);document.getElementById('kpis').innerHTML=[kpi('公開記事',fmt(creator.notes||stats.storedArticles||arts.length),`保存 ${fmt(arts.length)}本`),kpi('フォロワー',fmt(creator.followers||stats.officialFollowers),`フォロー ${fmt(creator.following||stats.officialFollowing)}`),kpi('平均スキ',avg(likes).toFixed(1),`中央値 ${median(likes).toFixed(1)}`),kpi('平均コメント',avg(comments).toFixed(1),`中央値 ${median(comments).toFixed(1)}`),kpi('平均反応',avg(reacts).toFixed(1),'スキ＋コメント'),kpi('直近30日',`${a30.length}本`,`7日 ${a7.length} / 90日 ${a90.length}`),kpi('平均投稿間隔',`${avg(gaps).toFixed(1)}日`,'公開日時から算出'),kpi('最近10本',r.toFixed(1),`前10本比 ${delta>=0?'+':''}${delta.toFixed(1)}%`)].join('');document.getElementById('cadence').innerHTML=[row('直近7日','投稿数',`${a7.length}本`),row('直近30日','投稿数',`${a30.length}本`),row('直近90日','投稿数',`${a90.length}本`),row('平均投稿間隔','記事間隔',`${avg(gaps).toFixed(1)}日`) ].join('');document.getElementById('recent').innerHTML=[row('直近10本','平均反応',r.toFixed(1)),row('その前10本','平均反応',p.toFixed(1)),row('変化','スキ＋コメント',`${delta>=0?'+':''}${delta.toFixed(1)}%`),row('直近10本スキ','平均',avg(recent.map(a=>n(a.like_count))).toFixed(1))].join('');const dm=new Map(),hm=new Map();for(const a of arts){const d=new Date(a.publish_at),wd=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'}).format(d),h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hour:'2-digit',hour12:false}).format(d)),slot=h<6?'0-5時':h<9?'6-8時':h<12?'9-11時':h<15?'12-14時':h<18?'15-17時':h<21?'18-20時':'21-23時';if(!dm.has(wd))dm.set(wd,[]);dm.get(wd).push(a);if(!hm.has(slot))hm.set(slot,[]);hm.get(slot).push(a)}const top=map=>[...map].map(([k,x])=>({k,x,v:avg(x.map(reaction))})).sort((a,b)=>b.v-a.v);document.getElementById('days').innerHTML=top(dm).map(x=>row(x.k,`${x.x.length}本`,`平均 ${x.v.toFixed(1)}`)).join('');document.getElementById('hours').innerHTML=top(hm).map(x=>row(x.k,`${x.x.length}本`,`平均 ${x.v.toFixed(1)}`)).join('');const words=new Map();for(const a of arts)for(const w of new Set(tokenize(a.title))){const x=words.get(w)||{n:0,total:0};x.n++;x.total+=reaction(a);words.set(w,x)}const wr=[...words].filter(([,x])=>x.n>=3).map(([w,x])=>({w,...x,avg:x.total/x.n})).sort((a,b)=>b.avg-a.avg).slice(0,16);document.getElementById('words').innerHTML=wr.length?wr.map(x=>`<span class="pill">${esc(x.w)}｜${x.n}本｜平均${x.avg.toFixed(1)}</span>`).join(''):'<span class="note">同じ言葉が3本以上あると比較できます。</span>';const evergreen=arts.filter(a=>(now-dateMs(a))/dayMs>=60).sort((a,b)=>reaction(b)-reaction(a)).slice(0,8);document.getElementById('evergreen').innerHTML=evergreen.length?evergreen.map(a=>row(a.title,`公開から ${Math.floor((now-dateMs(a))/dayMs)}日`,`反応 ${reaction(a)}`)).join(''):'<span class="note">公開60日以上の記事が増えると表示します。</span>';document.getElementById('articles').innerHTML=arts.slice(0,120).map(a=>`<tr><td class="title"><a href="${esc(a.url||'')}" target="_blank" rel="noreferrer">${esc(a.title||'無題')}</a></td><td>${esc(date(a.publish_at))}</td><td>${fmt(a.like_count)}</td><td>${fmt(a.comment_count)}</td><td>${fmt(reaction(a))}</td></tr>`).join('');content.classList.remove('hidden');statusEl.className='status ok';statusEl.textContent=`@${data.member?.noteId||''}｜保存済み公開データ ${arts.length}記事を分析済み｜本人通知・Dashboard同期なし`;return true}
let busy=false;async function backgroundRefresh(manual=false){if(busy)return;busy=true;refresh.disabled=true;const had=!content.classList.contains('hidden');if(manual||!had){statusEl.className='status';statusEl.textContent='公開データを更新中…保存済み分析はそのまま利用できます。'}try{await post('sync',45000);const fresh=await post('dashboard',25000);render(fresh);statusEl.className='status ok';statusEl.textContent=`更新完了｜本人通知・Dashboard同期なし｜${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`}catch(e){statusEl.className=had?'status ok':'status warn';statusEl.textContent=had?`保存済み分析を表示中。最新更新は次回再試行：${e?.message||e}`:`公開データ更新に失敗：${e?.message||e}`}finally{busy=false;refresh.disabled=false}}
(async()=>{try{if(!restoreToken())throw new Error('INSIGHT_LOGIN_REQUIRED');const saved=await post('dashboard',25000);const shown=render(saved);setTimeout(()=>void backgroundRefresh(false),shown?600:0)}catch(e){statusEl.className='status warn';statusEl.textContent=e?.message==='INSIGHT_LOGIN_REQUIRED'?'INSIGHTへログインしてから開いてください。':`分析を開けませんでした：${e?.message||e}`}})();refresh.onclick=()=>void backgroundRefresh(true);document.getElementById('close').onclick=()=>history.length>1?history.back():location.assign('./#dashboard');
</script></body></html>
