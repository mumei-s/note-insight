<body>
<main class="wrap">
  <div class="top"><a href="./#dashboard">← INSIGHT</a><button id="refresh" type="button">↻ 公開データ更新</button><button id="close" type="button">×</button></div>
  <section class="hero"><small>PUBLIC DETAIL ANALYSIS</small><h1>🔎 本人通知なし詳細分析</h1><p>保存済みの公開記事・スキ・コメント・投稿日時・公開フォロー情報で分析します。本人通知とDashboard同期は不要です。<b>反応＝スキ＋コメント</b>。PV・売上・流入は取得していないため表示しません。</p><div id="status" class="status">保存済み公開データを読み込み中…</div></section>

    <div class="sections">
      <details class="section" data-key="overview"><summary><span>現在地・概要</span><small id="sumOverview">—</small></summary><div class="body"><div id="kpis" class="metric-grid"></div><div id="overviewChart" class="chart"></div></div></details>
      <details class="section" data-key="recent"><summary><span>最近の反応</span><small id="sumRecent">—</small></summary><div class="body"><div id="recent" class="rows"></div><svg id="recentSpark" class="spark" viewBox="0 0 320 92" preserveAspectRatio="none"></svg></div></details>
      <details class="section" data-key="cadence"><summary><span>投稿ペース</span><small id="sumCadence">—</small></summary><div class="body"><div id="cadence" class="rows"></div><div id="cadenceChart" class="chart"></div></div></details>

      <details class="section" data-key="evergreen"><summary><span>ストック候補</span><small id="sumEvergreen">—</small></summary><div class="body"><div id="evergreen" class="rows"></div><div id="evergreenChart" class="chart"></div></div></details>
      <details class="section wide" data-key="articles"><summary><span>記事一覧</span><small id="sumArticles">—</small></summary><div class="body"><div class="article-head"><span>記事</span><span>公開</span><span>スキ</span><span>コメ</span><span>反応</span></div><div id="articles"></div><div id="articlesChart" class="chart"></div><p class="note">反応＝スキ＋コメント。PVではありません。PVは本人通知なしの公開データでは取得していません。</p></div></details>
    </div>
  </div>
</main>
<script>
const API='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-member-api',TOKEN='mumei-insight-access-token',STORE='mumei-insight-saved-accounts-v3',ACTIVE='mumei-insight-active-account-v3';
const statusEl=document.getElementById('status'),content=document.getElementById('content'),refresh=document.getElementById('refresh'),nf=new Intl.NumberFormat('ja-JP'),dayMs=86400000,now=Date.now();

function restoreToken(){let token=localStorage.getItem(TOKEN)||'';if(token)return token;try{const list=JSON.parse(localStorage.getItem(STORE)||'[]'),active=String(localStorage.getItem(ACTIVE)||'').toLowerCase(),arr=Array.isArray(list)?list:[],found=arr.find(x=>String(x?.noteId||'').toLowerCase()===active&&x?.memberToken)||arr.find(x=>x?.memberToken&&x?.status==='active');if(found?.memberToken){token=String(found.memberToken);localStorage.setItem(TOKEN,token);if(found.noteId)localStorage.setItem(ACTIVE,String(found.noteId).toLowerCase())}}catch{}return token}

function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'}).format(d)}

 const arts=(data.articles||[]).filter(a=>dateMs(a)>0).sort((a,b)=>dateMs(b)-dateMs(a)),creator=data.creator||{},stats=data.stats||{};if(!arts.length){content.classList.add('hidden');statusEl.className='status warn';statusEl.textContent='保存済み公開記事がまだありません。公開データ更新を押してください。';return false}
 const likes=arts.map(likeOf),comments=arts.map(commentOf),reacts=arts.map(reaction),inDays=d=>arts.filter(a=>now-dateMs(a)<=d*dayMs),a7=inDays(7),a30=inDays(30),a90=inDays(90),recent=arts.slice(0,10),prev=arts.slice(10,20),recentAvg=avg(recent.map(reaction)),prevAvg=avg(prev.map(reaction)),delta=prevAvg?(recentAvg-prevAvg)/prevAvg*100:0,published=arts.map(dateMs),gaps=published.slice(0,-1).map((x,i)=>(x-published[i+1])/dayMs).filter(x=>x>=0&&x<365),gapAvg=avg(gaps);
 document.getElementById('kpis').innerHTML=[kpi('公開記事数',fmt(creator.notes||stats.storedArticles||arts.length),`保存 ${fmt(arts.length)}本`),kpi('フォロワー数',fmt(creator.followers||stats.officialFollowers),`フォロー ${fmt(creator.following||stats.officialFollowing)}`),kpi('1記事あたり平均スキ数',avg(likes).toFixed(1),`中央値 ${median(likes).toFixed(1)}`),kpi('1記事あたり平均コメント数',avg(comments).toFixed(1),`中央値 ${median(comments).toFixed(1)}`),kpi('1記事あたり平均反応数',avg(reacts).toFixed(1),'スキ＋コメント'),kpi('直近30日の投稿数',`${a30.length}本`,`7日 ${a7.length} / 90日 ${a90.length}`),kpi('平均投稿間隔',`${gapAvg.toFixed(1)}日`,'公開日時から算出'),kpi('直近10本の平均反応数',recentAvg.toFixed(1),`前10本比 ${delta>=0?'+':''}${delta.toFixed(1)}%`)].join('');
 document.getElementById('overviewChart').innerHTML=bars([{k:'平均スキ数',v:avg(likes)},{k:'平均コメント数',v:avg(comments)},{k:'平均反応数',v:avg(reacts)}]);
 document.getElementById('cadence').innerHTML=[row('直近7日の投稿数','期間内の記事数',`${a7.length}本`),row('直近30日の投稿数','期間内の記事数',`${a30.length}本`),row('直近90日の投稿数','期間内の記事数',`${a90.length}本`),row('平均投稿間隔','記事と記事の間隔',`${gapAvg.toFixed(1)}日`)].join('');document.getElementById('cadenceChart').innerHTML=bars([{k:'7日',v:a7.length},{k:'30日',v:a30.length},{k:'90日',v:a90.length}],'本');
 document.getElementById('recent').innerHTML=[row('直近10本','平均反応数（スキ＋コメント）',recentAvg.toFixed(1)),row('その前10本','平均反応数（スキ＋コメント）',prevAvg.toFixed(1)),row('反応変化率','直近10本 vs 前10本',`${delta>=0?'+':''}${delta.toFixed(1)}%`),row('直近10本','平均スキ数',avg(recent.map(likeOf)).toFixed(1))].join('');spark(arts.slice(0,20).map(reaction));
 const dm=new Map(),hm=new Map();for(const a of arts){const d=new Date(publishOf(a)),wd=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'}).format(d),h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hour:'2-digit',hour12:false}).format(d)),slot=h<6?'0-5時':h<9?'6-8時':h<12?'9-11時':h<15?'12-14時':h<18?'15-17時':h<21?'18-20時':'21-23時';if(!dm.has(wd))dm.set(wd,[]);dm.get(wd).push(a);if(!hm.has(slot))hm.set(slot,[]);hm.get(slot).push(a)}const top=map=>[...map].map(([k,x])=>({k,x,v:avg(x.map(reaction))})).sort((a,b)=>b.v-a.v),days=top(dm),hours=top(hm);

let busy=false,watchdog=0;async function backgroundRefresh(manual=false){if(busy){statusEl.className='status warn';statusEl.textContent='更新処理は継続中です。保存済み分析はそのまま利用できます。';return}busy=true;refresh.disabled=true;const had=!content.classList.contains('hidden');watchdog=setTimeout(()=>{busy=false;refresh.disabled=false;statusEl.className='status warn';statusEl.textContent='更新待ちを解除しました。保存済み分析を表示中です。必要ならもう一度更新できます。'},20000);if(manual||!had){statusEl.className='status';statusEl.textContent='公開データを更新中…保存済み分析はそのまま利用できます。'}try{await post('sync',18000);const fresh=await post('dashboard',15000);render(fresh);statusEl.className='status ok';statusEl.textContent=`更新完了｜本人通知・Dashboard同期なし｜${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`}catch(e){statusEl.className=had?'status ok':'status warn';statusEl.textContent=had?`保存済み分析を表示中。更新は再試行できます：${e?.message||e}`:`公開データ更新に失敗：${e?.message||e}`}finally{clearTimeout(watchdog);busy=false;refresh.disabled=false}}
