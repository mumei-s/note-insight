<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>本人通知設定｜INSIGHT</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#050b11;color:#eef8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:
radial-gradient(circle at 86% 0%,rgba(117,79,255,.16),transparent 24%),
radial-gradient(circle at 12% 9%,rgba(44,196,234,.14),transparent 25%),
linear-gradient(180deg,#07131d,#040a10)}
.wrap{width:min(720px,100%);margin:0 auto;padding:14px 12px calc(26px + env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.back{width:42px;height:42px;border:1px solid #35596f;border-radius:12px;background:#0b2230;color:#dff8ff;font-size:20px}
.top div small{display:block;color:#78e3f9;font-size:8px;font-weight:950;letter-spacing:.14em}
.top h1{margin:3px 0 0;font-size:25px}
.hero{padding:14px;border:1px solid #304d61;border-radius:16px;background:#091923;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.hero p{margin:0;color:#97adba;font-size:10px;line-height:1.6}
.stack{display:grid;gap:9px;margin-top:10px}
.card{padding:13px;border:1px solid #2c4658;border-radius:14px;background:#091721}
.card h2{margin:0;font-size:14px}.card p{margin:5px 0 0;color:#93a9b8;font-size:9px;line-height:1.5}
.toggleRow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center}
.toggle{height:44px;border-radius:12px;border:1px solid #3f6276;background:#0c2431;color:#dff8ff;font-weight:950}
.toggle.on{border-color:#4c8b65;background:#123522;color:#c9ffda;box-shadow:0 0 18px rgba(93,228,145,.10)}
.toggle.off{border-color:#87515a;background:#31191e;color:#ffd8dd}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.links a{min-height:42px;border:1px solid #345369;border-radius:11px;background:#0b2130;color:#d9f6ff;text-decoration:none;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:900;padding:7px}
.links a.primary{border-color:#52b8d4;background:#123448}
.status{margin-top:10px;padding:9px 10px;border:1px solid #2d475a;border-radius:10px;background:#08151e;color:#8fa8b7;font-size:9px;line-height:1.5}
.status.ok{border-color:#3d7153;color:#caffd8}.status.err{border-color:#7b454d;color:#ffd0d5}
.note{margin-top:9px;padding:10px;border:1px dashed #314f63;border-radius:10px;color:#8fa7b5;font-size:8.5px;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
<section class="top">
<button class="back" id="back" aria-label="戻る">←</button>
<div><small>無名S note INSIGHT</small><h1>本人通知設定</h1></div>
</section>
<section class="hero"><p>本人通知の読取・保存はそのまま維持し、note公式🔔画面に重ねる操作パネルだけ表示/非表示を切り替えます。</p></section>
<div class="stack">
<section class="card">
<div class="toggleRow">
<div><h2>note公式🔔パネル</h2><p>OFFでも通知の読取・保存は継続します。</p></div>
<button class="toggle" id="panelToggle" type="button">確認中…</button>
</div>
</section>
<section class="card">
<h2>本人通知ツール</h2>
<p id="versionText">バージョンを確認中…</p>
<div class="links"><a class="primary" id="updateLink" href="./tool-setup.html?from=notification-settings">設定・更新</a><a id="filterLink" href="./notification-filter-settings.html">フィルター設定</a></div>
</section>
</div>
<div class="status" id="status">本人通知設定を読み込んでいます…</div>
<p class="note">フィルター設定は別画面です。note公式🔔パネルのON/OFFはこの画面で切り替えます。</p>
</main>
<script>
const PAGE='mumei-notification-settings-page-v1',BRIDGE='mumei-filter-bridge-v1';
const qs=new URLSearchParams(location.search),account=(qs.get('notificationAccount')||'').replace(/^@/,'').toLowerCase();
let panelOn=true;
const statusEl=document.getElementById('status'),toggle=document.getElementById('panelToggle');
document.getElementById('filterLink').href='./notification-filter-settings.html?from=notification-settings&notificationAccount='+encodeURIComponent(account);
function status(text,kind=''){statusEl.textContent=text;statusEl.className='status'+(kind?' '+kind:'')}
function render(){toggle.textContent=panelOn?'ON':'OFF';toggle.className='toggle '+(panelOn?'on':'off');toggle.setAttribute('aria-pressed',panelOn?'true':'false')}
function post(type,payload={}){window.postMessage({source:PAGE,type,account,...payload},location.origin)}
toggle.onclick=()=>{panelOn=!panelOn;render();status('パネル設定を保存中…');post('panel-set',{enabled:panelOn})};
addEventListener('message',e=>{
 if(e.origin!==location.origin||e.data?.source!==BRIDGE)return;
 const d=e.data;
 if(d.type==='state'){panelOn=d.panelOn!==false;render();status('本人通知設定を読み込みました','ok')}
 else if(d.type==='panel-saved'){panelOn=d.panelOn!==false;render();status('note公式🔔パネルを'+(panelOn?'ON':'OFF')+'にしました','ok')}
 else if(d.type==='error')status(String(d.message||'設定を読み込めませんでした'),'err')
});
document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else location.replace('./#dashboard')};
(async()=>{
 try{
   const current=localStorage.getItem('mumei-notification-tool-version')||'未確認';
   const r=await fetch('./insight-release.json?ts='+Date.now(),{cache:'no-store'}),j=await r.json();
   document.getElementById('versionText').textContent='この端末 '+current+' ／ 最新 '+String(j.notificationVersion||'—');
 }catch{document.getElementById('versionText').textContent='この端末の更新状態はINSIGHTから確認できます'}
})();
post('load');
</script>
</body>
</html>
