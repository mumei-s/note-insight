<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>INSIGHT【通知】自動同期</title><style>body{margin:0;background:#070a10;color:#dff8ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(440px,calc(100% - 28px));padding:20px;border:1px solid #35506b;border-radius:16px;background:#0c1621;text-align:center}.box b{display:block;color:#8feaff;margin-bottom:7px}.box span{font-size:12px;color:#9db0c3;line-height:1.6}</style></head><body><div class="box"><b id="title">🔔 本人通知を自動同期中…</b><span id="detail">読み込み・保存後、自動でINSIGHTへ戻ります。操作は不要です。</span></div><script>
const q=new URLSearchParams(location.search),requested=String(q.get('account')||'').trim().replace(/^@/,'').toLowerCase();
const STORE='mumei-insight-saved-accounts-v3',ACTIVE='mumei-insight-active-account-v3',TOKEN='mumei-insight-access-token',APPLICANT='mumei-insight-applicant-token',PASS='mumei-insight-passcode',ENTRY='mumei-insight-entry-mode',ENTRY_ACCOUNT='mumei-insight-notification-account',RESULT='mumei-insight-notification-sync-result-v1';
const title=document.getElementById('title'),detail=document.getElementById('detail');
const syncState=String(q.get('notificationSync')||''),syncError=String(q.get('notificationSyncError')||''),syncedAt=String(q.get('notificationSyncedAt')||''),syncId=String(q.get('notificationSyncId')||'');
function safeAppReturn(v){try{const u=new URL(String(v||''));return u.origin===location.origin&&u.pathname.startsWith('/note-insight/')?u.href:''}catch{return''}}
const originalReturn=safeAppReturn(q.get('return'));
let switched=false,missing=false;
try{
  sessionStorage.setItem(ENTRY,'notifications');sessionStorage.setItem('mumei-insight-entry-at',String(Date.now()));
  if(requested){
    sessionStorage.setItem(ENTRY_ACCOUNT,requested);
    const rows=JSON.parse(localStorage.getItem(STORE)||'[]'),account=Array.isArray(rows)?rows.find(x=>String(x?.noteId||'').trim().replace(/^@/,'').toLowerCase()===requested):null;
    if(account?.memberToken){
      localStorage.setItem(ACTIVE,requested);localStorage.setItem(TOKEN,String(account.memberToken));
      if(account.applicantToken)localStorage.setItem(APPLICANT,String(account.applicantToken));else localStorage.removeItem(APPLICANT);
      if(account.passcode)localStorage.setItem(PASS,String(account.passcode));else localStorage.removeItem(PASS);
      switched=true;
    }else missing=true;
  }
}catch{missing=Boolean(requested)}

function enterInsight(){
  const u=originalReturn?new URL(originalReturn):new URL('./',location.href);
  if(!originalReturn){u.searchParams.set('insightMode','notifications');u.hash='dashboard'}
  if(requested)u.searchParams.set('notificationAccount',requested);
  if(missing)u.searchParams.set('notificationAccountMissing','1');
  if(syncState)u.searchParams.set('notificationSync',syncState);
  if(syncedAt)u.searchParams.set('notificationSyncedAt',syncedAt);
  if(syncId)u.searchParams.set('notificationSyncId',syncId);
  if(syncError)u.searchParams.set('notificationSyncError',syncError);
  const noteAccount=String(q.get('notificationNoteAccount')||'');
  if(noteAccount)u.searchParams.set('notificationNoteAccount',noteAccount);
  try{sessionStorage.setItem(RESULT,JSON.stringify({state:syncState||'unknown',error:syncError,at:Number(syncedAt||Date.now()),noteAccount}))}catch{}
  if(syncState==='done'){title.textContent='✅ 🔔通知を保存しました';detail.textContent='INSIGHT【通知】へ反映して戻ります。'}
  else{title.textContent='⚠️ 🔔通知の自動同期を完了できませんでした';detail.textContent=syncError==='PAIR_REQUIRED'?'本人通知の連携を確認してください。INSIGHT自体はそのまま開きます。':'INSIGHTはそのまま開きます。次回起動時に再試行します。'}
  setTimeout(()=>location.replace(u.href),syncState==='done'?120:650);
}

if(syncState==='done'||syncState==='error'){
  enterInsight();
}else{
  if(requested&&switched){title.textContent=`🔔 @${requested} の本人通知を自動同期中…`;detail.textContent='note通知を読み込み・保存し、完了後にINSIGHTへ自動で戻ります。'}
  else if(requested&&missing){title.textContent=`🔔 @${requested} の本人通知を確認中…`;detail.textContent='note側の同一アカウントを確認してから同期します。'}
  const back=new URL(location.href);
  for(const k of['notificationSync','notificationSyncedAt','notificationSyncId','notificationSyncError','notificationNoteAccount'])back.searchParams.delete(k);
  const id=(globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`).replace(/[^a-z0-9_-]/gi,'').slice(0,80);
  const note=new URL('https://note.com/notifications');
  note.searchParams.set('mumei_insight_sync','1');
  note.searchParams.set('mumei_return',back.href);
  note.searchParams.set('mumei_sync_id',id);
  if(requested)note.searchParams.set('mumei_account',requested);
  setTimeout(()=>location.replace(note.href),120);
}
</script></body></html>
