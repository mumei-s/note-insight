<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>INSIGHT 導入センター</title><style>body{margin:0;background:#070a10;color:#dff8ff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 28px));padding:20px;border:1px solid #35506b;border-radius:16px;background:#0c1621;text-align:center}.box b{display:block;color:#8feaff;margin-bottom:7px}.box span{font-size:12px;color:#9db0c3;line-height:1.6}.box a{display:inline-block;margin-top:14px;color:#8feaff}</style></head><body><div class="box"><b id="title">INSIGHT 導入センターへ移動します…</b><span id="detail">少々お待ちください。</span><a id="fallback" href="./" hidden>INSIGHTを開く</a></div><script>
(function(){
  const q=new URLSearchParams(location.search);
  const seed=q.get('mumei_insight_sync_seed')==='1';
  const title=document.getElementById('title'),detail=document.getElementById('detail'),fallback=document.getElementById('fallback');
  function safeInsight(v){
    try{
      const u=new URL(String(v||''));
      if(u.origin!==location.origin||!u.pathname.startsWith('/note-insight/'))return'';
      if(/\/notification-entry\.html$/i.test(u.pathname)){
        const nested=u.searchParams.get('return');
        if(nested){
          const n=new URL(nested);
          if(n.origin===location.origin&&n.pathname.startsWith('/note-insight/'))return n.href;
        }
      }
      return u.href;
    }catch{return''}
  }
  function returnToInsight(){
    const dest=new URL(safeInsight(q.get('mumei_return'))||new URL('./',location.href).href);
    dest.searchParams.set('notificationSync','error');
    dest.searchParams.set('notificationSyncError','RUNTIME_TIMEOUT');
    dest.searchParams.set('notificationSyncedAt',String(Date.now()));
    location.replace(dest.href);
  }
  if(seed){
    document.title='INSIGHT 本人通知 自動同期';
    title.textContent='🔔 INSIGHT 自動同期を準備中…';
    detail.textContent='本人通知へ同期要求を渡しています。INSIGHT本体は失敗時でも自動で開きます。';
    const manual=safeInsight(q.get('mumei_return'))||new URL('./',location.href).href;
    fallback.href=manual;
    fallback.hidden=false;
    setTimeout(()=>{
      if(!location.search.includes('mumei_insight_sync_seed=1'))return;
      title.textContent='⚠️ 本人通知の起動を確認できませんでした';
      detail.textContent='INSIGHTへ戻ります。本人通知の設定はINSIGHTを開いた後に確認できます。';
      setTimeout(returnToInsight,450);
    },6500);
    return;
  }
  const u=new URL('./tool-setup.html',location.href);
  for(const[k,v]of q)u.searchParams.set(k,v);
  u.searchParams.set('focus','dashboard');
  u.hash=location.hash;
  location.replace(u.href);
})();
</script><noscript><a href="./">INSIGHTを開く</a></noscript></body></html>
