<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>INSIGHT 導入センター</title><style>body{margin:0;background:#070a10;color:#dff8ff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 28px));padding:20px;border:1px solid #35506b;border-radius:16px;background:#0c1621;text-align:center}.box b{display:block;color:#8feaff;margin-bottom:7px}.box span{font-size:12px;color:#9db0c3;line-height:1.6}.box a{display:inline-block;margin-top:14px;color:#8feaff}</style></head><body><div class="box"><b id="title">INSIGHT 導入センターへ移動します…</b><span id="detail">少々お待ちください。</span><a id="fallback" href="./tool-setup.html?focus=dashboard" hidden>導入センターを開く</a></div><script>
(function(){
  const q=new URLSearchParams(location.search);
  const seed=q.get('mumei_insight_sync_seed')==='1';
  const title=document.getElementById('title'),detail=document.getElementById('detail'),fallback=document.getElementById('fallback');
  if(seed){
    document.title='INSIGHT 本人通知 自動同期';
    title.textContent='🔔 INSIGHT 自動同期を準備中…';
    detail.textContent='Tampermonkeyへ同期要求を渡しています。この画面は自動で切り替わります。';
    setTimeout(()=>{
      if(!location.search.includes('mumei_insight_sync_seed=1'))return;
      title.textContent='🔔 本人通知の起動を確認中…';
      detail.textContent='この表示が続く場合は本人通知Userscriptの実行状態を確認してください。';
      fallback.hidden=false;
    },8000);
    return;
  }
  const u=new URL('./tool-setup.html',location.href);
  for(const[k,v]of q)u.searchParams.set(k,v);
  u.searchParams.set('focus','dashboard');
  u.hash=location.hash;
  location.replace(u.href);
})();
</script><noscript><a href="./tool-setup.html?focus=dashboard">導入センターを開く</a></noscript></body></html>
