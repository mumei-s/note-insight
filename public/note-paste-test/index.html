<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>note 極薄リンク画像テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 12px 60px}.box{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px}.note{font-size:14px;line-height:1.7;color:#555;margin:6px 0 14px}.preview{display:inline-block;max-width:100%;border:1px solid #ddd;border-radius:12px;padding:7px;background:#fafafa}.preview img{display:block;width:580px;max-width:100%;height:auto;border-radius:9px}.actions{display:grid;gap:10px;margin-top:16px;max-width:580px}button{border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;background:#111;color:#fff}.status{min-height:26px;margin-top:12px;font-weight:700;font-size:14px}.hint{font-size:13px;color:#666;line-height:1.7;margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h2 style="margin:0 0 4px">極薄リンク付き画像テスト</h2>
<p class="note">前回②で画像＋リンクが入った方式だけを残しました。カード本体を <b>580×96px</b> にして、noteで本文幅いっぱいに拡大されにくいサイズへ変更しています。</p>
<div class="preview"><img id="card" src="./thin-card.png?v=580x96" width="580" height="96" alt="極薄記事カード"></div>
<div class="actions"><button id="copy">リンク付き極薄画像をコピー</button></div>
<div class="status" id="status">画像が表示されてから押してください。</div>
<p class="hint">画像保存・URL後付けは不要。貼り付け後、画像をタップして元記事へ飛べるかも確認してください。</p>
</div></div>
<script>
const URL='https://note.com/ss_yr/n/nc14eb3f2ea9f';
const IMG=new URL('./thin-card.png?v=580x96',location.href).href;
const TITLE='【言葉と行動、その間にあるもの】 第2回スキ動画コンテスト『夏の陣』🏖';
const status=document.getElementById('status');
const visible=document.getElementById('card');
visible.onload=()=>status.textContent='✅ 画像表示OK。コピーできます。';
visible.onerror=()=>status.textContent='⚠️ 画像がまだ更新されていません。少し待って再読み込みしてください。';
async function copyRich(){
  try{
    if(!navigator.clipboard || !window.ClipboardItem) throw new Error('このブラウザではリッチコピーに対応していません');
    const html=`<a href="${URL}"><img src="${IMG}" alt="${TITLE}" width="580" height="96" style="display:block;width:580px;height:96px;max-width:580px"></a>`;
    const item=new ClipboardItem({
      'text/html':new Blob([html],{type:'text/html'}),
      'text/plain':new Blob([URL],{type:'text/plain'})
    });
    await navigator.clipboard.write([item]);
    status.textContent='✅ コピーしました。noteへ貼り付けてください。';
  }catch(e){status.textContent='⚠️ コピー失敗: '+e.message;}
}
document.getElementById('copy').onclick=copyRich;
</script>
</body></html>
