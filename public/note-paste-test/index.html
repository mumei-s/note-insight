<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>note 極薄リンク画像テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 12px 60px}.box{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px}.note{font-size:14px;line-height:1.7;color:#555}.preview{margin-top:14px;border:1px solid #ddd;border-radius:12px;padding:8px;background:#fafafa}.preview img{display:block;width:100%;height:auto;border-radius:10px}.actions{display:grid;gap:10px;margin-top:16px}button{border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;background:#111;color:#fff}.status{min-height:26px;margin-top:12px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<h2 style="margin:0 0 6px">極薄リンク付き画像テスト</h2>
<p class="note">今回はブラウザ内で画像加工しません。GitHub側で作成済みの <b>1500×180</b> 極薄PNGを、そのまま元記事リンク付きでコピーします。</p>
<div class="preview"><img id="card" src="./thin-card.png?v=180" alt="極薄記事カード"></div>
<div class="actions"><button id="copy">極薄リンク付き画像をコピー</button></div>
<div class="status" id="status">準備完了</div>
</div></div>
<script>
const URL='https://note.com/ss_yr/n/nc14eb3f2ea9f';
const IMG=new URL('./thin-card.png?v=180',location.href).href;
const TITLE='【言葉と行動、その間にあるもの】 第2回スキ動画コンテスト『夏の陣』🏖';
const status=document.getElementById('status');
async function copyThin(){
  try{
    if(!navigator.clipboard || !window.ClipboardItem) throw new Error('このブラウザではリッチコピーに対応していません');
    const html=`<a href="${URL}"><img src="${IMG}" alt="${TITLE}" width="1500" height="180" style="display:block;max-width:100%;height:auto"></a>`;
    const item=new ClipboardItem({
      'text/html':new Blob([html],{type:'text/html'}),
      'text/plain':new Blob([URL],{type:'text/plain'})
    });
    await navigator.clipboard.write([item]);
    status.textContent='✅ コピーしました。noteへ貼り付けてください。';
  }catch(e){status.textContent='⚠️ コピー失敗: '+e.message}
}
document.getElementById('copy').onclick=copyThin;
</script>
</body></html>
