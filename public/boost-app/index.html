<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<title>巡回BOOST App</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#050b10;color:#eef7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131b,#04080c);min-height:100vh}.app{max-width:760px;margin:auto;padding:12px 12px 88px}.head{position:sticky;top:0;z-index:5;background:rgba(5,11,16,.94);backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid #203342}.head h1{font-size:18px;margin:0}.sub{font-size:11px;color:#8ca6b8;margin-top:3px}.card{margin-top:10px;border:1px solid #263c4c;border-radius:14px;background:#0a151e;padding:10px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}input,button{font:inherit}input{width:100%;background:#081018;color:#fff;border:1px solid #355065;border-radius:10px;padding:11px}button{border:1px solid #355065;background:#112432;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800}button.primary{background:#0d4a34;border-color:#2fa36d}button:disabled{opacity:.45}.status{font-size:12px;padding:8px;border-radius:9px;background:#071019;color:#a9c1d1}.ok{color:#80f1b1}.bad{color:#ff9c9c}.creator{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}.creator img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#13232f}.name{font-weight:900}.id,.meta,.stats{font-size:11px;color:#88a3b5}.bio{font-size:12px;color:#c2d0db;margin-top:5px;white-space:pre-wrap}.article{margin-top:8px;border:1px solid #294353;border-radius:12px;padding:9px;background:#07131b}.article h2{font-size:15px;margin:0 0 5px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.actions.two{grid-template-columns:repeat(2,1fr)}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#101c24;margin-top:8px}.limit{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-top:7px}.pill{padding:7px;border:1px solid #284050;border-radius:9px;background:#071019}.modal{position:fixed;inset:0;z-index:20;background:#03080bef;display:none}.modal.show{display:flex;flex-direction:column}.modalhead{padding:10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #243947}.modalbody{padding:10px;overflow:auto;flex:1}.listitem{border:1px solid #263d4c;border-radius:10px;padding:9px;margin-bottom:8px;background:#09141c}.listitem img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#13232f}.mag{display:grid;grid-template-columns:50px 1fr auto;gap:8px;align-items:center;border:1px solid #294251;border-radius:10px;padding:8px;margin-bottom:7px}.mag img{width:50px;height:50px;object-fit:cover;border-radius:8px;background:#13232f}.footer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr 1fr;background:#071019ee;border-top:1px solid #263d4d;padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.footer button{border-radius:8px;border:0;background:transparent}.footer button.active{background:#142838}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="head"><h1>巡回BOOST App</h1><div class="sub">note画面には常駐しません。専用アプリから操作します。</div></div>
  <div class="card">
    <div class="row"><div class="grow"><input id="source" placeholder="#タグ / 記事URL / マガジンURL / クリエイターID"></div><button id="start" class="primary">開始</button></div>
    <div id="status" class="status" style="margin-top:8px">未接続</div>
    <div class="limit"><div id="likeLimit" class="pill">♡ —</div><div id="magLimit" class="pill">📚 —</div></div>
  </div>
  <div id="current" class="card hidden"></div>
</div>
<div class="footer"><button id="prev">戻る</button><button id="home" class="active">現在</button><button id="next">次へ</button></div>
<div id="previewModal" class="modal"><div class="modalhead"><button data-close="previewModal">戻る</button><b>プレビュー</b></div><div id="previewBody" class="modalbody"></div></div>
<div id="creatorModal" class="modal"><div class="modalhead"><button data-close="creatorModal">戻る</button><b>クリエイター</b></div><div id="creatorBody" class="modalbody"></div></div>
<div id="magModal" class="modal"><div class="modalhead"><button data-close="magModal">戻る</button><b>マガジン追加</b></div><div id="magBody" class="modalbody"></div></div>
<script src="./app.js"></script>
</body>
</html>
