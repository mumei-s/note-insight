<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<title>note 巡回BOOST｜専用アプリ</title>
<meta name="description" content="note巡回BOOST 専用アプリ入口">
<meta property="og:title" content="note巡回BOOST｜専用アプリ">
<meta property="og:description" content="記事・タグ・マガジン・クリエイターから巡回">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#05090e;color:#eef7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 20%,#102c58 0,#07131b 35%,#03070b 75%)}main{width:min(460px,100%);border:1px solid #31516a;border-radius:22px;padding:26px 18px;background:#09141ddd;box-shadow:0 24px 70px #0009;text-align:center}h1{margin:0;font-size:27px;letter-spacing:.02em}strong{background:linear-gradient(90deg,#55d9ff,#917cff);-webkit-background-clip:text;color:transparent}p{color:#9db3c2;line-height:1.7;font-size:13px}.btn{display:block;width:100%;margin-top:12px;padding:15px;border-radius:14px;text-decoration:none;font-weight:900;color:#fff;border:1px solid #45a8a0;cursor:pointer}.share{background:linear-gradient(100deg,#174d8a,#6f4fc8);border-color:#7ca9ff}.copy{background:linear-gradient(100deg,#5c4512,#9a7218);border-color:#d4ad54}.normal{background:linear-gradient(100deg,#0f6b4b,#185780)}.small{margin-top:12px;font-size:10px;color:#6f8797;line-height:1.55}.result{margin-top:10px;font-size:11px;color:#8feaff;min-height:1.4em;word-break:break-all}
</style>
</head>
<body><main><h1>note巡回<strong>BOOST</strong></h1><p>ChatGPTなどのアプリ内ブラウザでは、外部ブラウザ強制起動が止められる場合があります。<br>その場合は「共有」か「URLコピー」を使ってください。</p><button class="btn share" id="share">共有してブラウザへ渡す</button><button class="btn copy" id="copy">専用URLをコピー</button><a class="btn normal" id="openNormal" href="https://note.com/?boost_app=1">このブラウザで開く</a><div id="result" class="result"></div><div class="small">共有先で Yahoo!ブラウザー / Edge / Chrome などを選ぶか、コピーしたURLを使いたいブラウザのアドレス欄へ貼り付けてください。<br>Tampermonkey「note 巡回BOOST｜専用アプリ v6.2.1」が必要です。</div></main><script>
(() => {
  const TARGET='https://note.com/?boost_app=1';
  const result=document.getElementById('result');
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(TARGET);
      result.textContent='✅ 専用URLをコピーしました';
    } catch (_) {
      const ta=document.createElement('textarea');ta.value=TARGET;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand('copy');result.textContent='✅ 専用URLをコピーしました';}catch(e){result.textContent='コピーできませんでした：'+TARGET;}
      ta.remove();
    }
  });
  document.getElementById('share').addEventListener('click', async () => {
    if (!navigator.share) { result.textContent='共有が使えないためURLコピーを使ってください'; return; }
    try { await navigator.share({title:'note巡回BOOST 専用アプリ',text:'note巡回BOOST 専用アプリ',url:TARGET}); result.textContent='共有画面を開きました'; }
    catch (e) { if(e?.name!=='AbortError') result.textContent='共有できませんでした。URLコピーを使ってください'; }
  });
})();
</script></body>
</html>
