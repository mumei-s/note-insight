<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<title>note 巡回BOOST｜専用アプリ</title>
<meta name="description" content="note巡回BOOST 専用アプリ入口">
<meta property="og:title" content="note巡回BOOST｜専用アプリ">
<meta property="og:description" content="記事・タグ・マガジン・クリエイターから巡回">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#05090e;color:#eef7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 20%,#102c58 0,#07131b 35%,#03070b 75%)}main{width:min(460px,100%);border:1px solid #31516a;border-radius:22px;padding:26px 18px;background:#09141ddd;box-shadow:0 24px 70px #0009;text-align:center}h1{margin:0;font-size:27px;letter-spacing:.02em}strong{background:linear-gradient(90deg,#55d9ff,#917cff);-webkit-background-clip:text;color:transparent}p{color:#9db3c2;line-height:1.7;font-size:13px}.btn{display:block;width:100%;margin-top:12px;padding:15px;border-radius:14px;text-decoration:none;font-weight:900;color:#fff;border:1px solid #45a8a0;cursor:pointer}.yahoo{background:linear-gradient(100deg,#721025,#b51d3d);border-color:#f07086}.copy{background:linear-gradient(100deg,#5c4512,#9a7218);border-color:#d4ad54}.normal{background:linear-gradient(100deg,#0f6b4b,#185780)}.small{margin-top:12px;font-size:10px;color:#6f8797;line-height:1.55}.result{margin-top:10px;font-size:11px;color:#8feaff;min-height:1.4em;word-break:break-all}
</style>
</head>
<body><main><h1>note巡回<strong>BOOST</strong></h1><p>Yahoo!ブラウザーは「共有」だとトップだけ開くことがあるため、URLを直接渡す専用起動に変更しました。</p><a class="btn yahoo" id="openYahoo" href="intent://note.com/?boost_app=1#Intent;scheme=https;package=jp.co.yahoo.android.ybrowser;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end">Yahoo!ブラウザーで専用アプリを開く</a><button class="btn copy" id="copy">専用URLをコピー</button><a class="btn normal" id="openNormal" href="https://note.com/?boost_app=1">このブラウザで開く</a><div id="result" class="result"></div><div class="small">Yahoo!ブラウザーで開けない場合は「専用URLをコピー」→ Yahoo!ブラウザーのアドレス欄へ貼り付けてください。<br>Tampermonkey「note 巡回BOOST｜専用アプリ v6.2.1」が必要です。</div></main><script>
(() => {
  const TARGET='https://note.com/?boost_app=1';
  const result=document.getElementById('result');
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(TARGET);
      result.textContent='✅ 専用URLをコピーしました：'+TARGET;
    } catch (_) {
      const ta=document.createElement('textarea');ta.value=TARGET;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand('copy');result.textContent='✅ 専用URLをコピーしました：'+TARGET;}catch(e){result.textContent='コピーできませんでした：'+TARGET;}
      ta.remove();
    }
  });
})();
</script></body>
</html>
