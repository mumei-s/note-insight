<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>INSIGHT 導入センター</title><style>*{box-sizing:border-box}body{margin:0;background:#061019;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(680px,calc(100% - 10px));margin:auto;padding:8px 0 28px}.back{display:inline-flex;min-height:38px;align-items:center;color:#79eaff;text-decoration:none;font-weight:950}.card{border:1px solid #31506a;border-radius:15px;background:#0a1722;padding:11px}h1{margin:3px 0 5px;font-size:23px}.lead{margin:0 0 8px;color:#a8c0d1;font-size:10.5px;line-height:1.65}.status{padding:9px;border:1px solid #3b5b72;border-radius:10px;background:#08131d;color:#c1ddea;font-size:10px;line-height:1.5}.ok{border-color:#3d7a5f!important;background:#0b1d16!important;color:#baffd6!important}.warn{border-color:#806730!important;background:#201807!important;color:#ffe2a0!important}.bad{border-color:#8e4343!important;background:#251010!important;color:#ffd0d0!important}.tool{margin-top:7px;padding:9px;border:1px solid #334f64;border-radius:10px;background:#08151f;font-size:9px}.tool b{display:block;font-size:10.5px}.tool span{display:block;margin-top:3px;color:#91a9ba}.panel{margin-top:8px;border:1px solid #2d465a;border-radius:11px;background:#07131c;padding:9px}.device{font-weight:950;font-size:11px;color:#baffd6}.tip{margin-top:7px;padding:8px;border:1px solid #38546a;border-radius:8px;background:#08141e;color:#bfd1df;font-size:9.7px;line-height:1.6}.steps{display:grid;gap:7px;margin-top:8px}.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #486b82;border-radius:9px;background:#10283a;color:#e9f8ff;text-decoration:none;font:950 10.5px/1.25 system-ui;text-align:center;padding:8px}.gold{background:#2a210b;border-color:#846e35;color:#ffe7a7}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.btn[aria-disabled="true"],.btn:disabled{opacity:.42;pointer-events:none}.mini{margin-top:7px;color:#7f95a7;font-size:8.8px;line-height:1.55}.fallback{display:none;margin-top:8px;padding:8px;border:1px solid #806730;border-radius:9px;background:#201807;color:#ffe2a0;font-size:9px;line-height:1.55}.fallback.show{display:block}</style></head><body><main class="wrap"><a id="back" class="back">← INSIGHTへ戻る</a><section class="card"><small>ONE SETUP CENTER</small><h1>INSIGHT 導入センター</h1><p class="lead"><b>本人通知＋ダッシュボード同期は1本だけ。</b><br>Tampermonkeyをすでに入れている人は、Tampermonkey自体を入れ直す必要はありません。下の「インストール／更新」を1回押して、Tampermonkey画面で更新するだけです。</p><div id="account" class="status">INSIGHT認証を確認中…</div><div id="toolState" class="tool"><b>🔔📊 統合スクリプト</b><span>確認中…</span></div><div class="panel"><div id="device" class="device">この端末を確認中…</div><div id="tip" class="tip"></div><div class="steps"><a id="install" class="btn gold">通知＋ダッシュボードをインストール／更新</a><button id="dash" class="btn green" type="button">ダッシュボードを認証して今すぐ読込</button><button id="notice" class="btn" type="button">本人通知を実働確認／連携</button><a class="btn" href="https://note.com/">noteを開いて🔔通知へ</a></div><div class="mini">通常手順で「Import from URL」は使いません。既にTampermonkey導入済みなら再導入も不要です。</div></div><div id="fallback" class="fallback"></div></section></main><script>
const API_D='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-dashboard-import-token',API_N='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',NOTICE_KEY='mumei-notification-tool-version',PENDING='mumei-direct-install-pending',RELOAD='mumei-direct-install-reload',q=new URLSearchParams(location.search),accountBox=document.getElementById('account'),toolState=document.getElementById('toolState'),install=document.getElementById('install'),dashBtn=document.getElementById('dash'),noticeBtn=document.getElementById('notice'),fallback=document.getElementById('fallback');let release={dashboardVersion:'1.4.4',notificationVersion:'3.1.9'},who=null,busy=false;
function norm(v){const m=String(v||'').match(/@?([A-Za-z0-9_-]+)/);return m?m[1].toLowerCase():''}const expected=norm(q.get('account'));function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./',location.href).href}catch{return new URL('./',location.href).href}}const back=safeReturn(q.get('return'));document.getElementById('back').href=back;
function headers(){const h={'Content-Type':'application/json'},o=localStorage.getItem(OWNER)||'',m=localStorage.getItem(MEMBER)||'';if(o)h['X-Owner-Token']=o;if(m)h['X-Insight-Token']=m;return h}function role(){if(expected)return expected==='ss_yr'?'owner':'member';if(localStorage.getItem(OWNER)&&!localStorage.getItem(MEMBER))return'owner';return'member'}async function api(url,action,extra={}){const r=await fetch(url,{method:'POST',headers:headers(),body:JSON.stringify({action,role:role(),...extra}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok||p?.ok===false)throw new Error(p?.error||'AUTH_FAILED');if(expected&&norm(p.noteId)&&norm(p.noteId)!==expected)throw new Error(`INSIGHT_ACCOUNT_MISMATCH：@${expected} / @${norm(p.noteId)}`);return p}
async function loadRelease(){try{const r=await fetch('./insight-release.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)release={...release,...await r.json()}}catch{}paint();paintInstall()}
function paint(){const n=localStorage.getItem(NOTICE_KEY)||'';toolState.className='tool '+(n===release.notificationVersion?'ok':'warn');toolState.querySelector('span').textContent=n===release.notificationVersion?`準備済み v${n}｜本人通知＋ダッシュボード`:`${n||'未確認'} → v${release.notificationVersion}｜本人通知＋ダッシュボード`}
const checked=q.get('notificationInstalled')||'';if(checked)localStorage.setItem(NOTICE_KEY,checked);
const UA=navigator.userAgent||'',platform=navigator.platform||'',isIOS=/iPhone|iPad|iPod/i.test(UA)||(platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPR|Android/i.test(UA),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isMac=!isIOS&&/Macintosh/i.test(UA);function env(){if(isIOS&&isSafari)return'ios-safari';if(isIOS)return'ios-other';if(isAndroid&&isEdge)return'android-edge';if(isAndroid&&isFirefox)return'android-firefox';if(isAndroid)return'android-other';if(isMac&&isSafari)return'mac-safari';return'pc'}
const names={'android-edge':'Android Edge','android-firefox':'Android Firefox','android-other':'Android Chrome / Yahoo','ios-safari':'iPhone / iPad Safari','ios-other':'iPhone / iPad Safari以外','mac-safari':'Mac Safari','pc':'PC Edge / Chrome / Firefox'},help={'android-edge':'Tampermonkey導入済みなら、下の1ボタンだけで更新します。Tampermonkeyそのものの再インストールは不要です。','android-firefox':'Userscript拡張が導入済みなら、下の1ボタンだけで統合スクリプトを更新します。','android-other':'Android Chrome / YahooはUserscript導入が不安定です。参加者はEdgeまたはFirefoxでこの画面を開いてください。','ios-safari':'Userscripts環境では、統合スクリプト1本だけを保存／更新します。','ios-other':'導入・更新時だけSafariでこの画面を開き、統合スクリプト1本を更新してください。','mac-safari':'Userscripts環境では、統合スクリプト1本だけを保存／更新します。','pc':'Tampermonkey等が導入済みなら、下の1ボタンだけで統合スクリプトを更新します。'};
function script(){const u=new URL('./note-insight-notification-v3.user.js',location.href);u.searchParams.set('v',release.notificationVersion);return u.href}
function paintInstall(){const k=env(),bad=k==='android-other',file=['ios-safari','ios-other','mac-safari'].includes(k);document.getElementById('device').textContent=`${names[k]}｜この端末`;document.getElementById('tip').textContent=help[k];install.href=script();install.removeAttribute('target');install.removeAttribute('download');install.removeAttribute('aria-disabled');install.textContent='通知＋ダッシュボードをインストール／更新';if(file){install.setAttribute('download','mumei-insight-unified.user.js');install.textContent='通知＋ダッシュボードを保存／更新'}if(bad){install.setAttribute('aria-disabled','true');dashBtn.disabled=true;noticeBtn.disabled=true}}
async function auth(){accountBox.className='status';accountBox.textContent='INSIGHT認証を確認中…';const p=await api(API_D,'stats');who=p;accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜INSIGHT認証済み`;return p}
function savePending(){localStorage.setItem(PENDING,JSON.stringify({kind:'notice',at:Date.now(),back,url:script()}));sessionStorage.removeItem(RELOAD);fallback.classList.remove('show');accountBox.className='status';accountBox.textContent='統合スクリプトのインストール／更新画面へ進みます。Tampermonkey画面では「更新」を押してください。'}
function pending(){try{return JSON.parse(localStorage.getItem(PENDING)||'null')}catch{return null}}function clearPending(){localStorage.removeItem(PENDING);sessionStorage.removeItem(RELOAD)}
function versionCheckUrl(){const u=new URL('https://note.com/');u.searchParams.set('mumei_insight_version_check','1');const ret=new URL('./tool-setup.html',location.href);if(expected)ret.searchParams.set('account',expected);ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);return u.href}
function recover(){const p=pending();if(!p)return;const n=localStorage.getItem(NOTICE_KEY)||'';if(n===release.notificationVersion){clearPending();fallback.classList.remove('show');accountBox.className='status ok';accountBox.textContent='✅ 統合スクリプトの更新を確認しました。このまま連携できます。';paint();return}const age=Date.now()-Number(p.at||0);if(age<700)return;if(sessionStorage.getItem(RELOAD)!=='notice-check'){sessionStorage.setItem(RELOAD,'notice-check');accountBox.className='status';accountBox.textContent='note側で統合スクリプトの更新を確認します…';location.assign(versionCheckUrl());return}if(age>1800){fallback.textContent='更新を確認できませんでした。Tampermonkey自体の再インストールは不要です。上の「インストール／更新」をもう一度押し、Tampermonkey画面で「更新」を選んでください。';fallback.classList.add('show');accountBox.className='status warn';accountBox.textContent='統合スクリプトの更新確認待ちです。'}}
async function dash(){if(busy)return;busy=true;try{const p=who||await auth(),x=await api(API_D,'pair-start'),u=new URL('https://note.com/sitesettings/stats');u.searchParams.set('mumei_dashboard_pair',String(x.pairingCode||''));u.searchParams.set('mumei_dashboard_sync','1');u.searchParams.set('mumei_dashboard_account',norm(x.noteId||p.noteId));u.searchParams.set('mumei_dashboard_return',back);u.searchParams.set('mumei_dashboard_tool_version',release.dashboardVersion);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'ダッシュボード認証に失敗しました';busy=false}}
async function notice(){if(busy)return;busy=true;try{const p=await api(API_N,'stats');who=p;const x=await api(API_N,'pair-start'),u=new URL(x.noteUrl),ret=new URL('./tool-setup.html',location.href);ret.searchParams.set('account',norm(x.noteId));ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'本人通知連携に失敗しました';busy=false}}
install.addEventListener('click',e=>{if(install.getAttribute('aria-disabled')==='true'){e.preventDefault();return}savePending()});dashBtn.addEventListener('click',()=>void dash());noticeBtn.addEventListener('click',()=>void notice());
async function init(){await loadRelease();paint();try{await auth()}catch(e){accountBox.className='status warn';accountBox.textContent=(localStorage.getItem(OWNER)||localStorage.getItem(MEMBER))?(e.message||'INSIGHT認証を確認できませんでした'):'INSIGHTへ戻ってログインしてください'}recover()}
window.addEventListener('pageshow',()=>void init());window.addEventListener('focus',()=>{paint();recover()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){paint();recover()}});void init();
</script></body></html>
