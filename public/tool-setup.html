<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>INSIGHT インストール / 更新</title><style>
*{box-sizing:border-box}body{margin:0;background:#061019;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(620px,calc(100% - 20px));margin:auto;padding:10px 0 28px}.back{display:inline-flex;min-height:34px;align-items:center;color:#79eaff;text-decoration:none;font-weight:900;font-size:13px}.card{border:1px solid #31506a;border-radius:14px;background:#0a1722;padding:13px}h1{margin:2px 0 4px;font-size:22px}.lead{margin:0 0 8px;color:#a8c0d1;font-size:12px;line-height:1.55}.panel{margin-top:10px;border:1px solid #2d465a;border-radius:10px;background:#07131c;padding:10px}.step-title{font-size:15px;margin:0 0 7px}.mini{margin:5px 0 0;color:#8ca2b3;font-size:11px;line-height:1.5}.group-label{font-size:11px;color:#abc1d0;margin:7px 0 4px}.browser-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.browser-choice{min-height:35px;border:1px solid #486b82;border-radius:999px;background:#102330;color:#eef8ff;padding:4px 10px;font:800 12px/1.15 system-ui;cursor:pointer;white-space:normal}.browser-choice[aria-pressed="true"]{border:2px solid #7ee4ed;background:#173e4b;color:#fff}.tip{margin-top:6px;padding:7px 8px;border:1px solid #38546a;border-radius:8px;background:#08141e;color:#bfd1df;font-size:11px;line-height:1.55}.steps{display:grid;gap:6px;margin-top:7px}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;border:1px solid #486b82;border-radius:9px;background:#10283a;color:#e9f8ff;text-decoration:none;font:900 13px/1.25 system-ui;text-align:center;padding:7px 9px}.gold{background:#2a210b;border-color:#846e35;color:#ffe7a7}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.btn[aria-disabled="true"],.btn:disabled{opacity:.42;pointer-events:none}.result{margin-top:8px;padding:10px;border:1px solid #3b5b72;border-radius:9px;background:#08131d;font-size:13px;font-weight:850;line-height:1.45}.ok{border-color:#3d7a5f!important;background:#0b1d16!important;color:#baffd6!important}.warn{border-color:#806730!important;background:#201807!important;color:#ffe2a0!important}.bad{border-color:#8e4343!important;background:#251010!important;color:#ffd0d0!important}.fallback{display:none;margin-top:8px;padding:8px;border:1px solid #806730;border-radius:9px;background:#201807;color:#ffe2a0;font-size:11px;line-height:1.5}.fallback.show{display:block}[hidden]{display:none!important}summary{cursor:pointer;font-size:12px;font-weight:800;min-height:30px;align-content:center}#pageUrl{width:100%;font-size:11px;padding:7px;margin-top:6px;color:#eef8ff;background:#061019;border:1px solid #486b82;border-radius:6px}a{color:#91e9ff}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}@media(max-width:360px){.wrap{width:min(620px,calc(100% - 14px))}.card{padding:10px}.browser-choice{font-size:11px;padding:3px 7px}}
</style></head><body><main class="wrap"><a id="back" class="back">← INSIGHTへ戻る</a><section class="card"><h1>INSIGHT インストール / 更新</h1><p class="lead">本人通知＋ダッシュボード同期は1本です。<br>すでにTampermonkeyを使っている場合、入れ直しは不要です。</p>
<section class="panel"><h2 class="step-title">1　ブラウザを選ぶ</h2><p class="mini" id="detected"></p><p class="group-label">Android</p><div class="browser-grid"><button class="browser-choice" data-browser="android-edge" type="button">Edge</button><button class="browser-choice" data-browser="android-firefox" type="button">Firefox</button><button class="browser-choice" data-browser="android-other" type="button">Chrome・その他</button></div><p class="group-label">iPhone・iPad</p><div class="browser-grid"><button class="browser-choice" data-browser="ios-safari" type="button">Safari</button><button class="browser-choice" data-browser="ios-other" type="button">Chrome・Edge・その他</button></div><p class="group-label">パソコン</p><div class="browser-grid"><button class="browser-choice" data-browser="pc-edge" type="button">Edge</button><button class="browser-choice" data-browser="pc-chrome" type="button">Chrome</button><button class="browser-choice" data-browser="pc-firefox" type="button">Firefox</button><button class="browser-choice" data-browser="mac-safari" type="button">Safari（Mac）</button></div></section>
<section class="panel"><h2 id="device" class="step-title">2　インストール / 更新</h2><div id="tip" class="tip"></div><div id="switchBrowser" hidden><button id="copyPage" type="button" class="btn green">このページのURLをコピー</button><input id="pageUrl" readonly aria-label="設定画面のURL"></div><div id="updateFlow"><div class="steps"><a id="install" class="btn gold">INSIGHTをインストール / 更新</a></div><details class="panel" id="textHelp"><summary>文字列になった・更新画面が出ない</summary><div class="tip" id="recoverySteps"></div></details><details class="panel"><summary>初めて使う方だけ：拡張機能を準備</summary><div class="tip" id="firstSteps"></div><a id="extensionGuide" class="btn" target="_blank" rel="noopener">拡張機能の公式案内を開く</a></details></div></section>
<section class="panel" id="confirmFlow"><h2 class="step-title">3　更新を確認</h2><div class="steps"><button id="verify" class="btn green" type="button">更新されたか確認する</button></div><div id="verifyResult" class="result" role="status" aria-live="polite">未確認｜上のボタンで現在の起動版を確認します。</div><p class="mini" id="versionLine"></p></section><div id="fallback" class="fallback" role="status"></div></section></main><script>
const NOTICE_KEY='mumei-notification-tool-version',PENDING='mumei-direct-install-pending',q=new URLSearchParams(location.search),install=document.getElementById('install'),verify=document.getElementById('verify'),result=document.getElementById('verifyResult'),fallback=document.getElementById('fallback');let release={notificationVersion:'3.2.6'};
function norm(v){const m=String(v||'').match(/@?([A-Za-z0-9_-]+)/);return m?m[1].toLowerCase():''}const expected=norm(q.get('account'));function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./',location.href).href}catch{return new URL('./',location.href).href}}const back=safeReturn(q.get('return'));document.getElementById('back').href=back;
const UA=navigator.userAgent||'',platform=navigator.platform||'',isIOS=/iPhone|iPad|iPod/i.test(UA)||(platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPR|Android/i.test(UA),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isMac=!isIOS&&/Macintosh/i.test(UA);
function env(){if(isIOS)return isSafari?'ios-safari':'ios-other';if(isAndroid)return isEdge?'android-edge':isFirefox?'android-firefox':'android-other';if(isMac&&isSafari)return'mac-safari';return isEdge?'pc-edge':isFirefox?'pc-firefox':'pc-chrome'}
const names={'android-edge':'Android の Edge','android-firefox':'Android の Firefox','android-other':'Android の Chrome・その他','ios-safari':'iPhone・iPad の Safari','ios-other':'iPhone・iPad の Safari以外','mac-safari':'Mac の Safari','pc-edge':'パソコンの Edge','pc-chrome':'パソコンの Chrome','pc-firefox':'パソコンの Firefox'};let selected=Object.hasOwn(names,q.get('browser'))?q.get('browser'):env();
function script(){return new URL('./note-insight-notification-v3.user.js',location.href).href}function isSwitch(){return selected==='android-other'||selected==='ios-other'}
function recovery(k){if(k==='ios-safari'||k==='mac-safari')return'Userscriptsを開き、INSIGHTスクリプトを更新してください。URL貼り付け操作は不要です。';if(k.includes('firefox'))return'Firefoxの拡張機能からTampermonkeyを開き、「ユーザースクリプトの更新を確認」を実行してください。';return'Edgeの「≡」→ 拡張機能 → Tampermonkeyを開き、「ユーザースクリプトの更新を確認」を実行してください。URL貼り付け操作は不要です。'}
function paintInstall(){const k=selected,blocked=isSwitch(),safari=k==='ios-safari'||k==='mac-safari';document.querySelectorAll('[data-browser]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.browser===k)));document.getElementById('detected').textContent='自動判定：'+names[env()]+'。違う場合だけ変更してください。';document.getElementById('device').textContent='2　'+names[k]+'で'+(blocked?'開き直す':'インストール / 更新');document.getElementById('tip').textContent=blocked?(k==='ios-other'?'Safariでこのページを開いてください。':'Tampermonkeyが使えるEdgeまたはFirefoxで、このページを開いてください。'):safari?'Userscriptsを使っている場合、下のボタンを開いて更新を確定してください。':'下のボタンを押し、Tampermonkey画面で「更新」（初回は「インストール」）を押してください。';document.getElementById('switchBrowser').hidden=!blocked;document.getElementById('updateFlow').hidden=blocked;document.getElementById('confirmFlow').hidden=blocked;install.href=script();install.target='_blank';install.rel='noopener';install.removeAttribute('download');install.toggleAttribute('aria-disabled',blocked);verify.disabled=blocked;document.getElementById('recoverySteps').textContent=recovery(k);document.getElementById('firstSteps').textContent=safari?'Safariの拡張機能「Userscripts」を準備してください。':'Tampermonkeyが入っていない場合だけ、公式案内から準備してください。';document.getElementById('extensionGuide').href=safari?'https://apps.apple.com/app/userscripts/id1463298887':'https://www.tampermonkey.net/';const page=new URL(location.href);page.searchParams.delete('browser');document.getElementById('pageUrl').value=page.href}
function versionCheckUrl(){const u=new URL('https://note.com/');u.searchParams.set('mumei_insight_version_check','1');const ret=new URL('./tool-setup.html',location.href);if(expected)ret.searchParams.set('account',expected);ret.searchParams.set('return',back);ret.searchParams.set('browser',selected);u.searchParams.set('mumei_return',ret.href);return u.href}
function showResult(){const current=q.get('notificationInstalled')||localStorage.getItem(NOTICE_KEY)||'',checkedAt=Number(q.get('notificationCheckedAt')||0),fresh=Boolean(q.get('notificationInstalled'))&&checkedAt>0,latest=release.notificationVersion||'不明';document.getElementById('versionLine').textContent=`現在：${current?`V${current}`:'未確認'} ／ 最新：V${latest}`;result.className='result';if(fresh&&current===latest){result.classList.add('ok');result.textContent=`✅ 更新済み｜V${current} が起動しています`;localStorage.setItem(NOTICE_KEY,current);localStorage.removeItem(PENDING);fallback.classList.remove('show');return}if(fresh&&current&&current!==latest){result.classList.add('warn');result.textContent=`⚠ 未更新｜現在 V${current} → 最新 V${latest}`;fallback.textContent='Tampermonkeyで更新を確定してから、もう一度「更新されたか確認する」を押してください。';fallback.classList.add('show');return}if(q.get('notificationUpdateResult')&& !current){result.classList.add('bad');result.textContent='⚠ 確認失敗｜INSIGHTスクリプトが起動していません';return}if(current===latest){result.classList.add('warn');result.textContent=`前回記録 V${current}｜今回はまだ実働確認していません`;return}result.classList.add('warn');result.textContent=current?`更新確認が必要｜記録 V${current} → 最新 V${latest}`:'未確認｜「更新されたか確認する」を押してください'}
async function loadRelease(){try{const r=await fetch('./insight-release.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)release={...release,...await r.json()}}catch{}showResult()}
document.querySelectorAll('[data-browser]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.browser;const u=new URL(location.href);u.searchParams.set('browser',selected);history.replaceState(null,'',u.href);paintInstall()}));document.getElementById('copyPage').addEventListener('click',async()=>{const i=document.getElementById('pageUrl'),b=document.getElementById('copyPage');try{await navigator.clipboard.writeText(i.value);b.textContent='コピーしました'}catch{i.focus();i.select();b.textContent='URLを長押ししてコピー'}});install.addEventListener('click',e=>{if(install.getAttribute('aria-disabled')==='true'){e.preventDefault();return}localStorage.setItem(PENDING,JSON.stringify({at:Date.now(),url:script()}));result.className='result';result.textContent='更新画面を開きました。Tampermonkeyで「更新」を押したあと、このページに戻って確認してください。'});verify.addEventListener('click',()=>{result.className='result';result.textContent='確認中… noteで起動版を確認します。';location.assign(versionCheckUrl())});
paintInstall();void loadRelease();window.addEventListener('pageshow',showResult);window.addEventListener('focus',showResult);
</script></body></html>
