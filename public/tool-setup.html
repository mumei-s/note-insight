<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>INSIGHT 導入センター</title><style>*{box-sizing:border-box}body{margin:0;background:#061019;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(680px,calc(100% - 10px));margin:auto;padding:8px 0 28px}.back{display:inline-flex;min-height:38px;align-items:center;color:#79eaff;text-decoration:none;font-weight:950}.card{border:1px solid #31506a;border-radius:15px;background:#0a1722;padding:11px}h1{margin:3px 0 5px;font-size:23px}.lead{margin:0 0 8px;color:#a8c0d1;font-size:10.5px;line-height:1.55}.status{padding:9px;border:1px solid #3b5b72;border-radius:10px;background:#08131d;color:#c1ddea;font-size:10px;line-height:1.5}.ok{border-color:#3d7a5f!important;background:#0b1d16!important;color:#baffd6!important}.warn{border-color:#806730!important;background:#201807!important;color:#ffe2a0!important}.bad{border-color:#8e4343!important;background:#251010!important;color:#ffd0d0!important}.topstatus{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.tool{padding:8px;border:1px solid #334f64;border-radius:9px;background:#08151f;font-size:9px}.tool b{display:block;font-size:10px}.tool span{display:block;margin-top:2px;color:#91a9ba}.panels{display:grid;gap:7px;margin-top:8px}details{border:1px solid #2d465a;border-radius:11px;background:#07131c;overflow:hidden}summary{cursor:pointer;padding:10px;font-weight:950;font-size:11px;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'＋';float:right}.active>summary{color:#baffd6}.active[open]>summary::after{content:'−'}.body{padding:0 9px 9px;color:#a9bdcc;font-size:9.7px;line-height:1.6}.tip{margin-top:7px;padding:8px;border:1px solid #38546a;border-radius:8px;background:#08141e;color:#bfd1df}.steps{display:grid;gap:7px;margin-top:8px}.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #486b82;border-radius:9px;background:#10283a;color:#e9f8ff;text-decoration:none;font:950 10.5px/1.25 system-ui;text-align:center;padding:8px}.lime{background:#b6ff38;border-color:#b6ff38;color:#061016}.gold{background:#2a210b;border-color:#846e35;color:#ffe7a7}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.btn:disabled{opacity:.42}.mini{margin-top:6px;color:#7f95a7;font-size:8.6px}.fallback{display:none;margin-top:8px;padding:8px;border:1px solid #806730;border-radius:9px;background:#201807;color:#ffe2a0}.fallback.show{display:block}.fallback p{margin:0 0 6px;font-size:9px;line-height:1.5}@media(max-width:520px){.topstatus{grid-template-columns:1fr}.wrap{width:calc(100% - 8px)}}</style></head><body><main class="wrap"><a id="back" class="back">← INSIGHTへ戻る</a><section class="card"><small>ONE SETUP CENTER</small><h1>INSIGHT 導入センター</h1><p class="lead">Dashboard同期と本人通知はここから設定します。Android EdgeではTampermonkeyの中継ページを使わず、<b>.user.jsを直接開きます。</b></p><div id="account" class="status">INSIGHT認証を確認中…</div><div class="topstatus"><div id="dashState" class="tool"><b>📊 Dashboard同期</b><span>確認中…</span></div><div id="noticeState" class="tool"><b>🔔 本人通知</b><span>確認中…</span></div></div><div id="panels" class="panels"></div><div id="fallback" class="fallback"><p id="fallbackText"></p><button id="copyFallback" class="btn">インストールURLをコピー</button></div></section></main><script>
const API_D='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-dashboard-import-token',API_N='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',DASH_KEY='mumei-dashboard-tool-version',NOTICE_KEY='mumei-notification-tool-version',PENDING='mumei-direct-install-pending',RELOAD='mumei-direct-install-reload',q=new URLSearchParams(location.search),accountBox=document.getElementById('account'),dashState=document.getElementById('dashState'),noticeState=document.getElementById('noticeState'),panels=document.getElementById('panels'),fallback=document.getElementById('fallback'),fallbackText=document.getElementById('fallbackText'),copyFallback=document.getElementById('copyFallback');let release={dashboardVersion:'1.4.4',notificationVersion:'3.1.4'},who=null,busy=false,fallbackUrl='';
function norm(v){const m=String(v||'').match(/@?([A-Za-z0-9_-]+)/);return m?m[1].toLowerCase():''}const expected=norm(q.get('account'));function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./',location.href).href}catch{return new URL('./',location.href).href}}const back=safeReturn(q.get('return'));document.getElementById('back').href=back;
function headers(){const h={'Content-Type':'application/json'},o=localStorage.getItem(OWNER)||'',m=localStorage.getItem(MEMBER)||'';if(o)h['X-Owner-Token']=o;if(m)h['X-Insight-Token']=m;return h}function role(){if(expected)return expected==='ss_yr'?'owner':'member';if(localStorage.getItem(OWNER)&&!localStorage.getItem(MEMBER))return'owner';return'member'}async function api(url,action,extra={}){const r=await fetch(url,{method:'POST',headers:headers(),body:JSON.stringify({action,role:role(),...extra}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok||p?.ok===false)throw new Error(p?.error||'AUTH_FAILED');if(expected&&norm(p.noteId)&&norm(p.noteId)!==expected)throw new Error(`INSIGHT_ACCOUNT_MISMATCH：@${expected} / @${norm(p.noteId)}`);return p}
async function loadRelease(){try{const r=await fetch('./insight-release.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)release={...release,...await r.json()}}catch{}paint()}
function paint(){const d=localStorage.getItem(DASH_KEY)||'',n=localStorage.getItem(NOTICE_KEY)||'';dashState.className='tool '+(d===release.dashboardVersion?'ok':'warn');dashState.querySelector('span').textContent=d===release.dashboardVersion?`準備済み v${d}`:`${d||'未確認'} → v${release.dashboardVersion}`;noticeState.className='tool '+(n===release.notificationVersion?'ok':'warn');noticeState.querySelector('span').textContent=n===release.notificationVersion?`準備済み v${n}`:`${n||'未確認'} → v${release.notificationVersion}`}
const checked=q.get('notificationInstalled')||'';if(checked)localStorage.setItem(NOTICE_KEY,checked);
const UA=navigator.userAgent||'',platform=navigator.platform||'',isIOS=/iPhone|iPad|iPod/i.test(UA)||(platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPR|Android/i.test(UA),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isMac=!isIOS&&/Macintosh/i.test(UA);function env(){if(isIOS&&isSafari)return'ios-safari';if(isIOS)return'ios-other';if(isAndroid&&isEdge)return'android-edge';if(isAndroid&&isFirefox)return'android-firefox';if(isAndroid)return'android-other';if(isMac&&isSafari)return'mac-safari';return'pc'}
const names={'android-edge':'Android Edge','android-firefox':'Android Firefox','android-other':'Android Chrome / Yahoo','ios-safari':'iPhone / iPad Safari','ios-other':'iPhone / iPad Safari以外','mac-safari':'Mac Safari','pc':'PC Edge / Chrome / Firefox'},help={'android-edge':'Tampermonkey中継ページは使いません。Dashboard同期／本人通知の .user.js を直接開きます。','android-firefox':'Userscript拡張で .user.js を直接開きます。','android-other':'EdgeまたはFirefoxでこの画面を開いてください。','ios-safari':'Userscriptsの保存フォルダへ2本を保存します。','ios-other':'導入時だけSafariでこの画面を開いてください。','mac-safari':'Userscriptsの保存フォルダへ2本を保存します。','pc':'Tampermonkey等で .user.js を直接開きます。'};
function script(kind){return new URL(kind==='dash'?'./note-insight-dashboard-sync.user.js':'./note-insight-notification-v3.user.js',location.href).href}function controls(k){const bad=k==='android-other',file=['ios-safari','ios-other','mac-safari'].includes(k);const d=file?`<a class="btn lime" href="${script('dash')}" download="mumei-dashboard-sync.user.js" data-install="dash">Dashboard同期を保存／更新</a>`:`<a class="btn lime" href="${script('dash')}" target="_blank" rel="noopener" data-install="dash" ${bad?'aria-disabled="true"':''}>Dashboard同期を直接インストール／更新</a>`;const n=file?`<a class="btn gold" href="${script('notice')}" download="mumei-notification-v3.user.js" data-install="notice">本人通知を保存／更新</a>`:`<a class="btn gold" href="${script('notice')}" target="_blank" rel="noopener" data-install="notice" ${bad?'aria-disabled="true"':''}>本人通知を直接インストール／更新</a>`;return `<div class="tip">${help[k]}</div><div class="steps">${d}${n}<button class="btn green" data-action="dash" ${bad?'disabled':''}>Dashboardを認証して今すぐ読込</button><button class="btn" data-action="notice" ${bad?'disabled':''}>本人通知を実働確認／連携</button><a class="btn" href="https://note.com/">noteを開いて🔔通知へ</a></div><div class="mini">本人通知の版はnote側で実際に動いた結果を確認します。</div>`}
const current=env();panels.innerHTML=Object.keys(names).map(k=>`<details class="${k===current?'active':''}" ${k===current?'open':''}><summary>${names[k]}${k===current?'｜この端末':''}</summary><div class="body">${controls(k)}</div></details>`).join('');
async function auth(){accountBox.className='status';accountBox.textContent='INSIGHT認証を確認中…';const p=await api(API_D,'stats');who=p;accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜INSIGHT認証済み`;return p}
function savePending(kind){localStorage.setItem(PENDING,JSON.stringify({kind,at:Date.now(),back,url:script(kind)}));sessionStorage.removeItem(RELOAD);fallback.classList.remove('show');accountBox.className='status';accountBox.textContent=`${kind==='dash'?'Dashboard同期':'本人通知'}の直接インストール画面を開きました。完了後、このタブへ戻ってください。`}
function pending(){try{return JSON.parse(localStorage.getItem(PENDING)||'null')}catch{return null}}function clearPending(){localStorage.removeItem(PENDING);sessionStorage.removeItem(RELOAD)}
function showFallback(p){fallbackUrl=p?.url||'';fallbackText.textContent='直接インストールが完了していません。下のボタンでURLをコピーし、Tampermonkey Dashboard ＞ Utilities ＞ Import from URL に貼り付けてください。';fallback.classList.add('show');accountBox.className='status warn';accountBox.textContent='インストール未確認。自動再読込は停止しました。'}
copyFallback.onclick=async()=>{try{await navigator.clipboard.writeText(fallbackUrl);accountBox.className='status ok';accountBox.textContent='✅ インストールURLをコピーしました。'}catch{accountBox.className='status warn';accountBox.textContent=fallbackUrl||'コピーできませんでした'}};
function directReady(kind){if(kind==='dash'){return document.documentElement.getAttribute('data-mumei-dashboard-bridge')===release.dashboardVersion||localStorage.getItem(DASH_KEY)===release.dashboardVersion}return localStorage.getItem(NOTICE_KEY)===release.notificationVersion}
function versionCheckUrl(){const u=new URL('https://note.com/');u.searchParams.set('mumei_insight_version_check','1');const ret=new URL('./tool-setup.html',location.href);if(expected)ret.searchParams.set('account',expected);ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);return u.href}
function recover(){const p=pending();if(!p)return;if(directReady(p.kind)){clearPending();accountBox.className='status ok';accountBox.textContent=`✅ ${p.kind==='dash'?'Dashboard同期':'本人通知'} 更新確認。INSIGHTへ戻ります…`;paint();setTimeout(()=>location.replace(back),700);return}const age=Date.now()-Number(p.at||0);if(age<700)return;if(p.kind==='notice'&&sessionStorage.getItem(RELOAD)!=='notice-check'){sessionStorage.setItem(RELOAD,'notice-check');accountBox.className='status';accountBox.textContent='本人通知の実働バージョンをnote側で確認します…';location.assign(versionCheckUrl());return}if(p.kind==='dash'&&sessionStorage.getItem(RELOAD)!=='dash-reload'){sessionStorage.setItem(RELOAD,'dash-reload');setTimeout(()=>location.reload(),120);return}if(age>1700)showFallback(p)}
async function dash(){if(busy)return;busy=true;try{const p=who||await auth(),x=await api(API_D,'pair-start'),u=new URL('https://note.com/sitesettings/stats');u.searchParams.set('mumei_dashboard_pair',String(x.pairingCode||''));u.searchParams.set('mumei_dashboard_sync','1');u.searchParams.set('mumei_dashboard_account',norm(x.noteId||p.noteId));u.searchParams.set('mumei_dashboard_return',back);u.searchParams.set('mumei_dashboard_tool_version',release.dashboardVersion);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'Dashboard認証に失敗しました';busy=false}}
async function notice(){if(busy)return;busy=true;try{const p=await api(API_N,'stats');who=p;if(p.paired){accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜本人通知 連携済み。実働版を確認します…`;location.assign(versionCheckUrl());return}const x=await api(API_N,'pair-start'),u=new URL(x.noteUrl),ret=new URL('./tool-setup.html',location.href);ret.searchParams.set('account',norm(x.noteId));ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'本人通知連携に失敗しました';busy=false}}
panels.addEventListener('click',e=>{const a=e.target.closest('[data-install]');if(a){if(a.getAttribute('aria-disabled')==='true'){e.preventDefault();return}savePending(a.dataset.install);return}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='dash')void dash();else if(b.dataset.action==='notice')void notice()});
async function init(){await loadRelease();paint();try{await auth()}catch(e){accountBox.className='status warn';accountBox.textContent=(localStorage.getItem(OWNER)||localStorage.getItem(MEMBER))?(e.message||'INSIGHT認証を確認できませんでした'):'INSIGHTへ戻ってログインしてください'}recover()}
window.addEventListener('pageshow',()=>void init());window.addEventListener('focus',()=>{paint();recover()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){paint();recover()}});void init();
</script></body></html>
