<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>INSIGHT 導入センター</title><style>*{box-sizing:border-box}body{margin:0;background:#061019;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(680px,calc(100% - 12px));margin:auto;padding:8px 0 28px}.back{display:inline-flex;min-height:36px;align-items:center;color:#79eaff;text-decoration:none;font-weight:950}.card{border:1px solid #31506a;border-radius:15px;background:#0a1722;padding:10px}h1{margin:3px 0 5px;font-size:24px}.lead{margin:0 0 7px;color:#a8c0d1;font-size:10.5px;line-height:1.5}.status{padding:8px;border:1px solid #3b5b72;border-radius:10px;background:#08131d;color:#c1ddea;font-size:10px;line-height:1.45}.ok{border-color:#3d7a5f!important;background:#0b1d16!important;color:#baffd6!important}.warn{border-color:#806730!important;background:#201807!important;color:#ffe2a0!important}.panels{display:grid;gap:7px;margin-top:8px}details{border:1px solid #2d465a;border-radius:11px;background:#07131c;overflow:hidden}summary{cursor:pointer;padding:9px;font-weight:950;font-size:11px;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'＋';float:right}.active>summary{color:#baffd6}.active[open]>summary::after{content:'−'}.body{padding:0 8px 8px;color:#a9bdcc;font-size:9.5px;line-height:1.55}.steps{display:grid;gap:6px;margin-top:7px}.btn{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid #486b82;border-radius:9px;background:#10283a;color:#e9f8ff;text-decoration:none;font:950 10.5px/1.2 system-ui;text-align:center;padding:8px}.lime{background:#b6ff38;border-color:#b6ff38;color:#061016}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.gold{background:#2a210b;border-color:#846e35;color:#ffe7a7}.btn:disabled{opacity:.45}.mini{margin-top:5px;color:#7f95a7;font-size:8.5px}.topstatus{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.tool{padding:7px;border:1px solid #334f64;border-radius:9px;background:#08151f;font-size:9px}.tool b{display:block;font-size:10px}.tool span{display:block;margin-top:2px;color:#91a9ba}@media(max-width:520px){.topstatus{grid-template-columns:1fr}.wrap{width:calc(100% - 8px)}} </style></head><body><main class="wrap"><a id="back" class="back">← INSIGHTへ戻る</a><section class="card"><small>ONE SETUP CENTER</small><h1>INSIGHT 導入センター</h1><p class="lead">入口はここ1つだけ。使っているブラウザのパネルを開き、Dashboard同期と本人通知を同じ順番で設定します。</p><div id="account" class="status">INSIGHT認証を確認中…</div><div class="topstatus"><div id="dashState" class="tool"><b>📊 Dashboard同期</b><span>確認中…</span></div><div id="noticeState" class="tool"><b>🔔 本人通知</b><span>確認中…</span></div></div><div id="panels" class="panels"></div></section></main><script>
const API_D='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-dashboard-import-token',API_N='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',NOTICE_KEY='mumei-notification-tool-version',DASH_KEY='mumei-dashboard-tool-version',q=new URLSearchParams(location.search),accountBox=document.getElementById('account'),dashState=document.getElementById('dashState'),noticeState=document.getElementById('noticeState'),panels=document.getElementById('panels');let release={notificationVersion:'3.1.1',dashboardVersion:'1.4.4'},who=null,busy=false;
function norm(v){const m=String(v||'').match(/@?([A-Za-z0-9_-]+)/);return m?m[1].toLowerCase():''}const expected=norm(q.get('account'));function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./',location.href).href}catch{return new URL('./',location.href).href}}const back=safeReturn(q.get('return'));document.getElementById('back').href=back;
function authHeaders(){const h={'Content-Type':'application/json'},o=localStorage.getItem(OWNER)||'',m=localStorage.getItem(MEMBER)||'';if(o)h['X-Owner-Token']=o;if(m)h['X-Insight-Token']=m;return h}function preferred(){if(expected)return expected==='ss_yr'?'owner':'member';if(localStorage.getItem(OWNER)&&!localStorage.getItem(MEMBER))return'owner';return'member'}async function api(url,action,extra={}){const r=await fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify({action,role:preferred(),...extra}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok||p?.ok===false)throw new Error(p?.error||'AUTH_FAILED');if(expected&&norm(p.noteId)&&norm(p.noteId)!==expected)throw new Error(`INSIGHT_ACCOUNT_MISMATCH：@${expected} / @${norm(p.noteId)}`);return p}
async function loadRelease(){try{const r=await fetch('./insight-release.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)release={...release,...await r.json()}}catch{}paintState()}
function paintState(){const dv=localStorage.getItem(DASH_KEY)||'',nv=localStorage.getItem(NOTICE_KEY)||'';dashState.className='tool '+(dv===release.dashboardVersion?'ok':'warn');dashState.innerHTML=`<b>📊 Dashboard同期</b><span>${dv===release.dashboardVersion?'準備済み v'+dv:'最新版 v'+release.dashboardVersion}</span>`;noticeState.className='tool '+(nv===release.notificationVersion?'ok':'warn');noticeState.innerHTML=`<b>🔔 本人通知</b><span>${nv===release.notificationVersion?'準備済み v'+nv:'最新版 v'+release.notificationVersion}</span>`}
const UA=navigator.userAgent||'',platform=navigator.platform||'',isIOS=/iPhone|iPad|iPod/i.test(UA)||(platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPR|Android/i.test(UA),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isMac=!isIOS&&/Macintosh/i.test(UA),isMobileOther=isAndroid&&!isEdge&&!isFirefox;function envKey(){if(isIOS&&isSafari)return'ios-safari';if(isIOS)return'ios-other';if(isAndroid&&isEdge)return'android-edge';if(isAndroid&&isFirefox)return'android-firefox';if(isMobileOther)return'android-other';if(isMac&&isSafari)return'mac-safari';return'pc'}
const defs=[['android-edge','Android Edge','Tampermonkey等のUserscript拡張で2本を直接導入します。'],['android-firefox','Android Firefox','Userscript拡張で2本を直接導入します。'],['android-other','Android Chrome / Yahoo','このブラウザではUserscript導入が安定しません。同じURLをEdgeまたはFirefoxで開いてください。'],['ios-safari','iPhone / iPad Safari','Userscriptsへ保存した2ファイルを登録します。'],['ios-other','iPhone / iPad Safari以外','導入時だけSafariでこのページを開き、Userscriptsへ登録します。'],['mac-safari','Mac Safari','Userscriptsへ保存した2ファイルを登録します。'],['pc','PC Edge / Chrome / Firefox','Tampermonkey等のUserscript拡張で2本を直接導入します。']];
function steps(key){const fileMode=['ios-safari','ios-other','mac-safari'].includes(key),blocked=key==='android-other';return `<div class="steps"><button class="btn ${blocked?'':'lime'}" data-action="dash-install" ${blocked?'disabled':''}>1. Dashboard同期を${fileMode?'保存':'インストール／更新'}</button><button class="btn ${blocked?'':'gold'}" data-action="notice-install" ${blocked?'disabled':''}>2. 本人通知を${fileMode?'保存':'インストール／更新'}</button><button class="btn green" data-action="auth">3. INSIGHT認証を確認</button><button class="btn" data-action="dash-read">4. Dashboardを認証して読み込む</button><button class="btn" data-action="notice-pair">5. 本人通知を確認／連携</button><a class="btn" href="https://note.com/">6. noteを開いて🔔通知へ</a></div><div class="mini">Dashboardと本人通知は別々に動きます。Dashboard認証は本人通知未導入でも実行できます。</div>`}
const current=envKey();panels.innerHTML=defs.map(([k,title,desc])=>`<details data-env="${k}" class="${k===current?'active':''}" ${k===current?'open':''}><summary>${title}${k===current?'｜この端末':''}</summary><div class="body">${desc}${steps(k)}</div></details>`).join('');
function scriptUrl(kind){const name=kind==='dash'?'note-insight-dashboard-sync.user.js':'note-insight-notification-v3.user.js',u=new URL('./'+name,location.href);u.searchParams.set('install',kind==='dash'?'1440':'3110');u.searchParams.set('ts',Date.now());return u.href}function saveFile(kind){const a=document.createElement('a');a.href=scriptUrl(kind);a.download=kind==='dash'?'mumei-note-insight-dashboard-sync.user.js':'mumei-note-insight-notification-v3.user.js';document.body.appendChild(a);a.click();a.remove()}
async function auth(){accountBox.className='status';accountBox.textContent='INSIGHT認証を確認中…';const p=await api(API_D,'stats');who=p;accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜INSIGHT認証済み`;return p}
async function dashRead(){if(busy)return;busy=true;try{const p=who||await auth(),x=await api(API_D,'pair-start'),u=new URL('https://note.com/sitesettings/stats');u.searchParams.set('mumei_dashboard_pair',String(x.pairingCode||''));u.searchParams.set('mumei_dashboard_sync','1');u.searchParams.set('mumei_dashboard_account',norm(x.noteId||p.noteId));u.searchParams.set('mumei_dashboard_return',back);u.searchParams.set('mumei_dashboard_tool_version',release.dashboardVersion);location.assign(u.href)}catch(e){accountBox.className='status warn';accountBox.textContent=e.message||'Dashboard認証に失敗しました';busy=false}}
async function noticePair(){if(busy)return;busy=true;try{const p=await api(API_N,'stats');who=p;if(p.paired){accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜本人通知 連携済み`;busy=false;return}const x=await api(API_N,'pair-start'),u=new URL(x.noteUrl),ret=new URL('./tool-setup.html',location.href);ret.searchParams.set('account',norm(x.noteId));ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);location.assign(u.href)}catch(e){accountBox.className='status warn';accountBox.textContent=e.message||'本人通知連携に失敗しました';busy=false}}
function install(kind){const file=['ios-safari','ios-other','mac-safari'].includes(current);if(file){saveFile(kind);accountBox.className='status ok';accountBox.textContent='ファイルを保存しました。Userscriptsへ登録後、このページへ戻ってください。';return}location.assign(scriptUrl(kind))}
panels.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='dash-install')install('dash');else if(a==='notice-install')install('notice');else if(a==='auth')void auth().catch(err=>{accountBox.className='status warn';accountBox.textContent=err.message||'認証できませんでした'});else if(a==='dash-read')void dashRead();else if(a==='notice-pair')void noticePair()});
async function init(){await loadRelease();try{await auth()}catch(e){accountBox.className='status warn';accountBox.textContent=(localStorage.getItem(OWNER)||localStorage.getItem(MEMBER))?(e.message||'INSIGHT認証を確認できませんでした'):'INSIGHTへ戻ってログインしてください'}paintState()}window.addEventListener('pageshow',()=>void init());window.addEventListener('focus',()=>{paintState()});void init();
</script></body></html>
