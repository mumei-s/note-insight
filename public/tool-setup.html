<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>INSIGHT 導入センター</title><style>*{box-sizing:border-box}body{margin:0;background:#061019;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(680px,calc(100% - 12px));margin:auto;padding:8px 0 28px}.back{display:inline-flex;min-height:38px;align-items:center;color:#79eaff;text-decoration:none;font-weight:950}.card{border:1px solid #31506a;border-radius:15px;background:#0a1722;padding:11px}h1{margin:3px 0 5px;font-size:23px}.lead{margin:0 0 8px;color:#a8c0d1;font-size:10.5px;line-height:1.55}.status{padding:9px;border:1px solid #3b5b72;border-radius:10px;background:#08131d;color:#c1ddea;font-size:10px;line-height:1.5}.ok{border-color:#3d7a5f!important;background:#0b1d16!important;color:#baffd6!important}.warn{border-color:#806730!important;background:#201807!important;color:#ffe2a0!important}.bad{border-color:#8e4343!important;background:#251010!important;color:#ffd0d0!important}.panels{display:grid;gap:7px;margin-top:8px}details{border:1px solid #2d465a;border-radius:11px;background:#07131c;overflow:hidden}summary{cursor:pointer;padding:10px;font-weight:950;font-size:11px;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'＋';float:right}.active>summary{color:#baffd6}.active[open]>summary::after{content:'−'}.body{padding:0 9px 9px;color:#a9bdcc;font-size:9.7px;line-height:1.6}.steps{display:grid;gap:7px;margin-top:8px}.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #486b82;border-radius:9px;background:#10283a;color:#e9f8ff;text-decoration:none;font:950 10.5px/1.25 system-ui;text-align:center;padding:8px}.lime{background:#b6ff38;border-color:#b6ff38;color:#061016}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.gold{background:#2a210b;border-color:#846e35;color:#ffe7a7}.btn:disabled{opacity:.42}.tip{margin-top:7px;padding:8px;border:1px solid #38546a;border-radius:8px;background:#08141e;color:#bfd1df}.mini{margin-top:6px;color:#7f95a7;font-size:8.6px}.topstatus{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.tool{padding:8px;border:1px solid #334f64;border-radius:9px;background:#08151f;font-size:9px}.tool b{display:block;font-size:10px}.tool span{display:block;margin-top:2px;color:#91a9ba}@media(max-width:520px){.topstatus{grid-template-columns:1fr}.wrap{width:calc(100% - 8px)}} </style></head><body><main class="wrap"><a id="back" class="back">← INSIGHTへ戻る</a><section class="card"><small>ONE SETUP CENTER</small><h1>INSIGHT 導入センター</h1><p class="lead">最初に実機で通っていた方式へ戻しました。Dashboard同期と本人通知は同じ画面から設定します。Bridgeは不要です。</p><div id="account" class="status">INSIGHT認証を確認中…</div><div class="topstatus"><div id="dashState" class="tool"><b>📊 Dashboard同期</b><span>確認中…</span></div><div id="noticeState" class="tool"><b>🔔 本人通知</b><span>確認中…</span></div></div><div id="panels" class="panels"></div></section></main><script>
const API_D='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-dashboard-import-token',API_N='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',DASH_KEY='mumei-dashboard-tool-version',NOTICE_KEY='mumei-notification-tool-version',DASH_PENDING='mumei-dashboard-install-pending-current',NOTICE_PENDING='mumei-notification-install-pending-current',q=new URLSearchParams(location.search),accountBox=document.getElementById('account'),dashState=document.getElementById('dashState'),noticeState=document.getElementById('noticeState'),panels=document.getElementById('panels');let release={dashboardVersion:'1.4.4',notificationVersion:'3.1.3'},who=null,busy=false,child=null,poll=0;
function norm(v){const m=String(v||'').match(/@?([A-Za-z0-9_-]+)/);return m?m[1].toLowerCase():''}const expected=norm(q.get('account'));function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./',location.href).href}catch{return new URL('./',location.href).href}}const back=safeReturn(q.get('return'));document.getElementById('back').href=back;
function authHeaders(){const h={'Content-Type':'application/json'},o=localStorage.getItem(OWNER)||'',m=localStorage.getItem(MEMBER)||'';if(o)h['X-Owner-Token']=o;if(m)h['X-Insight-Token']=m;return h}function preferred(){if(expected)return expected==='ss_yr'?'owner':'member';if(localStorage.getItem(OWNER)&&!localStorage.getItem(MEMBER))return'owner';return'member'}async function api(url,action,extra={}){const r=await fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify({action,role:preferred(),...extra}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok||p?.ok===false)throw new Error(p?.error||'AUTH_FAILED');if(expected&&norm(p.noteId)&&norm(p.noteId)!==expected)throw new Error(`INSIGHT_ACCOUNT_MISMATCH：@${expected} / @${norm(p.noteId)}`);return p}
async function loadRelease(){try{const r=await fetch('./insight-release.json?ts='+Date.now(),{cache:'no-store'});if(r.ok)release={...release,...await r.json()}}catch{}paintState()}
function paintState(){const d=localStorage.getItem(DASH_KEY)||'',n=localStorage.getItem(NOTICE_KEY)||'';dashState.className='tool '+(d===release.dashboardVersion?'ok':'warn');dashState.querySelector('span').textContent=d===release.dashboardVersion?`準備済み v${d}`:`${d||'未確認'} → v${release.dashboardVersion}`;noticeState.className='tool '+(n===release.notificationVersion?'ok':'warn');noticeState.querySelector('span').textContent=n===release.notificationVersion?`準備済み v${n}`:`${n||'未確認'} → v${release.notificationVersion}`}
const checked=q.get('notificationInstalled')||'';if(checked)localStorage.setItem(NOTICE_KEY,checked);
const UA=navigator.userAgent||'',platform=navigator.platform||'',isIOS=/iPhone|iPad|iPod/i.test(UA)||(platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPR|Android/i.test(UA),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isMac=!isIOS&&/Macintosh/i.test(UA);function envKey(){if(isIOS&&isSafari)return'ios-safari';if(isIOS)return'ios-other';if(isAndroid&&isEdge)return'android-edge';if(isAndroid&&isFirefox)return'android-firefox';if(isAndroid)return'android-other';if(isMac&&isSafari)return'mac-safari';return'pc'}
const names={'android-edge':'Android Edge','android-firefox':'Android Firefox','android-other':'Android Chrome / Yahoo','ios-safari':'iPhone / iPad Safari','ios-other':'iPhone / iPad Safari以外','mac-safari':'Mac Safari','pc':'PC Edge / Chrome / Firefox'};
const help={'android-edge':'Tampermonkeyを有効にした状態で使います。インストール画面はボタンを押した時だけ開き、完了後はこの画面へ戻って自動確認します。','android-firefox':'Userscript拡張を有効にした状態で使います。完了後はこの画面へ戻って自動確認します。','android-other':'Android Chrome / YahooではUserscript導入が安定しません。EdgeまたはFirefoxでこの画面を開いてください。','ios-safari':'SafariのUserscripts拡張からDashboard同期・本人通知を保存／更新します。','ios-other':'導入時だけSafariでこの画面を開いてください。','mac-safari':'SafariのUserscripts拡張からDashboard同期・本人通知を保存／更新します。','pc':'Tampermonkey等のUserscript拡張を有効にした状態で使います。'};
function raw(kind){return kind==='dash'?'https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-dashboard-sync.user.js':'https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-notification-v3.user.js'}function installer(kind){return'https://www.tampermonkey.net/script_installation.php#url='+raw(kind)}function localScript(kind){return new URL(kind==='dash'?'./note-insight-dashboard-sync.user.js':'./note-insight-notification-v3.user.js',location.href).href}
function controls(k){const unsupported=k==='android-other',fileMode=['ios-safari','ios-other','mac-safari'].includes(k);const dashInstall=fileMode?`<a class="btn lime" href="${localScript('dash')}" download="mumei-dashboard-sync.user.js" data-install="dash">Dashboard同期を保存／更新</a>`:`<button class="btn lime" data-install="dash" ${unsupported?'disabled':''}>Dashboard同期をインストール／更新</button>`;const noticeInstall=fileMode?`<a class="btn gold" href="${localScript('notice')}" download="mumei-notification-v3.user.js" data-install="notice">本人通知を保存／更新</a>`:`<button class="btn gold" data-install="notice" ${unsupported?'disabled':''}>本人通知をインストール／更新</button>`;return `<div class="tip">${help[k]}</div><div class="steps">${dashInstall}${noticeInstall}<button class="btn green" data-action="dash" ${unsupported?'disabled':''}>Dashboardを認証して今すぐ読込</button><button class="btn" data-action="notice" ${unsupported?'disabled':''}>本人通知を確認／連携</button><a class="btn" href="https://note.com/">noteを開いて🔔通知へ</a></div><div class="mini">Bridgeは使いません。Dashboard同期と本人通知はそれぞれ実働確認します。</div>`}
const current=envKey();panels.innerHTML=Object.keys(names).map(k=>`<details class="${k===current?'active':''}" ${k===current?'open':''}><summary>${names[k]}${k===current?'｜この端末':''}</summary><div class="body">${controls(k)}</div></details>`).join('');
async function auth(){accountBox.className='status';accountBox.textContent='INSIGHT認証を確認中…';const p=await api(API_D,'stats');who=p;accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜INSIGHT認証済み`;return p}
function savePending(kind){localStorage.setItem(kind==='dash'?DASH_PENDING:NOTICE_PENDING,JSON.stringify({at:Date.now(),back}));accountBox.className='status';accountBox.textContent=`${kind==='dash'?'Dashboard同期':'本人通知'}をインストール／更新中… 完了後に自動確認します。`}
function clearPending(kind){localStorage.removeItem(kind==='dash'?DASH_PENDING:NOTICE_PENDING)}function pending(kind){try{return JSON.parse(localStorage.getItem(kind==='dash'?DASH_PENDING:NOTICE_PENDING)||'null')}catch{return null}}
function openInstaller(kind){savePending(kind);child=window.open(installer(kind),'_blank');if(child){clearInterval(poll);poll=setInterval(()=>{try{if(child.closed){clearInterval(poll);setTimeout(()=>verify(kind,true),250)}}catch{}},600)}else{location.href=installer(kind)}}
function verify(kind,force=false){const p=pending(kind);if(!p)return;if(!force&&Date.now()-Number(p.at||0)<1200)return;if(kind==='notice'){clearPending(kind);const u=new URL('https://note.com/');u.searchParams.set('mumei_insight_version_check','1');const ret=new URL('./tool-setup.html',location.href);if(expected)ret.searchParams.set('account',expected);ret.searchParams.set('return',back);ret.searchParams.set('notificationVerify','1');u.searchParams.set('mumei_return',ret.href);location.href=u.href;return}location.reload()}
async function dash(){if(busy)return;busy=true;try{const p=who||await auth(),x=await api(API_D,'pair-start'),u=new URL('https://note.com/sitesettings/stats');u.searchParams.set('mumei_dashboard_pair',String(x.pairingCode||''));u.searchParams.set('mumei_dashboard_sync','1');u.searchParams.set('mumei_dashboard_account',norm(x.noteId||p.noteId));u.searchParams.set('mumei_dashboard_return',back);u.searchParams.set('mumei_dashboard_tool_version',release.dashboardVersion);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'Dashboard認証に失敗しました';busy=false}}
async function notice(){if(busy)return;busy=true;try{const p=await api(API_N,'stats');who=p;if(p.paired){accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜本人通知 連携済み`;setTimeout(()=>location.assign('https://note.com/'),450);return}const x=await api(API_N,'pair-start'),u=new URL(x.noteUrl),ret=new URL('./tool-setup.html',location.href);ret.searchParams.set('account',norm(x.noteId));ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'本人通知連携に失敗しました';busy=false}}
panels.addEventListener('click',e=>{const el=e.target.closest('[data-install]');if(el){const kind=el.dataset.install;if(el.tagName==='BUTTON'){e.preventDefault();openInstaller(kind)}else savePending(kind);return}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='dash')void dash();else if(b.dataset.action==='notice')void notice()});
function recoverPending(){const d=pending('dash'),n=pending('notice');if(d){const installed=localStorage.getItem(DASH_KEY)||document.documentElement.getAttribute('data-mumei-dashboard-bridge')||'';if(installed===release.dashboardVersion){clearPending('dash');localStorage.setItem(DASH_KEY,release.dashboardVersion);accountBox.className='status ok';accountBox.textContent=`✅ Dashboard同期 v${release.dashboardVersion} 更新完了。INSIGHTへ戻ります…`;paintState();setTimeout(()=>location.replace(back),800);return}verify('dash',false);return}if(n)verify('notice',false)}
async function init(){await loadRelease();paintState();try{await auth()}catch(e){accountBox.className='status warn';accountBox.textContent=(localStorage.getItem(OWNER)||localStorage.getItem(MEMBER))?(e.message||'INSIGHT認証を確認できませんでした'):'INSIGHTへ戻ってログインしてください'}if(checked===release.notificationVersion||q.get('notificationVerify')==='1'&&localStorage.getItem(NOTICE_KEY)===release.notificationVersion){clearPending('notice');accountBox.className='status ok';accountBox.textContent=`✅ 本人通知 v${release.notificationVersion} 更新完了。INSIGHTへ戻ります…`;paintState();setTimeout(()=>location.replace(back),800);return}recoverPending()}
window.addEventListener('focus',()=>setTimeout(()=>{paintState();recoverPending()},500));window.addEventListener('pageshow',()=>setTimeout(()=>void init(),20));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(()=>{paintState();recoverPending()},500)});void init();
</script></body></html>
