<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>INSIGHT 導入センター</title><style>*{box-sizing:border-box}body{margin:0;background:#061019;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(680px,calc(100% - 12px));margin:auto;padding:8px 0 28px}.back{display:inline-flex;min-height:38px;align-items:center;color:#79eaff;text-decoration:none;font-weight:950}.card{border:1px solid #31506a;border-radius:15px;background:#0a1722;padding:11px}h1{margin:3px 0 5px;font-size:23px}.lead{margin:0 0 8px;color:#a8c0d1;font-size:10.5px;line-height:1.55}.status{padding:9px;border:1px solid #3b5b72;border-radius:10px;background:#08131d;color:#c1ddea;font-size:10px;line-height:1.5}.ok{border-color:#3d7a5f!important;background:#0b1d16!important;color:#baffd6!important}.warn{border-color:#806730!important;background:#201807!important;color:#ffe2a0!important}.bad{border-color:#8e4343!important;background:#251010!important;color:#ffd0d0!important}.panels{display:grid;gap:7px;margin-top:8px}details{border:1px solid #2d465a;border-radius:11px;background:#07131c;overflow:hidden}summary{cursor:pointer;padding:10px;font-weight:950;font-size:11px;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'＋';float:right}.active>summary{color:#baffd6}.active[open]>summary::after{content:'−'}.body{padding:0 9px 9px;color:#a9bdcc;font-size:9.7px;line-height:1.6}.steps{display:grid;gap:7px;margin-top:8px}.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #486b82;border-radius:9px;background:#10283a;color:#e9f8ff;text-decoration:none;font:950 10.5px/1.25 system-ui;text-align:center;padding:8px}.lime{background:#b6ff38;border-color:#b6ff38;color:#061016}.green{background:#123124;border-color:#5bc68b;color:#dcffea}.gold{background:#2a210b;border-color:#846e35;color:#ffe7a7}.btn:disabled{opacity:.42}.tip{margin-top:7px;padding:8px;border:1px solid #5a4c28;border-radius:8px;background:#171207;color:#ffe4a6}.mini{margin-top:6px;color:#7f95a7;font-size:8.6px}.topstatus{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.tool{padding:8px;border:1px solid #334f64;border-radius:9px;background:#08151f;font-size:9px}.tool b{display:block;font-size:10px}.tool span{display:block;margin-top:2px;color:#91a9ba}.hide{display:none!important}@media(max-width:520px){.topstatus{grid-template-columns:1fr}.wrap{width:calc(100% - 8px)}} </style></head><body><main class="wrap"><a id="back" class="back">← INSIGHTへ戻る</a><section class="card"><small>ONE BRIDGE SETUP</small><h1>INSIGHT 導入センター</h1><p class="lead">本人通知と公式Dashboard同期は、これから <b>INSIGHT Bridge 1本</b> で動かします。生のスクリプト文字列ページへは移動しません。</p><div id="bridge" class="status">Bridge実動作を確認中…</div><div id="account" class="status" style="margin-top:6px">INSIGHT認証を確認中…</div><div class="topstatus"><div id="dashState" class="tool"><b>📊 Dashboard</b><span>Bridge待機中</span></div><div id="noticeState" class="tool"><b>🔔 本人通知</b><span>Bridge待機中</span></div></div><div id="panels" class="panels"></div></section></main><script>
const API_D='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-dashboard-import-token',API_N='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token',MEMBER='mumei-insight-access-token',BRIDGE_KEY='mumei-insight-bridge-version',BRIDGE='1.0.0',PENDING='mumei-insight-bridge-install-pending',RELOADED='mumei-insight-bridge-install-reloaded',q=new URLSearchParams(location.search),bridgeBox=document.getElementById('bridge'),accountBox=document.getElementById('account'),dashState=document.getElementById('dashState'),noticeState=document.getElementById('noticeState'),panels=document.getElementById('panels');let who=null,busy=false;
function norm(v){const m=String(v||'').match(/@?([A-Za-z0-9_-]+)/);return m?m[1].toLowerCase():''}const expected=norm(q.get('account'));function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./',location.href).href}catch{return new URL('./',location.href).href}}const back=safeReturn(q.get('return'));document.getElementById('back').href=back;
function authHeaders(){const h={'Content-Type':'application/json'},o=localStorage.getItem(OWNER)||'',m=localStorage.getItem(MEMBER)||'';if(o)h['X-Owner-Token']=o;if(m)h['X-Insight-Token']=m;return h}function preferred(){if(expected)return expected==='ss_yr'?'owner':'member';if(localStorage.getItem(OWNER)&&!localStorage.getItem(MEMBER))return'owner';return'member'}async function api(url,action,extra={}){const r=await fetch(url,{method:'POST',headers:authHeaders(),body:JSON.stringify({action,role:preferred(),...extra}),cache:'no-store'}),p=await r.json().catch(()=>({}));if(!r.ok||p?.ok===false)throw new Error(p?.error||'AUTH_FAILED');if(expected&&norm(p.noteId)&&norm(p.noteId)!==expected)throw new Error(`INSIGHT_ACCOUNT_MISMATCH：@${expected} / @${norm(p.noteId)}`);return p}
function bridgeReady(){return localStorage.getItem(BRIDGE_KEY)===BRIDGE||document.documentElement.getAttribute('data-mumei-insight-bridge')===BRIDGE}
function paint(){const ok=bridgeReady();bridgeBox.className='status '+(ok?'ok':'bad');bridgeBox.textContent=ok?`✅ INSIGHT Bridge v${BRIDGE} 実行中`:`⚠ INSIGHT Bridgeが実行されていません。インストール未完了／Tampermonkey停止／ユーザースクリプト許可OFFのいずれかです。`;for(const x of[dashState,noticeState])x.className='tool '+(ok?'ok':'warn');dashState.querySelector('span').textContent=ok?'Bridge接続済み':'Bridgeが動くまで読込不可';noticeState.querySelector('span').textContent=ok?'Bridge接続済み':'Bridgeが動くまで通知パネル不可'}
const UA=navigator.userAgent||'',platform=navigator.platform||'',isIOS=/iPhone|iPad|iPod/i.test(UA)||(platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=/Safari/i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPR|Android/i.test(UA),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isMac=!isIOS&&/Macintosh/i.test(UA);function envKey(){if(isIOS&&isSafari)return'ios-safari';if(isIOS)return'ios-other';if(isAndroid&&isEdge)return'android-edge';if(isAndroid&&isFirefox)return'android-firefox';if(isAndroid)return'android-other';if(isMac&&isSafari)return'mac-safari';return'pc'}
const help={
'android-edge':'Tampermonkey 5.5以降のEdge Androidでは、Tampermonkeyを有効にしただけでは足りません。Edgeの拡張機能設定で「ユーザースクリプトを許可」をON。項目が無い場合は edge://extensions の開発者モードをONにしてください。',
'android-firefox':'Firefox側でUserscript拡張を有効化し、note.com と mumei-s.github.io への実行権限を許可してください。',
'android-other':'Android Chrome / YahooではUserscript拡張の実行が安定しません。INSIGHT利用時はEdgeまたはFirefoxでこの画面を開いてください。',
'ios-safari':'SafariのUserscripts拡張をONにし、note.com と mumei-s.github.io を許可してください。',
'ios-other':'導入時だけSafariでこの画面を開き、Userscripts拡張を有効にしてください。',
'mac-safari':'SafariのUserscripts拡張をONにし、対象サイトへのアクセスを許可してください。',
'pc':'Chrome / EdgeのTampermonkey 5.5以降は「ユーザースクリプトを許可」が必要です。拡張機能の管理画面でONにしてください。FirefoxはTampermonkeyのサイト権限を確認してください。'};
const names={'android-edge':'Android Edge','android-firefox':'Android Firefox','android-other':'Android Chrome / Yahoo','ios-safari':'iPhone / iPad Safari','ios-other':'iPhone / iPad Safari以外','mac-safari':'Mac Safari','pc':'PC Edge / Chrome / Firefox'};
function bridgeUrl(){const u=new URL('./note-insight-bridge.user.js',location.href);u.searchParams.set('ts',Date.now());return u.href}function installUrl(){return'https://www.tampermonkey.net/script_installation.php#url='+encodeURIComponent(bridgeUrl())}
function controls(k){const unsupported=k==='android-other',fileMode=['ios-safari','ios-other','mac-safari'].includes(k);const install=fileMode?`<a class="btn lime" href="${bridgeUrl()}" download="mumei-insight-bridge.user.js" data-install="1">INSIGHT Bridgeを保存／更新</a>`:`<a class="btn lime" href="${installUrl()}" target="_blank" rel="noopener" data-install="1">INSIGHT Bridgeをインストール／更新</a>`;return `<div class="tip">${help[k]}</div><div class="steps">${unsupported?'<div class="btn" style="opacity:.55">Edge / Firefoxで開いてください</div>':install}<button class="btn green" data-action="check">Bridge実動作を再確認</button><button class="btn" data-action="dash" ${unsupported?'disabled':''}>Dashboardを認証して自動読込</button><button class="btn" data-action="notice" ${unsupported?'disabled':''}>本人通知を確認／連携</button><a class="btn" href="https://note.com/">noteを開いて🔔通知へ</a></div><div class="mini">インストール後はこの画面へ戻るだけ。Bridgeを検出したらINSIGHTへ自動復帰します。</div>`}
const current=envKey();panels.innerHTML=Object.keys(names).map(k=>`<details class="${k===current?'active':''}" ${k===current?'open':''}><summary>${names[k]}${k===current?'｜この端末':''}</summary><div class="body">${controls(k)}</div></details>`).join('');
async function auth(){accountBox.className='status';accountBox.textContent='INSIGHT認証を確認中…';const p=await api(API_D,'stats');who=p;accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜INSIGHT認証済み`;return p}
async function dash(){if(busy)return;if(!bridgeReady()){bridgeBox.className='status bad';bridgeBox.textContent='⚠ Bridgeが実行されていないためDashboardは開始しません。上の権限とBridgeを確認してください。';return}busy=true;try{const p=who||await auth(),x=await api(API_D,'pair-start'),u=new URL('https://note.com/sitesettings/stats');u.searchParams.set('mumei_dashboard_pair',String(x.pairingCode||''));u.searchParams.set('mumei_dashboard_sync','1');u.searchParams.set('mumei_dashboard_account',norm(x.noteId||p.noteId));u.searchParams.set('mumei_dashboard_return',back);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'Dashboard認証に失敗しました';busy=false}}
async function notice(){if(busy)return;if(!bridgeReady()){bridgeBox.className='status bad';bridgeBox.textContent='⚠ Bridgeが実行されていないため本人通知は開始しません。上の権限とBridgeを確認してください。';return}busy=true;try{const p=await api(API_N,'stats');who=p;if(p.paired){accountBox.className='status ok';accountBox.textContent=`✅ @${norm(p.noteId)}｜本人通知 連携済み`;setTimeout(()=>location.assign('https://note.com/'),500);return}const x=await api(API_N,'pair-start'),u=new URL(x.noteUrl),ret=new URL('./tool-setup.html',location.href);ret.searchParams.set('account',norm(x.noteId));ret.searchParams.set('return',back);u.searchParams.set('mumei_return',ret.href);location.assign(u.href)}catch(e){accountBox.className='status bad';accountBox.textContent=e.message||'本人通知連携に失敗しました';busy=false}}
function markPending(){sessionStorage.setItem(PENDING,String(Date.now()));sessionStorage.removeItem(RELOADED);bridgeBox.className='status warn';bridgeBox.textContent='Tampermonkeyのインストール画面でインストール／更新してください。完了後、このタブへ戻れば自動確認します。'}
panels.addEventListener('click',e=>{const a=e.target.closest('[data-install]');if(a){markPending();return}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='check'){paint();if(bridgeReady()){sessionStorage.removeItem(PENDING);sessionStorage.removeItem(RELOADED);bridgeBox.textContent=`✅ INSIGHT Bridge v${BRIDGE} 実行中`}}else if(b.dataset.action==='dash')void dash();else if(b.dataset.action==='notice')void notice()});
function returnIfInstalled(){const t=Number(sessionStorage.getItem(PENDING)||0);if(!t||Date.now()-t>10*60*1000)return;if(bridgeReady()){sessionStorage.removeItem(PENDING);sessionStorage.removeItem(RELOADED);bridgeBox.className='status ok';bridgeBox.textContent=`✅ Bridge v${BRIDGE} を確認。INSIGHTへ戻ります…`;setTimeout(()=>location.replace(back),700);return}if(document.visibilityState==='visible'&&sessionStorage.getItem(RELOADED)!=='1'){sessionStorage.setItem(RELOADED,'1');setTimeout(()=>location.reload(),350)}}
async function init(){paint();try{await auth()}catch(e){accountBox.className='status warn';accountBox.textContent=(localStorage.getItem(OWNER)||localStorage.getItem(MEMBER))?(e.message||'INSIGHT認証を確認できませんでした'):'INSIGHTへ戻ってログインしてください'}returnIfInstalled()}
window.addEventListener('pageshow',()=>void init());window.addEventListener('focus',()=>{paint();returnIfInstalled()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){paint();returnIfInstalled()}});void init();
</script></body></html>
