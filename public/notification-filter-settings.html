<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>通知フィルター設定</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07111a;color:#eef8ff}
*{box-sizing:border-box}body{margin:0;background:#07111a;color:#eef8ff}
.wrap{max-width:720px;margin:0 auto;padding:10px 10px calc(22px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:#07111af2;padding:5px 0 8px}
.back{width:100%;height:42px;border:1px solid #466b82;border-radius:11px;background:#102838;color:#e5f9ff;font-weight:900;font-size:14px}
h1{font-size:22px;margin:12px 2px 3px}.sub{margin:0 2px 8px;color:#91a9b8;font-size:11px;line-height:1.45}
.status{min-height:30px;border:1px solid #315266;border-radius:8px;background:#0c1b27;padding:6px 9px;margin-bottom:8px;font-size:11px;display:flex;align-items:center}
.status.ok{border-color:#3f7c5b;color:#d9ffe7}.status.err{border-color:#8d4853;color:#ffd8dd}.status.hide{display:none}
.groups{display:grid;gap:7px}.group{border:1px solid #315166;border-radius:11px;background:#0b1924;overflow:hidden}
.summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:8px 9px;min-height:46px}
.switch{display:flex;align-items:center;font-weight:900}.gtitle{min-width:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:10px;color:#9cb2c0;white-space:nowrap}.chev{width:30px;height:30px;border:1px solid #3a6076;border-radius:8px;background:#102737;color:#e7f8ff;font-weight:900}
.body{display:none;border-top:1px solid #244455;padding:8px}.group.open .body{display:block}
.manage{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px}.manage input,.add input{width:100%;height:34px;border:1px solid #3e6076;border-radius:8px;background:#07141e;color:#fff;padding:0 8px;font-size:12px}
button{border:1px solid #466b82;border-radius:8px;background:#112b3b;color:#e7f8ff;font-weight:900}
.del{height:34px;border-color:#7e4350;background:#301820;color:#ffd9df}
.members{display:grid;gap:5px;margin-top:7px}.member{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:6px;align-items:center;border:1px solid #264558;border-radius:9px;padding:5px;background:#081721}
.who{display:grid;grid-template-columns:32px minmax(0,1fr);gap:7px;align-items:center;min-width:0}.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#142734;border:1px solid #35586f}
.name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.id{font-size:9.5px;color:#9eb3c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px;margin-top:7px}.add button{height:34px}
.footer{margin-top:8px}.footer button{width:100%;height:38px}.empty{padding:10px;text-align:center;color:#93aab9;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="back" id="back">← noteの🔔通知へ戻る</button></div>
  <h1>通知フィルター設定</h1>
  <p class="sub">グループをタップした時だけ中身を開きます。保存は自動です。</p>
  <div class="status" id="status">設定を読み込んでいます…</div>
  <div class="groups" id="groups"></div>
  <div class="footer"><button id="addGroup">＋ グループ追加</button></div>
</div>
<script>
(function(){
'use strict';
const NOTE='https://note.com/?mumei_filter_return=bell';
const PAGE='mumei-filter-page-v1',BRIDGE='mumei-filter-bridge-v1';
const q=new URLSearchParams(location.search),account=(q.get('notificationAccount')||'').replace(/^@/,'').toLowerCase();
const groupsEl=document.getElementById('groups'),statusEl=document.getElementById('status');
let groups=[],profiles={},loaded=false,saveTimer=0,statusTimer=0,returning=false,returnTimer=0;
const opened=new Set();

function returnToBell(){
  if(returning)return;
  returning=true;
  setStatus('🔔通知へ戻っています…');
  clearTimeout(returnTimer);
  returnTimer=setTimeout(()=>location.replace(NOTE),80)
}
history.replaceState({mumeiFilter:true},'',location.href);
history.pushState({mumeiFilterGuard:true},'',location.href);
addEventListener('popstate',returnToBell);
document.getElementById('back').onclick=returnToBell;

function clean(v){return String(v||'').replace(/\s+/g,' ').trim()}
function norm(raw){return(Array.isArray(raw)?raw:[]).map((g,i)=>({name:clean(g&&g.name)||('グループ '+(i+1)),enabled:g?.enabled!==false,ids:[...new Set((Array.isArray(g?.ids)?g.ids:[]).map(x=>clean(x).replace(/^@/,'').toLowerCase()).filter(x=>/^[a-z0-9_-]+$/.test(x)))]}))}
function setStatus(s,kind='',linger=1400){clearTimeout(statusTimer);statusEl.textContent=s;statusEl.className='status'+(kind?' '+kind:'');if(kind==='ok'&&linger)statusTimer=setTimeout(()=>statusEl.className='status hide',linger)}
function post(type,payload={}){window.postMessage({source:PAGE,type,account,...payload},location.origin)}
function parseId(v){const raw=clean(v);if(!raw)return'';try{const u=new URL(/^https?:\/\//i.test(raw)?raw:'https://note.com/'+raw.replace(/^@/,''));const id=(u.pathname.split('/').filter(Boolean)[0]||'').toLowerCase();return u.hostname==='note.com'&&/^[a-z0-9_-]+$/.test(id)?id:''}catch{return''}}
function queueSave(){clearTimeout(saveTimer);setStatus('保存中…');saveTimer=setTimeout(()=>post('save',{groups:norm(groups)}),120)}
function requestProfiles(ids){const list=[...new Set((ids||groups.flatMap(g=>g.ids)).filter(Boolean))];if(list.length)post('profiles',{ids:list})}

function memberNode(id,gi,mi){
  const info=profiles[id]||{nickname:'',profileImageUrl:''};
  const row=document.createElement('div');row.className='member';
  const who=document.createElement('div');who.className='who';
  const img=document.createElement('img');img.className='avatar';img.alt='';
  if(info.profileImageUrl)img.src=info.profileImageUrl;else img.style.visibility='hidden';
  const txt=document.createElement('div');
  const name=document.createElement('div');name.className='name';name.textContent=info.nickname||('@'+id);
  const uid=document.createElement('div');uid.className='id';uid.textContent='@'+id;
  txt.append(name,uid);who.append(img,txt);
  const del=document.createElement('button');del.className='del';del.textContent='削除';
  del.onclick=e=>{e.stopPropagation();groups[gi].ids.splice(mi,1);render();queueSave()};
  row.append(who,del);return row
}
function render(){
  groupsEl.innerHTML='';
  if(!groups.length){const e=document.createElement('div');e.className='empty';e.textContent='登録グループはありません';groupsEl.appendChild(e)}
  groups.forEach((g,gi)=>{
    const card=document.createElement('section');card.className='group'+(opened.has(gi)?' open':'');
    const summary=document.createElement('div');summary.className='summary';
    const on=document.createElement('label');on.className='switch';on.innerHTML='<input type="checkbox" '+(g.enabled?'checked':'')+'>';
    on.onclick=e=>e.stopPropagation();
    on.querySelector('input').onchange=e=>{g.enabled=e.target.checked;queueSave()};
    const title=document.createElement('div');title.className='gtitle';title.textContent=g.name;
    const count=document.createElement('div');count.className='count';count.textContent=g.ids.length+'人';
    const chev=document.createElement('button');chev.className='chev';chev.textContent=opened.has(gi)?'▲':'▼';
    const toggle=()=>{opened.has(gi)?opened.delete(gi):opened.add(gi);render();if(opened.has(gi))requestProfiles(g.ids)};
    title.onclick=toggle;count.onclick=toggle;chev.onclick=e=>{e.stopPropagation();toggle()};
    summary.append(on,title,count,chev);

    const body=document.createElement('div');body.className='body';
    const manage=document.createElement('div');manage.className='manage';
    const name=document.createElement('input');name.type='text';name.value=g.name;name.onchange=e=>{g.name=clean(e.target.value)||('グループ '+(gi+1));queueSave();render()};
    const delGroup=document.createElement('button');delGroup.className='del';delGroup.textContent='削除';delGroup.onclick=()=>{groups.splice(gi,1);const next=new Set();for(const x of opened)if(x<gi)next.add(x);else if(x>gi)next.add(x-1);opened.clear();for(const x of next)opened.add(x);render();queueSave()};
    manage.append(name,delGroup);

    const members=document.createElement('div');members.className='members';
    g.ids.forEach((id,mi)=>members.appendChild(memberNode(id,gi,mi)));
    const add=document.createElement('div');add.className='add';
    const inp=document.createElement('input');inp.placeholder='note URL / @ID / ID';
    const btn=document.createElement('button');btn.textContent='＋追加';
    const run=()=>{const id=parseId(inp.value);if(!id){setStatus('URL / @ID / IDを確認してください','err',0);return}if(!g.ids.includes(id))g.ids.push(id);inp.value='';opened.add(gi);render();queueSave();requestProfiles([id])};
    btn.onclick=run;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run()}};
    add.append(inp,btn);body.append(manage,members,add);
    card.append(summary,body);groupsEl.appendChild(card)
  })
}
document.getElementById('addGroup').onclick=()=>{const i=groups.length;groups.push({name:'グループ '+(i+1),enabled:true,ids:[]});opened.add(i);render();queueSave()};

addEventListener('message',e=>{
  if(e.origin!==location.origin||e.data?.source!==BRIDGE)return;
  const d=e.data;
  if(d.type==='state'){
    loaded=true;groups=norm(d.groups);if(!groups.length)groups=[{name:'通知フィルター',enabled:true,ids:[]}];
    render();setStatus('@'+account+' の設定を読み込みました','ok')
  }else if(d.type==='saved'){
    setStatus('保存しました','ok')
  }else if(d.type==='return-ready'){
    clearTimeout(returnTimer);
    location.replace(NOTE)
  }else if(d.type==='profiles'){
    for(const p of d.profiles||[])if(p&&p.id)profiles[p.id]=p;
    if(loaded)render()
  }else if(d.type==='error'){
    setStatus(d.message||'処理に失敗しました','err',0)
  }
});
if(!/^[a-z0-9_-]+$/.test(account))setStatus('noteアカウントを確認できません。🔔通知から設定を開き直してください','err',0);
else{post('load');setTimeout(()=>{if(!loaded)setStatus('本人通知ツールとの接続を確認してください','err',0)},3500)}
})();
</script>
</body>
</html>
