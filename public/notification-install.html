<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知ツール更新｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(640px,calc(100% - 22px));margin:auto;padding:24px 0 70px}.card{border:1px solid #36516a;border-radius:18px;background:#0d1620;padding:20px;margin-top:12px}.card h1{font-size:27px;margin:4px 0 10px}.card p{color:#a9b8c8;line-height:1.7}.status{margin-top:12px;padding:11px;border:1px solid #3f5d75;border-radius:11px;background:#09131c;color:#bdeeff;font-size:12px;font-weight:800;line-height:1.6}.ok{border-color:#48704f;background:#0c1b11;color:#b9ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{width:100%;min-height:54px;border:0;border-radius:12px;margin-top:12px;padding:0 14px;background:#b6ff38;color:#071016;font-weight:950;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.tiny{font-size:11px;color:#8092a5;line-height:1.6}.hidden{display:none!important}.guide,.route{margin-top:10px;padding:10px;border:1px solid #304b61;border-radius:10px;background:#0a141e;color:#b8c9d9;font-size:11px;line-height:1.65}.guide strong,.route strong{color:#dff6ff}.route{border-color:#3d5b47;background:#0b1710;color:#b9d8c1}</style></head><body><main class="wrap"><section class="card"><small>TAMPERMONKEY INSTALL</small><h1>本人通知・統計 v2.9.17</h1><p>対応ブラウザ本体から本人通知ツールをインストールします。</p><div id="guide" class="guide">端末・ブラウザを判定中…</div><div id="route" class="route"><strong>この先の流れ</strong><br>このブラウザ → Tampermonkey → noteで実動確認 → INSIGHTへ自動復帰</div><div id="status" class="status">インストール／更新ボタンを押してください。</div><button id="install" class="btn">このブラウザで v2.9.17 をインストール／更新</button><button id="copyPage" class="btn sub hidden">この画面のURLをコピー</button><button id="verify" class="btn sub">インストール済み版を確認してINSIGHTへ戻る</button><p class="tiny">iPhone / iPadでは、rawスクリプト本文を直接開かず、Tampermonkey公式のインストール中継画面へ渡します。英語のコード本文が表示された場合はそのページを閉じ、この画面からやり直してください。</p></section></main><script>
const RAW='https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-notification-sync.user.js',VERSION='2.9.17',q=new URLSearchParams(location.search),UA=navigator.userAgent||'',isAndroid=/Android/i.test(UA),isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isEdge=/EdgA|EdgiOS|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isChromium=/Chrome|CriOS|Chromium/i.test(UA),isSafari=/Safari/i.test(UA)&&!/Chrome|CriOS|Chromium|EdgA|EdgiOS|Edg\/|FxiOS|Firefox|OPR|Opera/i.test(UA),status=document.getElementById('status'),install=document.getElementById('install'),verify=document.getElementById('verify'),guide=document.getElementById('guide'),route=document.getElementById('route'),copyPage=document.getElementById('copyPage');
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:'https://mumei-s.github.io/note-insight/notification-import.html?from=setup'}catch{return'https://mumei-s.github.io/note-insight/notification-import.html?from=setup'}}const back=safeReturn(q.get('return'));
function checkUrl(){return`https://note.com/?mumei_insight_version_check=1&mumei_return=${encodeURIComponent(back)}`}
function beginVerify(){status.className='status';status.textContent='インストール済み版をnote上で確認しています…';location.href=checkUrl()}
function rawUrl(){return`${RAW}?v=2917c&t=${Date.now()}`}
function tmInstallUrl(){return`https://www.tampermonkey.net/script_installation.php#url=${encodeURIComponent(rawUrl())}`}
if(isIOS){if(isSafari){guide.innerHTML='<strong>iPhone / iPad Safari：</strong> Tampermonkey経由でインストールします。';route.innerHTML='<strong>この端末の動線</strong><br>Safari → Tampermonkey公式インストール画面 → インストール → note実動確認 → INSIGHTへ戻る';status.textContent='Safariの拡張機能でTampermonkeyを有効にしてから進んでください。';install.textContent='SafariでTampermonkeyへ渡してインストール'}else{guide.innerHTML='<strong>iPhone / iPad：</strong> Safari＋Tampermonkeyを使用します。';status.className='status warn';status.textContent='Safariでこの画面を開いてください。';install.disabled=true;copyPage.classList.remove('hidden')}}else if(isAndroid&&(isEdge||isFirefox)){guide.innerHTML='<strong>Android：</strong> このブラウザ＋Tampermonkeyで利用できます。'}else if(isAndroid&&isChromium){guide.innerHTML='<strong>Android Chrome：</strong> 本人通知ツールは拡張機能非対応です。EdgeまたはFirefoxを使用してください。';status.className='status warn';status.textContent='Android Chromeではインストールできません。';install.disabled=true}else{guide.innerHTML='<strong>PC / Mac：</strong> Tampermonkey対応ブラウザでそのまま進めます。'}
install.onclick=()=>{if(install.disabled)return;sessionStorage.setItem('mumei-v2917-install-opened',String(Date.now()));status.className='status';status.textContent='インストール画面を開いています…';if(isIOS&&isSafari){location.href=tmInstallUrl();return}const w=window.open(rawUrl(),'_blank','noopener');if(!w){status.className='status warn';status.textContent='新しいタブを開けませんでした。ポップアップを許可してください。'}};
copyPage.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status.className='status ok';status.textContent='✅ この画面のURLをコピーしました。Safariで開いてください。'}catch{status.textContent=location.href}};verify.onclick=beginVerify;
let autoDone=false;function maybeVerify(){if(autoDone||document.visibilityState!=='visible')return;const at=Number(sessionStorage.getItem('mumei-v2917-install-opened')||0);if(!at||Date.now()-at<1500)return;autoDone=true;sessionStorage.removeItem('mumei-v2917-install-opened');setTimeout(beginVerify,300)}window.addEventListener('focus',maybeVerify);window.addEventListener('pageshow',maybeVerify);document.addEventListener('visibilitychange',maybeVerify);
</script></body></html>
