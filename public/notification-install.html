<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store">
<title>通知ツール更新｜INSIGHT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(640px,calc(100% - 22px));margin:auto;padding:24px 0 70px}.card{border:1px solid #36516a;border-radius:18px;background:#0d1620;padding:20px;margin-top:12px}.card h1{font-size:27px;margin:4px 0 10px}.card p{color:#a9b8c8;line-height:1.7}.status{margin-top:12px;padding:11px;border:1px solid #3f5d75;border-radius:11px;background:#09131c;color:#bdeeff;font-size:12px;font-weight:800;line-height:1.6}.ok{border-color:#48704f;background:#0c1b11;color:#b9ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{width:100%;min-height:54px;border:0;border-radius:12px;margin-top:12px;padding:0 14px;background:#b6ff38;color:#071016;font-weight:950;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.tiny{font-size:11px;color:#8092a5;line-height:1.6}.hidden{display:none!important}.guide{margin-top:10px;padding:10px;border:1px solid #304b61;border-radius:10px;background:#0a141e;color:#b8c9d9;font-size:11px;line-height:1.65}.guide strong{color:#dff6ff}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.links{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<section class="card"><small>TAMPERMONKEY INSTALL</small><h1>本人通知・統計 v2.9.9</h1><p>この画面は<strong>Tampermonkeyが動く対応ブラウザ本体</strong>で本人通知ツールをインストールする専用画面です。</p><div id="guide" class="guide">端末・ブラウザを判定中…</div><div id="status" class="status">インストール／更新ボタンを押してください。</div><button id="install" class="btn">v2.9.9 をインストール／更新</button><button id="copyPage" class="btn sub hidden">この画面のURLをコピー</button><button id="verify" class="btn sub">インストール済み版を確認してINSIGHTへ戻る</button><p class="tiny">Tampermonkey公式の一般的な「.user.js / GitHub View raw」方式を使います。インストール画面は別タブで開くため、この画面は残ります。</p><div class="links"><a class="btn sub" href="https://www.tampermonkey.net/" target="_blank" rel="noreferrer">Tampermonkey公式</a><a class="btn sub" href="https://www.tampermonkey.net/faq.php?q=Q406" target="_blank" rel="noreferrer">対応ブラウザ確認</a></div></section>
<section class="card"><strong>うまくインストール画面にならない場合</strong><p id="help" class="tiny">Tampermonkeyを有効にしてから再度お試しください。</p></section>
</main>
<script>
const RAW='https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-notification-sync.user.js',VERSION='2.9.9',q=new URLSearchParams(location.search),UA=navigator.userAgent||'',isAndroid=/Android/i.test(UA),isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isEdge=/EdgA|EdgiOS|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isOpera=/OPR|Opera/i.test(UA),isChromium=/Chrome|CriOS|Chromium/i.test(UA),isSafari=/Safari/i.test(UA)&&!/Chrome|CriOS|Chromium|EdgA|EdgiOS|Edg\/|FxiOS|Firefox|OPR|Opera/i.test(UA),isChromeAndroid=isAndroid&&isChromium&&!isEdge&&!isOpera,status=document.getElementById('status'),install=document.getElementById('install'),verify=document.getElementById('verify'),guide=document.getElementById('guide'),help=document.getElementById('help'),copyPage=document.getElementById('copyPage');
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:'https://mumei-s.github.io/note-insight/notification-import.html?from=setup'}catch{return'https://mumei-s.github.io/note-insight/notification-import.html?from=setup'}}
const back=safeReturn(q.get('return'));
function checkUrl(){return`https://note.com/?mumei_insight_version_check=1&mumei_return=${encodeURIComponent(back)}`}
function beginVerify(){status.className='status';status.textContent='インストール済み版をnote上で確認しています…';location.href=checkUrl()}
function configure(){if(isIOS){if(isSafari){guide.innerHTML='<strong>iPhone / iPad Safari：</strong> Tampermonkey for Safari iOSに対応しています。Safariの拡張機能でTampermonkeyを有効にしてからインストールしてください。';install.textContent='Safariで v2.9.9 をインストール／更新';help.textContent='SafariでTampermonkey拡張が有効なのに文字列だけ表示される場合は、Tampermonkey側がこの.user.js URLを処理できる状態か確認してください。'}else{guide.innerHTML='<strong>iPhone / iPad：</strong> 本人通知ツールはSafari＋Tampermonkeyでインストール・実行します。現在のブラウザからSafariへ開き直してください。';status.className='status warn';status.textContent='このブラウザではインストールしません。Safariでこの画面を開いてください。';install.disabled=true;copyPage.classList.remove('hidden');help.textContent='「この画面のURLをコピー」→ Safariのアドレス欄へ貼り付け → Tampermonkeyを有効にしてインストール、の順です。'}return}if(isAndroid&&isEdge){guide.innerHTML='<strong>Android Edge：</strong> Tampermonkey対応です。現在のEdgeでインストールできます。';install.textContent='Edgeで v2.9.9 をインストール／更新';help.textContent='Edge AndroidではTampermonkeyの「ユーザースクリプトを許可」または開発者モードが必要な場合があります。'}else if(isAndroid&&isFirefox){guide.innerHTML='<strong>Android Firefox：</strong> Tampermonkey for Firefox Android対応です。現在のFirefoxでインストールできます。';install.textContent='Firefoxで v2.9.9 をインストール／更新';help.textContent='Firefox Add-onsでTampermonkeyを有効にしてから再度インストールしてください。'}else if(isChromeAndroid){guide.innerHTML='<strong>Android Chrome：</strong> Chrome Androidは拡張機能を実行できないため本人通知ツール非対応です。EdgeまたはFirefoxを使ってください。';status.className='status warn';status.textContent='Android Chromeではインストールできません。';install.disabled=true;help.textContent='INSIGHTの設定画面へ戻り、「Edge＋Tampermonkey」または「Firefox＋Tampermonkey」を選んでください。'}else if(isEdge){guide.innerHTML='<strong>Microsoft Edge：</strong> Tampermonkey対応です。';install.textContent='Edgeで v2.9.9 をインストール／更新';help.textContent='Tampermonkey 5.3以降のChromium系では、ユーザースクリプト実行許可または開発者モードが必要な場合があります。'}else if(isFirefox){guide.innerHTML='<strong>Firefox：</strong> Tampermonkey対応です。';install.textContent='Firefoxで v2.9.9 をインストール／更新';help.textContent='Tampermonkeyアドオンが有効か確認してください。'}else if(isSafari){guide.innerHTML='<strong>Safari：</strong> Tampermonkey for Safari対応です。';install.textContent='Safariで v2.9.9 をインストール／更新';help.textContent='Safariの拡張機能でTampermonkeyを有効にしてから再度お試しください。'}else if(isChromium||isOpera){guide.innerHTML='<strong>PC Chromium系：</strong> Tampermonkeyなどのユーザースクリプト管理拡張で利用できます。';help.textContent='Tampermonkey 5.3以降ではユーザースクリプト実行許可や開発者モードが必要な場合があります。'}else guide.textContent='Tampermonkeyなどのユーザースクリプト管理機能が動くブラウザで利用できます。'}
configure();
install.onclick=()=>{if(install.disabled)return;sessionStorage.setItem('mumei-v299-install-opened',String(Date.now()));status.className='status';status.textContent='Tampermonkeyのインストール／更新タブを開きました。完了するとこの画面へ戻れます。';const w=window.open(`${RAW}?v=2.9.9&t=${Date.now()}`,'_blank','noopener');if(!w){status.className='status warn';status.textContent='新しいタブを開けませんでした。ポップアップを許可して再度押してください。'}};
copyPage.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status.className='status ok';status.textContent='✅ この画面のURLをコピーしました。Safariのアドレス欄へ貼り付けてください。'}catch{status.className='status';status.textContent=location.href}};
verify.onclick=beginVerify;
let autoDone=false;function maybeVerify(){if(autoDone||document.visibilityState!=='visible')return;const at=Number(sessionStorage.getItem('mumei-v299-install-opened')||0);if(!at||Date.now()-at<1500)return;autoDone=true;sessionStorage.removeItem('mumei-v299-install-opened');window.setTimeout(beginVerify,250)}
window.addEventListener('focus',maybeVerify);window.addEventListener('pageshow',maybeVerify);document.addEventListener('visibilitychange',maybeVerify);
</script></body></html>
