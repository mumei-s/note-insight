<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
  <title>極薄＋通知ツール 更新</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(680px,calc(100% - 16px));margin:auto;padding:14px 0 28px}.card{border:1px solid #344b61;border-radius:16px;background:#0d1620;padding:14px}h1{margin:0 0 8px;font-size:23px}.ver{display:inline-flex;padding:4px 9px;border:1px solid #8b5cf6;border-radius:999px;color:#e9d5ff;background:#21183b;font-size:11px;font-weight:900}.note{margin-top:10px;padding:10px;border:1px solid #32495d;border-radius:10px;background:#09131c;font-size:12px;line-height:1.65;color:#c8d9e7}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:9px;border:1px solid #b6ff38;border-radius:11px;background:#b6ff38;color:#091100;text-decoration:none;font-size:15px;font-weight:950}.sub{background:#122131;color:#e5f2ff;border-color:#405c74}.status{margin-top:9px;font-size:11px;color:#9fb4c6;line-height:1.55}.bad{color:#ffb6b6}.ok{color:#cfff64}</style>
</head>
<body>
<main class="wrap"><section class="card">
  <h1>極薄＋通知ツール</h1>
  <span class="ver">v18.4.1</span>
  <div class="note"><b>#王子ごっこ全件</b>と、<b>INSIGHTの最近の記事のスキ人物を重複なし最大500人</b>で使う版です。<br>インストール済みなら、そのまま同じボタンで上書き更新できます。</div>
  <a id="install" class="btn" href="./note-card-batch-bridge-v610.user.js">インストール／更新</a>
  <a id="raw" class="btn sub" href="https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-card-batch-bridge-v610.user.js">Raw直結で開く</a>
  <div id="status" class="status">Android Edge＋Tampermonkeyでは上の「インストール／更新」を押してください。</div>
</section></main>
<script>
(() => {
  const status=document.getElementById('status');
  const install=document.getElementById('install');
  const ua=navigator.userAgent||'';
  const edge=/EdgA|Edg\//i.test(ua),firefox=/Firefox/i.test(ua),android=/Android/i.test(ua);
  if(android&&edge) status.innerHTML='✅ Android Edgeを確認。<b>Tampermonkeyを有効にした状態で「インストール／更新」</b>を押してください。';
  else if(android&&firefox) status.innerHTML='✅ Android Firefoxを確認。Userscript拡張を有効にして「インストール／更新」を押してください。';
  else if(android) status.innerHTML='Androidブラウザを確認。Userscript拡張が反応しない場合はEdge＋Tampermonkeyでこのページを開いてください。';
  install.addEventListener('click',()=>{status.className='status ok';status.textContent='Userscriptマネージャーの更新確認画面が開けば、そのまま更新してください。';});
  window.addEventListener('pageshow',()=>{install.href='./note-card-batch-bridge-v610.user.js?ts='+Date.now();});
})();
</script>
</body>
</html>
