<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>通知自動同期｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(680px,calc(100% - 22px));margin:auto;padding:20px 0 70px}.back{color:#8feaff;text-decoration:none;font-weight:900}.hero{padding:28px 0 8px}.hero small{color:#8feaff;font-weight:900;letter-spacing:.12em}.hero h1{font-size:34px;margin:5px 0}.hero p,.muted{color:#9aa9bb;line-height:1.7}.panel{border:1px solid #2c3c51;border-radius:16px;background:#0d141d;padding:16px;margin-top:12px}.primary{border-color:#376982;background:#0c1923}.pair{border-color:#506425;background:#12190d}.panel h2{margin:0 0 8px;font-size:20px}.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;margin-right:6px;background:#142638;color:#8feaff;font-size:14px}.btn{width:100%;min-height:54px;border:0;border-radius:11px;padding:0 14px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:950;margin-top:10px;text-align:center;cursor:pointer;background:#54d8ff;color:#071016;font-size:15px}.btn.green{background:#b6ff38}.btn.dark{background:#121d29;color:#fff;border:1px solid #42556c}.status{margin-top:10px;padding:10px;border-radius:10px;background:#101923;color:#9effbd;font-weight:850}.tiny{font-size:11px;color:#7f8ea2;line-height:1.6}.done{display:flex;gap:9px;align-items:flex-start}.done b{color:#9effbd}</style></head><body><main class="wrap"><a class="back" href="./#dashboard">← INSIGHTへ戻る</a><header class="hero"><small>NOTIFICATION SYNC</small><h1>通知を自動同期</h1><p>最初だけ①→②。設定後は、noteで通知ベルを開くだけです。</p></header><section class="panel primary"><h2><span class="num">1</span>通知同期を更新／インストール</h2><p class="muted">すでに入っている場合も、ここを押して最新版へ更新してください。</p><a class="btn" href="https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-notification-sync.user.js">通知同期を更新／インストール</a><p class="tiny">ユーザースクリプトのインストール・更新画面が開きます。</p></section><section class="panel pair"><h2><span class="num">2</span>この端末を連携</h2><p class="muted">初回だけ必要です。すでに連携済みなら飛ばしてOKです。</p><button id="pair" class="btn green">この端末を連携する</button><div id="pairStatus" class="status" hidden></div></section><section class="panel"><div class="done"><b>✓</b><div><strong>設定後</strong><p class="muted" style="margin:4px 0 0">普段どおりnoteの通知ベルを開けば、自動でINSIGHTへ同期します。</p></div></div><a class="btn dark" href="https://note.com/?mumei_notify=1" target="_blank" rel="noreferrer">今すぐnoteの通知を開く</a><div id="stats" class="status">INSIGHT保存状況を確認中…</div></section></main><script>const TOKEN='https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-notification-import-token',OWNER='mumei-unified-owner-token';const stats=document.getElementById('stats'),pair=document.getElementById('pair'),pairStatus=document.getElementById('pairStatus');async function call(action){const r=await fetch(TOKEN,{method:'POST',headers:{'Content-Type':'application/json','X-Owner-Token':localStorage.getItem(OWNER)||''},body:JSON.stringify({action}),cache:'no-store'});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'処理できませんでした');return p}(async()=>{try{const p=await call('stats');stats.textContent=`INSIGHT保存済み ${Number(p.total||0)}件${p.last?'・最終 '+new Intl.DateTimeFormat('ja-JP',{dateStyle:'short',timeStyle:'short'}).format(new Date(p.last)):''}`}catch(e){stats.textContent=e.message==='OWNER_LOGIN_REQUIRED'?'先にOWNER本人認証が必要です。':e.message}})();pair.onclick=async()=>{pair.disabled=true;pair.textContent='連携準備中…';pairStatus.hidden=false;pairStatus.textContent='一時コードを発行しています…';try{const p=await call('pair-start');pairStatus.textContent='noteへ移動します。連携後は通知ベルを開くだけで同期されます。';location.href=p.noteUrl}catch(e){pairStatus.textContent=e.message;pair.disabled=false;pair.textContent='この端末を連携する'}};</script></body></html>
