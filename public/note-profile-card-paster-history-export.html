<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>極薄サムネイル｜スキ履歴取得</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071018;color:#e8f5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}
    .card{width:min(460px,100%);border:1px solid #244158;border-radius:18px;padding:20px;background:#0b1723;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    h1{font-size:18px;margin:0 0 10px;color:#8feaff}.status{font-size:13px;line-height:1.65;color:#c9d8e4}.bad{color:#ffb6b6}.ok{color:#cfff64}button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:11px;background:#cfff64;color:#172104;font-weight:900}
  </style>
</head>
<body>
<main><section class="card"><h1>極薄｜スキ履歴取得</h1><div id="status" class="status">直近のスキ履歴を人物重複なしで取得しています…</div><button id="close" type="button" hidden>閉じる</button></section></main>
<script>
(() => {
  'use strict';
  const TOKEN_KEY = 'mumei-insight-access-token';
  const ENDPOINT = 'https://xxhaerjvrgmnadxjqetz.supabase.co/functions/v1/insight-likes-export';
  const EDITOR_ORIGIN = 'https://editor.note.com';
  const status = document.getElementById('status');
  const close = document.getElementById('close');
  const q = new URLSearchParams(location.search);
  const requestId = String(q.get('request') || '');
  const count = Math.max(1, Math.min(1500, Number(q.get('count') || 200)));
  const unique = q.get('unique') !== '0';
  const recentArticles = false;
  const expectedMember = String(localStorage.getItem('mumei-insight-active-account-v3') || '').trim().toLowerCase();

  function show(text, kind='') {
    status.textContent = text;
    status.className = `status ${kind}`;
  }
  function send(payload) {
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type:'MUMEI_INSIGHT_LIKES_V1', requestId, ...payload }, EDITOR_ORIGIN);
        return true;
      }
    } catch (_) {}
    return false;
  }
  close.onclick = () => window.close();

  function savedMemberToken() {
    const selected = String(localStorage.getItem('mumei-insight-active-account-v3') || '').toLowerCase();
    if(selected && localStorage.getItem('mumei-insight-explicit-logout:'+selected)==='1')return '';
    const current = localStorage.getItem(TOKEN_KEY) || '';
    const accounts=new Map();
    for(const key of ['mumei-insight-saved-accounts-v2','mumei-insight-saved-accounts-v3']){
      try{const rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))continue;for(const row of rows){const id=String(row?.noteId||'').toLowerCase();if(id&&row?.memberToken&&row.status==='active'&&localStorage.getItem('mumei-insight-explicit-logout:'+id)!=='1')accounts.set(id,row);}}catch{}
    }
    if(selected)return accounts.get(selected)?.memberToken||current;
    return current||(accounts.size===1?[...accounts.values()][0].memberToken:'');
  }

  async function run() {
    if (!requestId) {
      show('取得要求IDがありません。note編集画面から開き直してください。','bad');
      close.hidden = false;
      return;
    }
    const token = savedMemberToken();
    if (!token) {
      show('保存済みのログイン情報を確認できません。極薄の取得を停止しました。','bad');
      send({ ok:false, error:'INSIGHT_LOGIN_REQUIRED' });
      close.hidden = false;
      return;
    }
    try {
      show(recentArticles ? `最近の記事から順に、重複なし最大 ${count}人を取得中…` : `スキ履歴から最大 ${count}人を取得中…`);
      const response = await fetch(ENDPOINT, {
        method:'POST',
        cache:'no-store',
        headers:{ 'Content-Type':'application/json', 'X-Insight-Token':token },
        body:JSON.stringify({ count, unique, scope:recentArticles?'recent-articles':'recent-likes' })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload?.ok === false) throw new Error(String(payload?.error || `HTTP_${response.status}`));
      if (expectedMember && String(payload?.member?.noteId || '').toLowerCase() !== expectedMember) throw new Error('保存されたアカウントと取得結果が一致しません');
      const rows = Array.isArray(payload?.rows) ? payload.rows : [];
      if (!rows.length) throw new Error('INSIGHT_LIKES_EMPTY');
      const delivered = send({ ok:true, rows, count:rows.length, member:payload.member || null, sourceArticles:payload.sourceArticles || [] });
      if (!delivered) {
        show(`取得は完了しました（${rows.length}人）が、元のnote編集画面へ返せませんでした。note編集画面へ戻ってもう一度押してください。`,'bad');
        close.hidden = false;
        return;
      }
      const articleCount = Array.isArray(payload?.sourceArticles) ? payload.sourceArticles.length : 0;
      show(recentArticles ? `最近の記事 ${articleCount}本から ${rows.length}人 取得完了。note編集画面へ戻します。` : `スキ履歴から ${rows.length}人 取得完了。note編集画面へ戻します。`,'ok');
      setTimeout(() => window.close(), 650);
    } catch (error) {
      const message = error?.message || String(error);
      send({ ok:false, error:message });
      show(`取得失敗：${message}`,'bad');
      close.hidden = false;
    }
  }
  run().catch(error => { send({ok:false,error:error?.message||String(error)}); show('履歴取得を停止しました：'+(error?.message||String(error)),'bad'); close.hidden=false; });
})();
</script>
</body>
</html>
