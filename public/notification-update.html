<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 更新｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(660px,calc(100% - 16px));margin:auto;padding:8px 0 20px}.card{border:1px solid #35506b;border-radius:14px;background:#0d1620;padding:10px}.card h1{font-size:23px;margin:3px 0 6px}.card p{color:#a9b8c8;line-height:1.45;margin:6px 0}.badge{display:inline-flex;padding:3px 7px;border:1px solid #5ecde7;border-radius:999px;color:#bdf4ff;background:#102737;font-weight:950;font-size:10px}.status,.guide{margin-top:6px;padding:8px 9px;min-height:38px;border:1px solid #3f5d75;border-radius:9px;background:#09131c;color:#bdeeff;font-size:11px;line-height:1.4}.ok{border-color:#48704f;background:#0c1b11;color:#b9ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{width:100%;min-height:42px;border:0;border-radius:9px;margin-top:6px;padding:7px 10px;background:#b6ff38;color:#071016;font-weight:950;font-size:13px;display:flex;align-items:center;justify-content:center;text-decoration:none}.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.apple{background:#152535;color:#e6f6ff;border:1px solid #50728a}.apple-links{display:none;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.apple-links.show{display:grid}.apple-links a{min-height:38px;border:1px solid #405c74;border-radius:9px;background:#101c29;color:#dceeff;text-decoration:none;display:grid;place-items:center;text-align:center;padding:6px;font-weight:900;font-size:10px}.tiny{font-size:10.5px;color:#8092a5}</style></head><body><main class="wrap"><section class="card"><small>NOTIFICATION TOOL UPDATE</small><h1>本人通知・統計 更新</h1><span class="badge">最新版 v2.9.59</span><p><strong>前回保存位置から上方向へ続き読込</strong>。停止した地点まで保存し、次回はその続きから再開します。日付指定はINSIGHTの【通知】側で行います。</p><div id="guide" class="guide">ブラウザを確認中…</div><div id="appleLinks" class="apple-links"><a href="https://apps.apple.com/jp/app/userscripts/id1463298887" target="_blank" rel="noreferrer">Safari用 Userscripts</a><a href="https://apps.apple.com/app/tampermonkey/id6738342400" target="_blank" rel="noreferrer">Safari用 Tampermonkey</a></div><div id="status" class="status">現在の版を確認しています…</div><button id="install" class="btn">v2.9.59 をインストール／更新</button><button id="verify" class="btn sub">最新版か確認する</button><p class="tiny">Safariでは.user.jsタブを自動で閉じません。Safariの拡張機能からインストール後、この画面へ戻って「最新版か確認する」を押してください。Chrome/Edge/Firefox系では従来どおり自動確認します。</p></section></main><script>
const VERSION='2.9.59',PENDING='mumei-notification-update-pending',q=new URLSearchParams(location.search),UA=navigator.userAgent||'',role=q.get('role')==='owner'?'owner':'member',isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isIOSAlt=/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA),isSafari=/Safari\//i.test(UA)&&!/Chrome|Chromium|CriOS|FxiOS|Edg|EdgiOS|OPiOS|Android/i.test(UA),isMacSafari=!isIOS&&/Macintosh/i.test(UA)&&isSafari,status=document.getElementById('status'),guide=document.getElementById('guide'),install=document.getElementById('install'),verify=document.getElementById('verify'),appleLinks=document.getElementById('appleLinks'),PAGE_SCRIPT=new URL('./note-insight-notification-sync.user.js',location.href).href,RAW_SCRIPT='https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-notification-sync.user.js?v=2959a';
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./notification-entry.html',location.href).href}catch{return new URL('./notification-entry.html',location.href).href}}const back=safeReturn(q.get('return')),resultPage=new URL('./notification-setup.html',location.href);resultPage.searchParams.set('role',role);resultPage.searchParams.set('return',back);const checkUrl=()=>`https://note.com/?mumei_insight_version_check=1&mumei_return=${encodeURIComponent(resultPage.href)}`;
function current(){return localStorage.getItem('mumei-notification-tool-version')||''}function paint(){const v=current();status.className='status '+(v===VERSION?'ok':'warn');status.textContent=v===VERSION?`✅ 本人通知 v${VERSION}｜最新版`:`この端末 ${v||'未確認'} → 最新 v${VERSION}`}paint();
if(isIOS&&isSafari){appleLinks.classList.add('show');guide.innerHTML='<strong>iPhone / iPad Safari 正式対応。</strong><br>① Userscripts または Tampermonkey を入れる → ② 設定 ＞ Safari ＞ 拡張機能でON・note.comとmumei-s.github.ioを許可 → ③ 下の「インストール／更新」で.user.jsを開く → ④ Safariの拡張機能ボタンからUserscripts/Tampermonkeyで追加 → ⑤ この画面へ戻り「最新版か確認する」。';install.textContent=`Safariで v${VERSION} の.user.jsを開く`;install.classList.add('apple')}else if(isIOS&&isIOSAlt){appleLinks.classList.add('show');guide.innerHTML='<strong>iPhone / iPad はSafariで本人通知を設定してください。</strong><br>iOS版Chrome・Edge・Firefox上ではSafari拡張の実行を保証できません。SafariでこのINSIGHTを開き、UserscriptsまたはTampermonkeyを有効にしてください。';install.textContent='Safariで開いてからインストール'}else if(isMacSafari){appleLinks.classList.add('show');guide.innerHTML='<strong>Mac Safari対応。</strong> Userscripts または TampermonkeyのSafari拡張を有効にし、.user.jsを開いた後に拡張機能から追加してください。';install.textContent=`Safariで v${VERSION} の.user.jsを開く`;install.classList.add('apple')}else if(isAndroid&&(isEdge||isFirefox)){guide.textContent='Android対応。Tampermonkeyを有効化し、ユーザースクリプト実行許可をONにして更新してください。'}else{guide.textContent='Chrome / Edge / Firefoxなど、Tampermonkey対応ブラウザで更新してください。';}
function savePending(){localStorage.setItem(PENDING,JSON.stringify({at:Date.now(),expected:VERSION,back,role}))}function verifyNow(){savePending();location.assign(checkUrl())}
let child=null,started=0,fallback=false,finished=false,timer=0,manualSafari=false;function openChild(url){try{child=window.open(url,'mumei-notification-install')}catch{child=null}return child}function finishToVerify(){if(finished)return;finished=true;clearTimeout(timer);try{if(child&&!child.closed)child.close()}catch{}status.className='status';status.textContent='更新結果を確認しています…';window.focus();setTimeout(verifyNow,180)}function inspectChild(){if(finished||manualSafari)return;const elapsed=Date.now()-started;if(!child||child.closed){finishToVerify();return}try{const u=new URL(child.location.href);const rawSameOrigin=u.origin===location.origin&&/\.user\.js$/i.test(u.pathname);if(rawSameOrigin&&elapsed>1700&&!fallback){try{child.close()}catch{}fallback=true;status.className='status warn';status.textContent='文字列表示を検出。インストール用の別経路を開きます…';started=Date.now();child=openChild(RAW_SCRIPT);timer=setTimeout(inspectChild,650);return}}catch{}if(elapsed>15000){finishToVerify();return}timer=setTimeout(inspectChild,650)}
install.onclick=()=>{if(isIOS&&isIOSAlt){status.className='status warn';status.textContent='このiPhone/iPadではSafariでINSIGHTを開いてからインストールしてください。';return}savePending();finished=false;fallback=false;started=Date.now();manualSafari=(isIOS&&isSafari)||isMacSafari;status.className='status';status.textContent=manualSafari?'Safariで.user.jsを開きます。開いたタブのSafari拡張機能からUserscripts/Tampermonkeyで追加してください。完了後この画面へ戻って「最新版か確認する」を押してください。':'インストール画面を別タブで開いています…';child=openChild(PAGE_SCRIPT);if(!child){status.className='status warn';status.textContent='別タブを開けません。ポップアップ許可を確認してください。';return}clearTimeout(timer);if(!manualSafari)timer=setTimeout(inspectChild,700)};verify.onclick=verifyNow;window.addEventListener('focus',()=>{if(!manualSafari&&started&&Date.now()-started>2200&&!finished)setTimeout(()=>{if(!finished)finishToVerify()},500)});
</script></body></html>
