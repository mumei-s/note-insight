<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 更新｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(660px,calc(100% - 16px));margin:auto;padding:8px 0 20px}.card{border:1px solid #35506b;border-radius:14px;background:#0d1620;padding:10px}.card h1{font-size:23px;margin:3px 0 6px}.card p{color:#a9b8c8;line-height:1.45;margin:6px 0}.badge{display:inline-flex;padding:3px 7px;border:1px solid #5ecde7;border-radius:999px;color:#bdf4ff;background:#102737;font-weight:950;font-size:10px}.status,.guide{margin-top:6px;padding:8px 9px;min-height:38px;border:1px solid #3f5d75;border-radius:9px;background:#09131c;color:#bdeeff;font-size:11px;line-height:1.4}.ok{border-color:#48704f;background:#0c1b11;color:#b9ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{width:100%;min-height:42px;border:0;border-radius:9px;margin-top:6px;padding:7px 10px;background:#b6ff38;color:#071016;font-weight:950;font-size:13px;display:flex;align-items:center;justify-content:center}.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.tiny{font-size:10.5px;color:#8092a5}</style></head><body><main class="wrap"><section class="card"><small>NOTIFICATION TOOL UPDATE</small><h1>本人通知・統計 更新</h1><span class="badge">最新版 v2.9.54</span><p><strong>DM遮蔽不具合の修正版。</strong> 「通知」「お知らせ」タブが実際に見えている通知画面だけでパネルを表示し、DM・メッセージ・投稿・プロフィールでは完全に非表示にします。</p><div id="guide" class="guide">ブラウザを確認中…</div><div id="status" class="status">現在の版を確認しています…</div><button id="install" class="btn">v2.9.54 をインストール／更新</button><button id="verify" class="btn sub">最新版か確認する</button><p class="tiny">更新後はnoteを1回再読み込み。DMへ移動した時点で本人通知パネルは消え、🔔通知画面へ戻った時だけ再表示します。</p></section></main><script>
const VERSION='2.9.54',PENDING='mumei-notification-update-pending',q=new URLSearchParams(location.search),UA=navigator.userAgent||'',role=q.get('role')==='owner'?'owner':'member',isAndroid=/Android/i.test(UA),isEdge=/EdgA|Edg\//i.test(UA),isFirefox=/Firefox/i.test(UA),status=document.getElementById('status'),guide=document.getElementById('guide'),install=document.getElementById('install'),verify=document.getElementById('verify'),SCRIPT=new URL('./note-insight-notification-sync.user.js',location.href).href;
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./notification-entry.html',location.href).href}catch{return new URL('./notification-entry.html',location.href).href}}const back=safeReturn(q.get('return')),resultPage=new URL('./notification-setup.html',location.href);resultPage.searchParams.set('role',role);resultPage.searchParams.set('return',back);const checkUrl=()=>`https://note.com/?mumei_insight_version_check=1&mumei_return=${encodeURIComponent(resultPage.href)}`;
function current(){return localStorage.getItem('mumei-notification-tool-version')||''}function paint(){const v=current();status.className='status '+(v===VERSION?'ok':'warn');status.textContent=v===VERSION?`✅ 本人通知 v${VERSION}｜最新版`:`この端末 ${v||'未確認'} → 最新 v${VERSION}`}paint();guide.textContent=isAndroid&&(isEdge||isFirefox)?'Android対応。Tampermonkeyを有効化して更新してください。':'Tampermonkeyが有効な対応ブラウザで更新してください。';
function savePending(){localStorage.setItem(PENDING,JSON.stringify({at:Date.now(),expected:VERSION,back,role}))}function verifyNow(){savePending();location.assign(checkUrl())}install.onclick=()=>{savePending();status.textContent='インストール画面を開いています…';const w=window.open(SCRIPT,'mumei-notification-install');if(!w){status.className='status warn';status.textContent='別タブを開けません。ポップアップ許可を確認してください。'}};verify.onclick=verifyNow;window.addEventListener('focus',()=>{try{const p=JSON.parse(localStorage.getItem(PENDING)||'null');if(p?.expected===VERSION&&Date.now()-Number(p.at||0)>1200)verifyNow()}catch{}});
</script></body></html>
