<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 更新｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(640px,calc(100% - 22px));margin:auto;padding:24px 0 80px}.card{border:1px solid #35506b;border-radius:18px;background:#0d1620;padding:20px;margin-top:12px}.card h1{font-size:27px;margin:4px 0 9px}.card p{color:#a9b8c8;line-height:1.7}.badge{display:inline-flex;padding:5px 9px;border:1px solid #5ecde7;border-radius:999px;color:#bdf4ff;background:#102737;font-weight:950;font-size:11px}.status,.guide{margin-top:11px;padding:11px;border:1px solid #3f5d75;border-radius:11px;background:#09131c;color:#bdeeff;font-size:12px;font-weight:800;line-height:1.6}.guide{color:#b8c9d9}.ok{border-color:#48704f;background:#0c1b11;color:#b9ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{width:100%;min-height:54px;border:0;border-radius:12px;margin-top:12px;padding:0 14px;background:#b6ff38;color:#071016;font-weight:950;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.btn.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.btn:disabled{opacity:.5}.tiny{font-size:11px;color:#8092a5;line-height:1.6}</style></head><body><main class="wrap"><section class="card"><small>NOTIFICATION TOOL UPDATE</small><h1>本人通知・統計 更新</h1><span class="badge">最新版 v2.9.35</span><p><strong>手動保存専用です。</strong> 🔔の操作バーをnote側のモーダルから完全分離し、「スキをつけたユーザー」など別パネルに連動して消える不具合を修正しました。保存位置は内部で継続利用し、見た目の境界表示は出しません。</p><div id="guide" class="guide">ブラウザを確認中…</div><div id="status" class="status">現在の版を確認しています…</div><button id="install" class="btn">v2.9.35 をインストール／更新</button><button id="verify" class="btn sub">版だけ確認する</button><button id="copy" class="btn sub">インストールURLをコピー</button><p class="tiny">インストール画面は同じタブで開きます。更新／インストール完了後はブラウザの「←」でこのページへ戻ってください。自動で版を確認し、成功後は元の本人通知・設定へ戻ります。</p></section></main><script>
const VERSION='2.9.35',SCRIPT='https://raw.githubusercontent.com/mumei-s/note-insight/main/public/note-insight-notification-sync.user.js',PENDING='mumei-notification-update-pending-v2935',q=new URLSearchParams(location.search),UA=navigator.userAgent||'',isAndroid=/Android/i.test(UA),isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isYahoo=/YJApp|Yahoo!|YahooBrowser|YBrowser|jp\.co\.yahoo\.android\.(?:yjtop|ybrowser)/i.test(UA),isEdge=/EdgA|EdgiOS|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isChromium=/Chrome|CriOS|Chromium/i.test(UA),isSafari=/Safari/i.test(UA)&&!/Chrome|CriOS|Chromium|EdgA|EdgiOS|Edg\/|FxiOS|Firefox/i.test(UA),isChromeAndroid=isAndroid&&isChromium&&!isEdge,status=document.getElementById('status'),guide=document.getElementById('guide'),install=document.getElementById('install'),verify=document.getElementById('verify'),copy=document.getElementById('copy');
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:new URL('./notification-setup.html?from=insight',location.href).href}catch{return new URL('./notification-setup.html?from=insight',location.href).href}}
const back=safeReturn(q.get('return'));
function checkUrl(){return`https://note.com/?mumei_insight_version_check=1&mumei_return=${encodeURIComponent(back)}`}
function currentVersion(){return localStorage.getItem('mumei-notification-tool-version')||q.get('notificationInstalled')||''}
function paint(){const installed=currentVersion();if(installed===VERSION){status.className='status ok';status.textContent=`✅ この端末は v${VERSION} 確認済みです。`}else if(installed){status.className='status warn';status.textContent=`更新あり：現在 v${installed} → 最新 v${VERSION}`}else{status.className='status warn';status.textContent=`この端末の本人通知版は未確認です。v${VERSION}へ更新してください。`}}
paint();
if(isYahoo){guide.innerHTML='<strong>Yahooアプリ内ブラウザ：</strong>本人通知ツールは非対応です。Edge / Firefox / Safariへ切り替えてください。';install.disabled=true}else if(isChromeAndroid){guide.innerHTML='<strong>Android Chrome：</strong>本人通知ツールは実行できません。Edge＋Tampermonkey または Firefox＋Tampermonkeyを使ってください。';install.disabled=true}else if(isAndroid&&isEdge){guide.innerHTML='<strong>Android Edge：</strong>Tampermonkeyを有効にして更新してください。インストール後はブラウザの←でこのページへ戻ります。'}else if(isAndroid&&isFirefox){guide.innerHTML='<strong>Android Firefox：</strong>Tampermonkeyで更新できます。インストール後はブラウザの←でこのページへ戻ります。'}else if(isIOS&&isSafari){guide.innerHTML='<strong>iPhone / iPad Safari：</strong>ユーザースクリプト拡張を有効にして更新してください。'}else if(isIOS){guide.innerHTML='<strong>iPhone / iPad：</strong>Safariで開き直してください。';install.disabled=true}else if(isSafari){guide.innerHTML='<strong>Mac Safari：</strong>対応するユーザースクリプト拡張を有効にして更新してください。'}else{guide.innerHTML='<strong>対応ブラウザ：</strong>同じタブでインストール画面を開き、←で戻ると自動確認します。'}
let verifying=false;
function pending(){try{return JSON.parse(sessionStorage.getItem(PENDING)||'null')}catch{return null}}
function autoVerify(){if(verifying)return;const p=pending();if(!p||Date.now()-Number(p.at||0)<800)return;verifying=true;sessionStorage.removeItem(PENDING);status.className='status';status.textContent='更新結果をnote側で確認しています…';location.href=checkUrl()}
install.onclick=()=>{if(install.disabled)return;sessionStorage.setItem(PENDING,JSON.stringify({at:Date.now(),back}));status.className='status';status.textContent='インストール／更新を完了したら、ブラウザの←でこのページへ戻ってください。';location.assign(SCRIPT)};
verify.onclick=()=>{sessionStorage.removeItem(PENDING);status.className='status';status.textContent='note側で版を確認しています…';location.href=checkUrl()};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(SCRIPT);status.className='status ok';status.textContent='✅ インストールURLをコピーしました。'}catch{status.textContent=SCRIPT}};
window.addEventListener('focus',()=>setTimeout(autoVerify,120));window.addEventListener('pageshow',()=>setTimeout(autoVerify,120));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(autoVerify,120)});
</script></body></html>
