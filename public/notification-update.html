<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>本人通知 更新｜INSIGHT</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}.wrap{width:min(640px,calc(100% - 22px));margin:auto;padding:24px 0 80px}.card{border:1px solid #35506b;border-radius:18px;background:#0d1620;padding:20px;margin-top:12px}.card h1{font-size:27px;margin:4px 0 9px}.card p{color:#a9b8c8;line-height:1.7}.badge{display:inline-flex;padding:5px 9px;border:1px solid #5ecde7;border-radius:999px;color:#bdf4ff;background:#102737;font-weight:950;font-size:11px}.status,.guide{margin-top:11px;padding:11px;border:1px solid #3f5d75;border-radius:11px;background:#09131c;color:#bdeeff;font-size:12px;font-weight:800;line-height:1.6}.guide{color:#b8c9d9}.ok{border-color:#48704f;background:#0c1b11;color:#b9ffca}.warn{border-color:#765f2f;background:#1c1609;color:#ffe4a0}.btn{width:100%;min-height:54px;border:0;border-radius:12px;margin-top:12px;padding:0 14px;background:#b6ff38;color:#071016;font-weight:950;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.btn.sub{background:#122131;color:#dbeeff;border:1px solid #405c74}.btn:disabled{opacity:.5}.tiny{font-size:11px;color:#8092a5;line-height:1.6}</style></head><body><main class="wrap"><section class="card"><small>NOTIFICATION TOOL UPDATE</small><h1>本人通知・統計 更新</h1><span class="badge">最新版 v2.9.24</span><p>これは<strong>本人通知ツールだけ</strong>の更新画面です。INSIGHT本体や公開データの更新とは分けています。v2.9.24は通知を古い側から継ぎ足し保存し、保存到達点を表示します。</p><div id="guide" class="guide">ブラウザを確認中…</div><div id="status" class="status">現在の版を確認しています…</div><button id="install" class="btn">v2.9.24 をインストール／更新</button><button id="verify" class="btn sub">インストール済み版を確認してINSIGHTへ戻る</button><button id="copy" class="btn sub">インストールURLをコピー</button><p class="tiny">対応：iPhone/iPad Safari、Android Edge / Firefox、PC Chrome / Edge / Firefox、Mac Safari。Android ChromeとYahooアプリ内ブラウザでは本人通知userscriptは実行しません。</p></section></main><script>
const VERSION='2.9.24',SCRIPT='https://mumei-s.github.io/note-insight/note-insight-notification-sync.user.js',q=new URLSearchParams(location.search),UA=navigator.userAgent||'',isAndroid=/Android/i.test(UA),isIOS=/iPhone|iPad|iPod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isYahoo=/YJApp|Yahoo!|YahooBrowser|YBrowser|jp\.co\.yahoo\.android\.(?:yjtop|ybrowser)/i.test(UA),isEdge=/EdgA|EdgiOS|Edg\//i.test(UA),isFirefox=/Firefox|FxiOS/i.test(UA),isChromium=/Chrome|CriOS|Chromium/i.test(UA),isSafari=/Safari/i.test(UA)&&!/Chrome|CriOS|Chromium|EdgA|EdgiOS|Edg\/|FxiOS|Firefox/i.test(UA),isChromeAndroid=isAndroid&&isChromium&&!isEdge,installed=localStorage.getItem('mumei-notification-tool-version')||'',status=document.getElementById('status'),guide=document.getElementById('guide'),install=document.getElementById('install'),verify=document.getElementById('verify'),copy=document.getElementById('copy');
function safeReturn(v){try{const u=new URL(String(v||''));return u.origin==='https://mumei-s.github.io'&&u.pathname.startsWith('/note-insight/')?u.href:'https://mumei-s.github.io/note-insight/notification-entry.html'}catch{return'https://mumei-s.github.io/note-insight/notification-entry.html'}}const back=safeReturn(q.get('return'));
function checkUrl(){return`https://note.com/?mumei_insight_version_check=1&mumei_return=${encodeURIComponent(back)}`}
if(installed===VERSION){status.className='status ok';status.textContent=`✅ この端末は v${VERSION} 実動確認済みです。`}else if(installed){status.className='status warn';status.textContent=`更新あり：現在 v${installed} → 最新 v${VERSION}`}else{status.className='status warn';status.textContent=`この端末の本人通知版は未確認です。v${VERSION}をインストール／更新してください。`}
if(isYahoo){guide.innerHTML='<strong>Yahooアプリ内ブラウザ：</strong>本人通知ツールは非対応です。Edge / Firefox / Safariへ切り替えてください。';install.disabled=true}else if(isChromeAndroid){guide.innerHTML='<strong>Android Chrome：</strong>本人通知ツールは実行できません。Edge＋Tampermonkey または Firefox＋Tampermonkeyを使ってください。';install.disabled=true}else if(isAndroid&&isEdge){guide.innerHTML='<strong>Android Edge：</strong>Tampermonkeyを有効化し、ユーザースクリプト実行許可／開発者モードをONにして更新します。'}else if(isAndroid&&isFirefox){guide.innerHTML='<strong>Android Firefox：</strong>Tampermonkeyでそのまま更新できます。'}else if(isIOS&&isSafari){guide.innerHTML='<strong>iPhone / iPad Safari：</strong>Tampermonkey Safari拡張をONにして更新します。'}else if(isIOS){guide.innerHTML='<strong>iPhone / iPad：</strong>このページをSafariで開き、Tampermonkey Safari拡張から更新してください。';install.disabled=true}else if(isSafari){guide.innerHTML='<strong>Mac Safari：</strong>Tampermonkey for Safariを有効にして更新します。'}else if(isEdge||isChromium||isFirefox){guide.innerHTML='<strong>対応ブラウザ：</strong>Tampermonkeyを有効にして更新できます。'}else{guide.textContent='Tampermonkey対応ブラウザから更新してください。'}
install.onclick=()=>{if(install.disabled)return;sessionStorage.setItem('mumei-v2924-update-opened',String(Date.now()));status.className='status';status.textContent='Tampermonkeyのインストール／更新画面へ移動します…';location.href=SCRIPT};
verify.onclick=()=>{status.className='status';status.textContent='note上でv2.9.24の実動確認をしています…';location.href=checkUrl()};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(SCRIPT);status.className='status ok';status.textContent='✅ インストールURLをコピーしました。'}catch{status.textContent=SCRIPT}};
let once=false;function maybeVerify(){if(once||document.visibilityState!=='visible')return;const at=Number(sessionStorage.getItem('mumei-v2924-update-opened')||0);if(!at||Date.now()-at<1200)return;once=true;sessionStorage.removeItem('mumei-v2924-update-opened');setTimeout(()=>{location.href=checkUrl()},450)}addEventListener('focus',maybeVerify);addEventListener('pageshow',maybeVerify);document.addEventListener('visibilitychange',maybeVerify);
</script></body></html>
